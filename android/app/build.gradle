/* Tikita APK — TWA (Trusted Web Activity) sarmalayıcı.
   Uygulamanın KENDİSİ web sitesidir (tikita-2026.web.app); bu APK yalnız onu
   tam ekran, kendi ikonuyla açar. Site güncellenince APK'yı YENİDEN DERLEMEYE
   GEREK YOKTUR — ancak ikon/ad/adres değişirse yeniden derlenir.

   İmzalama: anahtar depoyu ASLA repoda tutmayız (repo herkese açık) — CI onu
   ANDROID_KEYSTORE_B64 secret'ından çözer ve yolunu TIKITA_KEYSTORE ile verir.
   Anahtar yoksa imzasız derlenir (yerel deneme); imzasız APK telefona kurulmaz. */
plugins {
    id "com.android.application"
}

// appcompat 1.7.0'ın çektiği kotlin-stdlib sürümü — bkz. dependencies{} içindeki
// "KOTLIN STDLIB İKİLENMESİ" notu. appcompat yükseltilirse buraya da bak.
def KOTLIN_SURUM = "1.8.22"

def ksYol = System.getenv("TIKITA_KEYSTORE")
def ksSifre = System.getenv("TIKITA_KEYSTORE_PASSWORD")
def ksVar = ksYol != null && !ksYol.isEmpty() && file(ksYol).exists()

android {
    namespace "com.tikita.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.tikita.app"
        minSdk 21
        targetSdk 34
        // Sürüm CI'dan gelir (run_number sürekli artar → güncelleme kurulabilir).
        //
        // DİKKAT — Groovy tuzağı: `versionCode (X).toInteger()` yazılmaz.
        // Metot adından sonra boşluk+parantez, Groovy'de argüman listesi sayılır:
        // önce versionCode(X) STRING ile çağrılır, .toInteger() ise o çağrının
        // DÖNÜŞÜNE (null) uygulanır → "Value is null" ile derleme düşer.
        // Sözdizimi geçerli olduğu için groovyc bunu yakalamaz, yalnız çalışırken
        // patlar. Parantezle başlamayan bir ifade kullan:
        versionCode Integer.parseInt(System.getenv("TIKITA_VERSION_CODE") ?: "1")
        versionName System.getenv("TIKITA_VERSION_NAME") ?: "1.0.0"
    }

    signingConfigs {
        release {
            if (ksVar) {
                storeFile file(ksYol)
                storePassword ksSifre
                keyAlias "tikita"
                keyPassword ksSifre
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (ksVar) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* KOTLIN STDLIB İKİLENMESİ — derlemeyi düşüren gerçek hata (2026-08-25):
       Kotlin 1.8'den itibaren `kotlin-stdlib-jdk7` ve `kotlin-stdlib-jdk8`
       artifact'lerinin içeriği `kotlin-stdlib`in İÇİNE alındı. Ağaçta hem yeni
       stdlib (appcompat 1.7.0 → 1.8.22) hem eski jdk7/jdk8 (1.6.21) bulunduğu
       için aynı sınıflar iki kez geliyor ve derleme
       "Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt ..." ile düşüyordu.

       Kısıt (constraint) eski artifact'leri de aynı sürüme çeker; o sürümde
       ikisi de BOŞ kabuktur, çakışma biter. Sürümü tek yerde tut. */
    constraints {
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$KOTLIN_SURUM"
        implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$KOTLIN_SURUM"
    }

    implementation "androidx.appcompat:appcompat:1.7.0"
    // TWA çekirdeği — LauncherActivity, DelegationService, WebView yedeği burada.
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.5.0"
}
