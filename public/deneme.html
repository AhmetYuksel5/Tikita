/* 🩺 BEYAZ SAYFA NÖBETÇİSİ — modül hiç çalışmazsa (CDN gitmedi, sözdizimi hatası,
   eski önbellek) ekran bomboş kalıyordu. Burası klasik <script>: modül yüklenemese
   bile çalışır, 9 saniye sonra kök hâlâ boşsa sebebi ekrana yazar. */
(function(){
  var HATA=null;
  window.addEventListener("error",function(e){
    if(!HATA) HATA=(e&&e.message||"")+((e&&e.filename)?("\n"+e.filename+":"+(e.lineno||0)):""); },true);
  window.addEventListener("unhandledrejection",function(e){
    if(!HATA) HATA="İstek başarısız: "+String((e&&e.reason&&e.reason.message)||e.reason||""); });
  function goster(){
    var r=document.getElementById("root");
    if(!r||r.childNodes.length) return;
    r.innerHTML='<div style="padding:26px 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;'
      +'max-width:520px;margin:0 auto;color:#1b1e25">'
      +'<div style="font-size:40px;margin-bottom:10px">📡</div>'
      +'<div style="font-size:19px;font-weight:800;margin-bottom:8px">Uygulama yüklenemedi</div>'
      +'<div style="font-size:13.5px;line-height:1.6;color:#5b616e;margin-bottom:16px">'
      +'Sayfa açıldı ama ekran çizilemedi. En sık sebebi bağlantının kesik olması '
      +'(uygulama açılışta internetten kütüphane çekiyor).</div>'
      +(HATA?('<pre style="font-size:11px;background:#f4f5f7;border:1px solid #e3e5e9;border-radius:10px;'
      +'padding:11px;white-space:pre-wrap;word-break:break-word;color:#9a3412;margin-bottom:16px">'
      +String(HATA).replace(/[<>&]/g,"")+'</pre>'):'')
      +'<button id="tk-nobet-yenile" style="width:100%;padding:14px;border:0;border-radius:14px;'
      +'background:#1b1e25;color:#fff;font-size:15px;font-weight:800">Yeniden dene</button>'
      +'<button id="tk-nobet-sifirla" style="width:100%;padding:12px;margin-top:9px;border:1px solid #e3e5e9;'
      +'border-radius:14px;background:#fff;color:#5b616e;font-size:13px;font-weight:700">Ekranı sıfırla ve yenile</button>'
      +'</div>';
    var a=document.getElementById("tk-nobet-yenile"); if(a) a.onclick=function(){ location.reload(); };
    var b=document.getElementById("tk-nobet-sifirla"); if(b) b.onclick=function(){
      try{ sessionStorage.clear(); }catch(e){} location.reload(); };
  }
  setTimeout(goster,9000);
})();
</script>

/* 🆕 ÜRÜNÜN KAYIT ZAMANI — ayrı bir tarih alanı yoksa belge kimliğinden çözülür.
   uid() zaman damgasının 36'lık tabanıyla başladığı için kimlik kendiliğinden

const urunZaman=u=>{ if(!u) return 0;

/* ═══ 🗓 HAKEDİŞ DÖNEMİ — Cumartesi 00:00 → Cuma 23:59 ═══
   Hakediş TAHSİLATA DEĞİL, gerçekleşen SATIŞA bağlıdır.
   Dönem "gönder" ile kapanır; kapanan dönemin tutarı bir daha değişmez. */
const HAKEDIS_BAS="2026-08-08";        // yeni sistemin ilk dönemi (Cumartesi)
const HAKEDIS_BAS_MS=new Date(HAKEDIS_BAS+"T00:00:00").getTime();
// verilen ana ait dönemin başı: Cmt→0 gün geri, Paz→1, Pzt→2 … Cuma→6
const haftaBasMs=t=>{ const d=new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+1)%7)); return d.getTime(); };
const haftaBitMs=t=>haftaBasMs(t)+7*864e5-1;
const haftaKod=t=>{ const b=new Date(haftaBasMs(t));
  return b.getFullYear()+"-"+String(b.getMonth()+1).padStart(2,"0")+"-"+String(b.getDate()).padStart(2,"0"); };
const gunKisa=t=>new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"short"});
const haftaEtiket=t=>gunKisa(haftaBasMs(t))+" – "+gunKisa(haftaBitMs(t));
/* 📅 YILIN KAÇINCI HAFTASI — haftalarımız Cumartesi başladığı için ISO takvimi
   kullanılamıyor; kendi sınırlarımızla sayılıyor. Yılın 1. haftası, ortası (Salı)
   o yıla düşen ilk haftadır; böylece yıl dönümünde ne boşluk ne tekrar oluşur. */
const haftaNo=t=>{ const b=haftaBasMs(t); const orta=b+3*864e5;
  const y=new Date(orta).getFullYear();
  let ilk=haftaBasMs(new Date(y,0,1).getTime());
  if(new Date(ilk+3*864e5).getFullYear()<y) ilk+=7*864e5;
  return Math.round((b-ilk)/(7*864e5))+1; };
const haftaYil=t=>new Date(haftaBasMs(t)+3*864e5).getFullYear();
const haftaAdi=t=>haftaNo(t)+". hafta ("+haftaEtiket(t)+")";

// ay dönemi — tabla hakedişi aylık kapanır
const ayBasMs=t=>{ const d=new Date(t); return new Date(d.getFullYear(),d.getMonth(),1).getTime(); };
const ayBitMs=t=>{ const d=new Date(t); return new Date(d.getFullYear(),d.getMonth()+1,0,23,59,59,999).getTime(); };
const ayKod=t=>{ const d=new Date(t); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); };
const ayEtiket=t=>new Date(t).toLocaleDateString("tr-TR",{month:"long",year:"numeric"});

/* Bir dönemin hakediş dökümü — satış bazlı, ürün kırılımlı.
   Sembolik fiyatla (≤1 ₺) verilen ürün fiilen bedavadır, hakediş doğurmaz. */
function hakedisHesap(har,ts,esik,sirketPaz){
  const b0=haftaBasMs(ts), b1=haftaBitMs(ts);
  const ic=x=>{ const t=new Date(x.tarih).getTime(); return t>=b0&&t<=b1; };
  const sat=(har||[]).filter(x=>x.tip==="satis"&&ic(x));
  const E=num(esik!=null?esik:1);
  const byU={};
  let hakedis=0,ciro=0,verisBedel=0,adet=0,gerNakit=0,eksiVar=false,bedavaAdet=0,tahsilsiz=0;
  const byG={};   // 📅 gün + kale kırılımı — "ne zaman, nerede, ne ciro, ne hakediş"
  sat.forEach(x=>{
    const a=Math.max(0,num(x.adet)), fiyat=num(x.satisFiyat), veris=num(x.alisFiyat);
    const bedava=fiyat<=E;
    // 🏢 şirket pazarlamacısı: kaça satarsa satsın bedelin tamamı şirkete, hakediş doğmaz
    const tutar=(sirketPaz||bedava)?0:a*(fiyat-veris);
    if(tutar<0) eksiVar=true;
    if(bedava) bedavaAdet+=a;
    const k=x.urunId||("a:"+(x.urunAd||"?"));
    byU[k]=byU[k]||{ad:x.urunAd||"?",adet:0,ciro:0,veris:0,hakedis:0,bedava:0};
    byU[k].adet+=a; byU[k].ciro+=a*fiyat; byU[k].veris+=a*veris; byU[k].hakedis+=tutar;
    if(bedava) byU[k].bedava+=a;
    hakedis+=tutar; ciro+=a*fiyat; verisBedel+=a*veris; adet+=a;
    const ger=!!(x.gerilla||x.kaynak==="gerilla");
    if(ger) gerNakit+=a*fiyat;
    /* 💸 satıldı ama parası alınmadı: hakediş yine doğar, teslim edilecek nakde girmez.
       tahsil alanı hiç yazılmamış eski kayıtlar peşin sayılır. */
    const th=x.tahsil==null?a*fiyat:num(x.tahsil);
    const acik=Math.max(0,a*fiyat-th);
    tahsilsiz+=acik;
    // 📅 gün + kale kırılımı: aynı kaleye aynı gün yapılan satışlar tek satırda toplanır
    const g0=new Date(x.tarih); g0.setHours(0,0,0,0); const gun=g0.getTime()||0;
    const kale=ger?"⚡ Seyyar":((x.yer||"").trim()||"—");
    const gk=gun+"|"+kale;
    const o=byG[gk]||(byG[gk]={gun,kale,gerilla:ger,adet:0,ciro:0,veris:0,hakedis:0,bedava:0,kayit:0,tahsilsiz:0});
    o.adet+=a; o.ciro+=a*fiyat; o.veris+=a*veris; o.hakedis+=tutar; o.kayit++; o.tahsilsiz+=acik;
    if(bedava) o.bedava+=a;
  });
  const tahNakit=(har||[]).filter(x=>x.tip==="tahsilat"&&ic(x)).reduce((s,x)=>s+num(x.tutar),0);
  const urunler=Object.keys(byU).map(k=>({...byU[k]})).sort((a,b)=>b.hakedis-a.hakedis);
  // en yeni gün üstte; aynı günde çok ciro yapan kale önce
  const satirlar=Object.keys(byG).map(k=>({...byG[k]})).sort((a,b)=>b.gun-a.gun||b.ciro-a.ciro);
  return {b0,b1,kod:haftaKod(ts),etiket:haftaEtiket(ts),satisKayit:sat.length,
    urunler,satirlar,hakedis,ciro,verisBedel,adet,gerNakit,tahNakit,nakit:gerNakit+tahNakit,eksiVar,bedavaAdet,tahsilsiz,
    sirketPaz:!!sirketPaz, gecerli:b0>=HAKEDIS_BAS_MS};
}
/* 💵 SAHA NAKDİ — pazarlamacının topladığı ama henüz teslim etmediği para.
   Kesme tarihinden itibaren tahsil edilen nakdin TAMAMI Tikita'ya teslim edilir. */
/* Teslimat HAFTALIK KESİME bağlıdır: bir hafta kapanmadan o haftanın nakdi
   istenmez. Süren haftada toplanan para "bu hafta" olarak ayrı durur ve
   cuma akşamı kesim olunca teslim edilecek tutara geçer. */
function nakitDurum(har,simdi){
  const NOW=num(simdi)||Date.now();
  let toplanan=0, teslim=0, bekleyen=0, acikHafta=0;
  (har||[]).forEach(x=>{
    const t=new Date(x.tarih).getTime();
    if(x.tip==="nakitTeslim"){ const v=num(x.tutar);
      if(x.onay===false) bekleyen+=v; else teslim+=v; return; }
    if(t<HAKEDIS_BAS_MS) return;                       // kesme öncesi eski düzen
    let v=0;
    if(x.tip==="satis"&&(x.gerilla||x.kaynak==="gerilla"))
      v=(x.tahsil!=null?num(x.tahsil):num(x.adet)*num(x.satisFiyat));
    else if(x.tip==="tahsilat") v=num(x.tutar);
    else return;
    /* haftası henüz kapanmadıysa teslim edilecek tutara girmez */
    if(haftaBitMs(t)>=NOW) acikHafta+=v; else toplanan+=v;
  });
  const kalan=Math.max(0,toplanan-teslim-bekleyen);
  return {toplanan,teslim,bekleyen,kalan,acikHafta,
    tumToplanan:toplanan+acikHafta,elde:toplanan-teslim};
}
// bir kullanıcının bugüne kadarki tüm dönemleri (yeni sistemin başlangıcından)
function hakedisDonemler(har,simdi){
  const L=[]; let t=haftaBasMs(simdi||Date.now());
  while(t>=HAKEDIS_BAS_MS&&L.length<60){ L.push(t); t-=7*864e5; }
  return L; }

    if(!r.ok) return null;

      return { ad:(p.displayName&&p.displayName.text)||"", lat:p.location&&p.location.latitude, lng:p.location&&p.location.longitude,
        tam:p.formattedAddress||"", bolge:f("administrative_area_level_2")||f("sublocality_level_1")||f("sublocality")||"" }; })

// Overpass/OSM isimle mekan arama (anahtarsız yedek)
async function overpassAdAra(t,merkez){
  try{
    const esc=t.replace(/[.*+?^${}()|[\]\\"]/g,"\\$&");
    const la=(merkez&&merkez.lat)||41.0082, lo=(merkez&&merkez.lng)||28.9784;
    const q='[out:json][timeout:15];nwr["name"~"'+esc+'",i](around:25000,'+la+','+lo+');out center 15;';
    const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
    if(!r.ok) return null;
    const j=await r.json(); const gor=new Set(), out=[];
    (j.elements||[]).forEach(el=>{ const tg=el.tags||{}; const ad=tg.name; if(!ad) return;
      const la2=el.lat!=null?el.lat:(el.center&&el.center.lat), lo2=el.lon!=null?el.lon:(el.center&&el.center.lon);
      if(la2==null||lo2==null) return;
      const key=el.type+"/"+el.id; if(gor.has(key)) return; gor.add(key);
      const adres=[tg["addr:street"],tg["addr:housenumber"],tg["addr:suburb"]||tg["addr:district"],tg["addr:city"]].filter(Boolean).join(" ");
      out.push({ad,lat:la2,lng:lo2,tam:adres||("OSM · "+(tg.shop||tg.amenity||"")),bolge:tg["addr:district"]||tg["addr:suburb"]||""}); });
    return out;
  }catch(e){ return null; }
}
const ilceOf=a=>a?(a.town||a.district||a.city_district||a.suburb||a.county||""):"";
const adNorm=s=>String(s||"").toLocaleLowerCase("tr").replace(/\s+/g," ").trim();
/* 🔁 AYNI DÜKKÂN İKİ KEZ AÇILMASIN. Aynı mekân iki ayrı müşteri kaydı olarak
   kaydedilirse satışlar ikiye bölünür: kale listesinde aynı isim iki kez çıkar,
   borç bölünür, tahsilatı iki yerden yapmak gerekir. Ad ve konum birlikte bakılır. */
const kaleAnahtar=s=>adNorm(s).replace(/[().,\-_/\\]/g," ").replace(/\s+/g," ").trim();
const mesafeM=(a,b,c,d2)=>{ const R=6371000, r=Math.PI/180;
  const dLat=(c-a)*r, dLng=(d2-b)*r, la=a*r, lc=c*r;
  const h2=Math.sin(dLat/2)**2+Math.cos(la)*Math.cos(lc)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h2))); };
function benzerKaleler(ad,lat,lng,liste,haricId){
  const A=kaleAnahtar(ad); const la=parseFloat(lat), lo=parseFloat(lng);
  const out=[];

/* ————— 🎲 GÜNÜN SORULARI — pazarlamacının kendi verisinden üretilir —————
   Her açılışta 5 soru çıkar. Havuzdaki tüm sorular üretilip karıştırılır, ilk 5'i
   alınır; brifing tekrar açılınca tur numarası değiştiği için karışım da değişir. */
const SORU_SAY=5;
/* Tohumlu karıştırma — aynı turda kararlı, tur değişince farklı.
   xorshift32: her adım 32 bitte kalır. (Çarpımlı üreteç 2^53'ü aşınca düşük
   bitleri kaybedip yanlı karıştırıyor, havuzdaki bir soru hiç seçilmiyordu.) */
function soruKaris(arr,tohum){ const a=arr.slice();
  let s=(num(tohum)>>>0)||1;
  const rnd=()=>{ s^=s<<13; s>>>=0; s^=s>>>17; s^=s<<5; s>>>=0; return s; };
  for(let i=a.length-1;i>0;i--){ const j=rnd()%(i+1); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a; }
function gunlukSorular(d,tur){
  const K=(d&&d.kaleler)||[];
  const gun=new Date().getDate();
  const tohum=((gun*97)+(num(tur)*4099)+13)&0x7fffffff;
  /* "hangi kale" sorusu — tepe değer ikinciyle eşitse soru belirsizdir, sorulmaz.
     Çeldiriciler sorunun GEÇERLİ olduğu kale evreninden gelir: böylece "en çok borcu
     olan" gibi az kaleyi ilgilendiren soruda da dört şık çıkar, ama süzgeçli soruda
     (örn. hiç uğranmamış kaleler hariç) yanlışlıkla daha doğru bir şık üretilmez. */
  const kaleSoru=(q,deg,suz)=>{
    const evren=suz?K.filter(suz):K;
    const L=evren.filter(k=>num(deg(k))>0);
    if(!L.length) return null;
    const S=L.slice().sort((a,b)=>num(deg(b))-num(deg(a)));
    if(S.length>1&&num(deg(S[0]))===num(deg(S[1]))) return null;
    const dogru=S[0];
    const dig=evren.filter(k=>k.key!==dogru.key)
      .sort((a,b)=>num(deg(b))-num(deg(a))).slice(0,3);
    if(dig.length<2) return null;   // en az üç şık olsun
    return {q,opts:[{t:dogru.ad,ok:true},...dig.map(k=>({t:k.ad,ok:false}))]}; };
  /* sayı sorusu — doğru değerin çevresine makul şıklar üretilir */
  const sayiSoru=(q,dogru,bic)=>{
    const v=Math.round(num(dogru)); if(!(v>0)) return null;
    const ad=[v,Math.round(v*0.55),Math.round(v*1.5),Math.round(v*2.2),v+Math.max(1,Math.round(v*0.2))];
    const set=[]; ad.forEach(x=>{ const n=Math.max(0,Math.round(x)); if(set.indexOf(n)<0) set.push(n); });
    if(set.length<3) return null;
    const f=bic||(n=>String(n));
    return {q,opts:set.slice(0,4).map(n=>({t:f(n),ok:n===v}))}; };
  const uret=[
    ()=>kaleSoru("💰 En çok ciro yaptığın kale hangisi?",k=>k.ciro),
    ()=>kaleSoru("💪 En güçlü kalen hangisi?",k=>k.guc),
    ()=>kaleSoru("🏬 En çok açık konsinye hangi kalede duruyor?",k=>k.acikKons),
    ()=>kaleSoru("⚔️ En uzun süredir uğramadığın kale hangisi?",k=>k.gunGecti,k=>k.gunGecti<900&&k.gunGecti>0),
    ()=>kaleSoru("📦 En çok adet sattığın kale hangisi?",k=>k.satisAdet),
    ()=>kaleSoru("🧾 En çok borcu olan kale hangisi?",k=>k.borc),
    ()=>kaleSoru("🫰 En çok hakediş kazandığın kale hangisi?",k=>k.hakedis),
    ()=>sayiSoru("📈 Bu hafta ne kadar ciro yaptın?",d&&d.hafCiro,tl),
    ()=>sayiSoru("🫰 Bu haftaki hakedişin ne kadar?",d&&d.hafKar,tl),
    ()=>sayiSoru("🏬 Sahada toplam kaç ürünün duruyor?",d&&d.konsToplam,n=>n+" adet"),
    ()=>sayiSoru("🧾 Kalelerinin toplam borcu ne kadar?",d&&d.borcTop,tl),
    ()=>sayiSoru("🏰 Kaç kalen var?",K.length,n=>n+" kale"),
    ()=>sayiSoru("💪 Toplam gücün ne kadar?",d&&d.toplamGuc,n=>n.toLocaleString("tr-TR")+" güç"),
    ()=>{ const s2=d&&d.sonraki; if(!s2) return null;
      return sayiSoru("🎖 "+s2[1]+" rütbesine kaç güç kaldı?",num(s2[0])-num(d.toplamGuc),n=>n.toLocaleString("tr-TR")+" güç"); },
  ];
  const hepsi=[];
  uret.forEach(f=>{ let q=null; try{ q=f(); }catch(e){ q=null; }
    if(q&&q.opts&&q.opts.length>=2) hepsi.push(q); });
  return soruKaris(hepsi,tohum).slice(0,SORU_SAY)
    .map((q,i)=>({...q,opts:soruKaris(q.opts,tohum+i*7919)}));
}

function hesap(hareketler,musteriler,kullanicilar,urunler){
  const emir=(kullanicilar||[]).find(u=>u.id===BEN_ID)||{id:BEN_ID||"",ad:"Pazarlamacı",simge:"🎖️"};
  const _tumHar=hareketler||[];                                              // GLOBAL — sadece lider tablosu için
  hareketler=_tumHar.filter(x=>(x.kullaniciId||"")===emir.id);               // ⬇️ bundan sonrası: SADECE bu pazarlamacının kayıtları (kişisel istatistik sızmasın)
  const musById={}; (musteriler||[]).forEach(m=>musById[m.id]=m);
  const kk=x=>x.musteriId?("m:"+x.musteriId):("y:"+((x.yer||"?").toLocaleLowerCase("tr")));
  const kM={};
  (hareketler||[]).forEach(x=>{ if((x.tip!=="satis"&&x.tip!=="konsinye")||x.gerilla) return;
    const k=kM[kk(x)]||(kM[kk(x)]={key:kk(x),musteriId:x.musteriId||"",ad:x.yer||"",bolge:x.bolge||"",lat:x.lat||"",lng:x.lng||"",satisAdet:0,ciro:0,konsAdet:0,konsList:{}});
    if(x.tip==="satis"){k.satisAdet+=num(x.adet);k.ciro+=num(x.adet)*num(x.satisFiyat);} else k.konsAdet+=num(x.adet);
    if(!k.ad&&x.yer)k.ad=x.yer; if(!k.bolge&&x.bolge)k.bolge=x.bolge; });
  const avansK={};   // sayıma mahsup edilmemiş tahsilat
  const acikK={},borcK={},sonK={},ovTah={},ovCoz={},ovCozList={},marjK={},tahByK={};
  // 🗓 kesme tarihi ayrımı: ÖNCESİ eski model (hakediş tahsilata bağlı, önce üretici),
  //    SONRASI yeni model (hakediş satış anında doğar, haftalık dönemde ödenir)
  const marjEskiK={},marjYeniK={},ciroEskiK={},borcYeniK={};
  (hareketler||[]).forEach(x=>{ if(x.gerilla) return; const k=kk(x); const t=new Date(x.tarih).getTime()||0;
    if(["satis","konsinye","hediye","iade","tahsilat","stant","diplomasi"].includes(x.tip)) sonK[k]=Math.max(sonK[k]||0,t);
    // deneme (overlay) yazımları: gerçek kayda dokunmadan borç/konsinyeyi düzelt
    if(x._ov){ if(x.tip==="tahsilat") ovTah[k]=(ovTah[k]||0)+num(x.tutar);
      if((x.tip==="satis"&&x.kaynak==="konsinye")||x.tip==="iade"){ const ad=x.urunAd||"?";
        ovCoz[k]=(ovCoz[k]||0)+num(x.adet); (ovCozList[k]||(ovCozList[k]={}))[ad]=(ovCozList[k][ad]||0)+num(x.adet); } }
    if(x.tip==="tahsilat"){ (tahByK[k]||(tahByK[k]=[])).push(x); if(x.avans&&num(x.acikAvans)>0) avansK[k]=(avansK[k]||0)+num(x.acikAvans); }
    if(x.tip==="konsinye"&&num(x.kalan)>0){ acikK[k]=(acikK[k]||0)+num(x.kalan);
      // 🔒 bırakış anındaki fiyatlar donuk tutulur — FIFO'da en eski açık kayıt esas alınır
      /* Aynı ürün farklı fiyatlardan bırakılmış olabilir. Eskiden en eski partinin
         fiyatı hepsine yazılıyordu; artık her parti kendi bedeliyle toplanıyor ve
         birim = toplam bedel / toplam adet (ağırlıklı ortalama). */
      if(kM[k]){const ad=x.urunAd||"?"; const o=kM[k].konsList[ad]||(kM[k].konsList[ad]={adet:0,deger:0,alisDeger:0,t:Infinity});
        const kal=num(x.kalan);
        o.adet+=kal; o.deger+=kal*num(x.satisFiyat); o.alisDeger+=kal*num(x.alisFiyat);
        if(t<o.t) o.t=t; } }
    else if(x.tip==="satis"){const bek=num(x.adet)*num(x.satisFiyat);const th=x.tahsil==null?bek:num(x.tahsil);const b=Math.max(0,bek-th);if(b>0)borcK[k]=(borcK[k]||0)+b;
      const mj=(num(x.satisFiyat)-num(x.alisFiyat))*num(x.adet);
      marjK[k]=(marjK[k]||0)+mj;
      if(t>=HAKEDIS_BAS_MS){ marjYeniK[k]=(marjYeniK[k]||0)+mj; if(b>0) borcYeniK[k]=(borcYeniK[k]||0)+b; }
      else { marjEskiK[k]=(marjEskiK[k]||0)+mj; ciroEskiK[k]=(ciroEskiK[k]||0)+bek; } } });
  let kaleler=Object.values(kM).map(k=>{ const m=k.musteriId&&musById[k.musteriId];
    if(m){k.ad=m.ad||k.ad;k.bolge=m.bolge||k.bolge;if(!k.lat&&m.lat){k.lat=m.lat;k.lng=m.lng;}
      k.telefon=(m.telefon||"").trim(); k.not=m.not||""; k.arsiv=!!m.arsiv;
      k.anlasma=anlasmaHari(m);}   // 🤝 bu kaleye özel anlaşmalı fiyatlar
    const silah=Math.floor(k.ciro/250);
    k.guc=Math.round(k.satisAdet*katOf(ASKER_TIER,k.satisAdet)[1]+k.konsAdet+silah*katOf(SILAH_TIER,k.ciro)[1]);
    k.seviye=(()=>{const t=[0,25,80,200,500,1200];let lv=1;for(let i=1;i<t.length;i++)if(k.guc>=t[i])lv=i+1;return lv;})();
    /* 🧾 CARİ HESAP — tahsilat artık tek tek satışlara bağlanmıyor.
       Sayıma bağlı olmayan (avans) tahsilat kalenin borcundan doğrudan düşülür;
       borcu aşan kısım mekânın alacağı olarak "sayımsız tahsilat" diye bekler.
       Böylece mekân parayı önceden verdiyse sahte borç görünmez, satış girildiğinde
       de hiçbir kaydın üzerine yazılmadan borç kendiliğinden kapanır. */
    const avansAcik=Math.max(0,avansK[k.key]||0);
    const borcHam=Math.max(0,(borcK[k.key]||0)-(ovTah[k.key]||0));
    k.avansAcik=avansAcik; k.borcHam=borcHam;
    k.avansKalan=Math.max(0,avansAcik-borcHam);   // borcu aştıysa kalan alacak
    k.acikKons=Math.max(0,(acikK[k.key]||0)-(ovCoz[k.key]||0));
    k.borc=Math.max(0,borcHam-avansAcik); k.son=sonK[k.key]||0; k.gunGecti=k.son?gunFark(k.son):999;
    const coz=ovCozList[k.key]||{};
    k.konsKalem=Object.entries(k.konsList).map(([ad,o])=>{
      const ham=Math.max(0,num(o.adet)), kalan=Math.max(0,ham-(coz[ad]||0));
      const oran=ham>0?kalan/ham:0;   // deneme kaydıyla çözülen kısım bedelden de düşer
      return {ad,adet:kalan,tutar:num(o.deger)*oran,
        birim:kalan>0?(num(o.deger)*oran)/kalan:0,
        alis:kalan>0?(num(o.alisDeger)*oran)/kalan:0}; })
      .filter(c=>c.adet>0).sort((a,b)=>b.adet-a.adet);
    /* 🫰 PAZARLAMACI HAKEDİŞİ — kesme tarihinden itibaren SATIŞA bağlı.
       Yeni dönem: satış gerçekleştiği anda hakediş doğar; tahsil edilip edilmemesi
       hakedişi geciktirmez (tahsil edilmeyen tutar kalenin borcudur), ödeme haftalık
       dönemde yapılır. Eski dönem: tahsil edildikçe oransal doğuyordu (önce üretici);
       o kayıtlar zaten o mantıkla kapandığı için geçmişe dokunulmuyor.
       (admin veriliş fiyatını güncellerse marj değişir → hakediş anında güncellenir) */
    k.marjTop=Math.max(0,marjK[k.key]||0);
    k.marjYeni=Math.max(0,marjYeniK[k.key]||0);      // satışta doğan (yeni model)
    k.marjEski=Math.max(0,marjEskiK[k.key]||0);      // kesme öncesi satışların marjı
    const ornE=(ciroEskiK[k.key]||0)>0?Math.min(1,k.marjEski/ciroEskiK[k.key]):0;
    k.eskiAlinan=Math.min(k.marjEski,(tahByK[k.key]||[])
      .filter(x=>new Date(x.tarih).getTime()<HAKEDIS_BAS_MS).reduce((s,x)=>s+num(x.tutar)*ornE,0));
    k.eskiBekleyen=Math.max(0,k.marjEski-k.eskiAlinan);
    k.hakedis=k.marjYeni+k.eskiAlinan;               // bugün itibarıyla hak edilmiş toplam
    k.yeniBorc=Math.max(0,(borcYeniK[k.key]||0)-avansAcik);   // yeni dönem satışlarından tahsil edilmemiş (açık tahsilat düşülmüş)
    // eski adlar — geriye dönük uyum
    k.hakedisAlinan=k.hakedis; k.hakedisBekleyen=k.eskiBekleyen;
    k.durum=kaleDurum(k); return k; }).filter(k=>k.ad&&!k.arsiv).sort((a,b)=>b.guc-a.guc);
  const toplamGuc=kaleler.reduce((s,k)=>s+k.guc,0);
  const komutan=katOf(KOMUTAN,toplamGuc); const sonraki=KOMUTAN.find(x=>x[0]>toplamGuc)||null;
  const gerillaGanimet=(hareketler||[]).filter(x=>x.gerilla&&x.tip==="satis").reduce((s,x)=>s+num(x.adet)*num(x.satisFiyat),0);
  const satisGun=new Set((hareketler||[]).filter(x=>x.tip==="satis").map(x=>{const d=new Date(x.tarih);return d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();}));
  let streak=0;{const g=new Date();const key=d=>d.getFullYear()+"-"+d.getMonth()+"-"+d.getDate();if(!satisGun.has(key(g)))g.setDate(g.getDate()-1);while(satisGun.has(key(g))){streak++;g.setDate(g.getDate()-1);}}
  const haf=haftaBasMs(Date.now());   // 🗓 hakediş dönemi başı (Cumartesi)
  const hs=(hareketler||[]).filter(x=>x.tip==="satis"&&new Date(x.tarih).getTime()>=haf);
  const hafCiro=hs.reduce((s,x)=>s+num(x.adet)*num(x.satisFiyat),0);
  const hafKar=hs.reduce((s,x)=>s+num(x.adet)*(num(x.satisFiyat)-num(x.alisFiyat)),0);
  const hafSatAd=hs.reduce((s,x)=>s+num(x.adet),0);
  const hafKons=(hareketler||[]).filter(x=>x.tip==="konsinye"&&!x.gerilla&&new Date(x.tarih).getTime()>=haf).reduce((s,x)=>s+num(x.adet),0);
  // ⚡ bu haftanın gerilla ganimeti — Rapor kartı bunu gösterir (gerillaGanimet tüm zamanlar, Üs rozeti orada)
  const hafGanimet=hs.filter(x=>x.gerilla).reduce((s,x)=>s+num(x.adet)*num(x.satisFiyat),0);
  const gorevHaf=[
    {ad:"Bu hafta 20 satış",deg:hafSatAd,hedef:20,renk:"var(--green)"},
    {ad:"Bu hafta 5.000 ₺ ciro",deg:Math.round(hafCiro),hedef:5000,renk:"var(--gold)",birim:"tl"},
    {ad:"15 konsinye bırak",deg:hafKons,hedef:15,renk:"var(--violet)"}];
  const gorevler=kaleler.filter(k=>k.durum.key!=="saglam").sort((a,b)=>oncelik[a.durum.key]-oncelik[b.durum.key]||b.guc-a.guc);
  // cephane — ürünler kaynak gibi
  const eid=emir.id;
  const cephane=(urunler||[]).map(u=>({id:u.id,ad:u.ad||"?",eklendi:u.eklendi||"",seriler:seriListe(u),stokta:num(u.stokta),canta:num((u.pazStokK||{})[eid]),odul:num((u.odulStokK||{})[eid]),fiyat:num(u.satisFiyat),pazFiyat:verisOf(u,eid),pazOzel:num((u.pazFiyatK||{})[eid])>0,maliyet:num(u.maliyetGuncel),tanitim:u.tanitim||""}))
    .filter(u=>u.ad!=="?").sort((a,b)=>(b.canta-a.canta)||(b.stokta-a.stokta));
  const cantaTop=cephane.reduce((s,u)=>s+u.canta,0);
  // rozetler (kazanılan başarımlar)
  const rozetler=[]; const rz=(ok,ik,ad)=>{ if(ok) rozetler.push({ik,ad}); };
  rz(kaleler.length>=1,"🏰","İlk kale"); rz(kaleler.length>=5,"⚔️","Fatih · 5 kale"); rz(kaleler.length>=15,"👑","İmparator · 15 kale");
  rz(streak>=3,"🔥","3 gün seri"); rz(streak>=7,"⚡","7 gün seri");
  rz(toplamGuc>=900,"🎖️","Yüzbaşı gücü"); rz(toplamGuc>=2000,"⚔️","Binbaşı gücü");
  rz(hafCiro>=5000,"💰","Haftalık ciro"); rz(gerillaGanimet>=1000,"🥷","Gerilla ustası");
  // takım lider tablosu
  const lider=liderHesap(_tumHar,kullanicilar);
  const emirSira=lider.findIndex(x=>x.uid===emir.id);
  // dashboard genel toplamları + bugün
  const toplamCiro=kaleler.reduce((s,k)=>s+k.ciro,0);
  const hakedisTop=kaleler.reduce((s,k)=>s+k.hakedis,0);
  const vurkac=gerillaGanimet>0&&gerillaGanimet>toplamCiro*0.5;   // gelirin çoğu seyyar — kale kur uyarısı
  const bg=(()=>{const t=new Date();t.setHours(0,0,0,0);return t.getTime();})();
  const bgSat=(hareketler||[]).filter(x=>x.tip==="satis"&&!x.gerilla&&new Date(x.tarih).getTime()>=bg);
  const bugunSat=bgSat.reduce((s,x)=>s+num(x.adet),0);
  const bugunCiro=bgSat.reduce((s,x)=>s+num(x.adet)*num(x.satisFiyat),0);
  const bugunTah=(hareketler||[]).filter(x=>x.tip==="tahsilat"&&new Date(x.tarih).getTime()>=bg).reduce((s,x)=>s+num(x.tutar),0);
  // 🔭 adaylar / gözcüler — müşteri kaydı var ama henüz kale değil (hiç akın yapılmamış)
  const kaleKeySet=new Set(kaleler.map(k=>k.key));
  const adaylar=(musteriler||[]).filter(m=>!m.arsiv&&(m.ad||"").trim()&&(m.kullaniciId||"")===emir.id&&!kaleKeySet.has("m:"+m.id))
    .map(m=>({id:m.id,ad:m.ad,bolge:m.bolge||"",telefon:(m.telefon||"").trim(),not:m.not||"",lat:m.lat||"",lng:m.lng||"",kesif:!!m.kesif,
      gozcu:!m.kesif}))   // elle oluşturulmuş (keşif adayı değil) + işlemsiz kale = gözcü
    .sort((a,b)=>(b.gozcu-a.gozcu)||(b.kesif-a.kesif));
  // 🧹 tabla hakedişi — biriken (tip:tabla) − ödenen (tip:tablaOde) = kalan (ödeme emri bununla kapanır)
  const tablaKazTop=(hareketler||[]).filter(x=>x.tip==="tabla").reduce((s,x)=>s+num(x.tutar),0);
  const tablaOdenenTop=(hareketler||[]).filter(x=>x.tip==="tablaOde").reduce((s,x)=>s+num(x.tutar),0);
  const tablaKalanTop=Math.max(0,tablaKazTop-tablaOdenenTop);
  /* 🎖 sınırsız cephane: komuta yetkisi, şirket pazarlamacısı ya da en az Paşa rütbesi.
     Bu grupta çanta akışı tümüyle askıda — işlem doğrudan atölye stoğundan geçer. */
  const gercekKul=(kullanicilar||[]).find(u=>u.id===REAL_ID)||{};
  const sinirsiz=gercekKul.rol==="admin"||!!gercekKul.sirketPaz||toplamGuc>=PASA_GUC;
  /* elde = sahada işlenebilecek ürünler.
     Sınırsızda TÜM ürünler listede: montajı biten ama programa henüz girmemiş bir
     ürün sıfır görünürken satılmış olabilir — engellemek yerine stok eksiye düşer,
     Cephane'de uyarı çıkar ve elle düzeltilir. */
  const elde=sinirsiz?cephane.slice():cephane.filter(u=>u.canta>0||u.odul>0);
  const eksiStok=sinirsiz?cephane.filter(u=>u.stokta<0).sort((a,b)=>a.stokta-b.stokta):[];
  return {emir,kaleler,adaylar,toplamGuc,komutan,sonraki,gerillaGanimet,hafGanimet,streak,satisGun,hafCiro,hafKar,gorevler,cephane,cantaTop,
    sinirsiz,elde,eksiStok,
    gorevHaf,rozetler,lider,emirSira,toplamCiro,hakedisTop,tablaKazTop,tablaOdenenTop,tablaKalanTop,bugunSat,bugunCiro,bugunTah,vurkac,
    konsToplam:Object.values(acikK).reduce((s,v)=>s+v,0),
    borcTop:kaleler.reduce((s,k)=>s+k.borc,0)};
}

/* ————— 🔥 SERİ TAKVİMİ — satış yapılan günler işaretli aylık görünüm ————— */
function SeriTakvimSheet({streak,satisGun,onClose}){
  const bugun=new Date();
  const [ay,setAy]=useState(()=>new Date(bugun.getFullYear(),bugun.getMonth(),1));
  const yilAy=ay.toLocaleDateString("tr-TR",{month:"long",year:"numeric"});
  const gunSay=new Date(ay.getFullYear(),ay.getMonth()+1,0).getDate();
  const ilkGun=(new Date(ay.getFullYear(),ay.getMonth(),1).getDay()+6)%7;   // Pazartesi=0
  const key=d2=>d2.getFullYear()+"-"+d2.getMonth()+"-"+d2.getDate();
  const bugunKey=key(bugun);
  const hucre=[]; for(let i=0;i<ilkGun;i++) hucre.push(null); for(let g=1;g<=gunSay;g++) hucre.push(g);
  const okS={width:34,height:34,borderRadius:10,background:"var(--surf2)",border:"1px solid var(--line)",fontSize:16,fontWeight:800};
  return h(Sheet,{ik:"🔥",hex:"#b45309",baslik:streak+" günlük seri",alt:"",onClose,cta:"Kapat",onCta:onClose},
    h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:12}},
      h("button",{onClick:()=>setAy(a=>new Date(a.getFullYear(),a.getMonth()-1,1)),style:okS},"‹"),
      h("div",{style:{flex:1,textAlign:"center",fontSize:15,fontWeight:800,textTransform:"capitalize"}},yilAy),
      h("button",{onClick:()=>setAy(a=>new Date(a.getFullYear(),a.getMonth()+1,1)),style:okS},"›")),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6,marginBottom:6}},
      ["PZT","SAL","ÇAR","PER","CUM","CMT","PAZ"].map(g2=>h("div",{key:g2,style:{textAlign:"center",fontSize:10,fontWeight:800,color:"var(--mut2)",padding:"4px 0"}},g2))),
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:6}},
      hucre.map((g,i)=>{ if(g===null) return h("div",{key:"b"+i});
        const d2=new Date(ay.getFullYear(),ay.getMonth(),g); const k2=key(d2);
        const sat=satisGun.has(k2); const bugunMu=k2===bugunKey; const gelecek=d2.getTime()>Date.now();
        return h("div",{key:i,style:{aspectRatio:"1",borderRadius:12,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:1,
            background:bugunMu?(sat?"var(--green)":"#1b1e25"):(sat?"var(--surf2)":"transparent"),
            border:(sat&&!bugunMu)?"1px solid var(--line)":"none",
            color:bugunMu?"#fff":(gelecek?"var(--mut2)":"var(--txt)")}},
          sat?h("span",{style:{fontSize:9,lineHeight:1,fontWeight:800,color:bugunMu?"#fff":"var(--green)"}},"✓"):h("span",{style:{height:9}}),
          h("span",{style:{fontSize:13.5,fontWeight:(sat||bugunMu)?800:600}},g)); })),
    h("div",{style:{display:"flex",gap:16,justifyContent:"center",marginTop:14,fontSize:11,fontWeight:700,color:"var(--mut)"}},
      h("span",null,"✓ satış yapılan gün"),
      h("span",{style:{color:"var(--green)"}},"■ bugün")));
}

/* ————— KALE DETAYI ————— */
/* 🧾 ZİYARET RAPORU — bir kalede yapılan işlemler "ziyaret" olarak gruplanır ve
   raf defteri çıkarılır: öncesi → satılan → sayım sonrası → iade → bırakılan → güncel.
   Aralarında ZIYARET_ARA'dan az zaman geçen kayıtlar tek ziyarettir. */
const ZIYARET_ARA=3*36e5;
const rafArtir=(x)=>x.tip==="konsinye"&&x.konsMod!=="hediye";                                   // rafa giren
const rafAzalt=(x)=>x.kaynak==="konsinye"&&(x.tip==="satis"||x.tip==="hediye"||x.tip==="iade"); // raftan çıkan
/* Doğrudan satış: çantadan mekana satılan — konsinyeden satılmış değil, seyyar da değil.
   Mal müşterinin olur ve standda durur; sonraki sayımda konsinyeyle karışmasın diye ayrı tutulur. */
const dogrudanSatis=(x)=>x.tip==="satis"&&x.kaynak!=="konsinye"&&!x.gerilla;
function ziyaretler(har){
  const L=(har||[]).filter(x=>x&&["konsinye","satis","iade","hediye","tahsilat","diplomasi","stant"].includes(x.tip))
    .slice().sort((a,b)=>(new Date(a.tarih).getTime()||0)-(new Date(b.tarih).getTime()||0));
  const gr=[]; let cur=null;
  L.forEach(x=>{ const t=new Date(x.tarih).getTime()||0;
    if(!cur||t-cur.son>ZIYARET_ARA){ cur={bas:t,son:t,kayit:[]}; gr.push(cur); }
    cur.son=t; cur.kayit.push(x); });
  /* Stantta iki ayrı havuz durur:
       raf  → konsinye · Tikita'nın malı, sayılır, iade edilebilir, satılınca borç doğar
       mul  → müşterinin doğrudan satın aldığı · kendi malı, sayıma girmez, iade edilmez
     Aynı mekana hem konsinye bırakılıp hem doğrudan satış yapılabildiği için
     sonraki sayımda hangi ürünün hangi havuzdan olduğu ayrı ayrı tutulur. */
  const raf={},rafD={},mul={},mulD={};   // yürüyen durum — ziyaretler kronolojik işlenir
  /* Rafta olmayandan düşülemez. Adet ile tutar birlikte klemplenmezse (eskiden
     adet negatife düşüyor, tutar 0'da kalıyordu) sonraki bırakış doğru tutarı
     yanlış adede bölüyor ve birim fiyat bozuluyordu. */
  const dus=(o,od,ad,n)=>{ const q=num(o[ad]), br=q>0?num(od[ad])/q:0, d=Math.min(q,num(n));
    if(d>0){ o[ad]=q-d; od[ad]=Math.max(0,num(od[ad])-d*br); }
    return Math.max(0,num(n)-d); };   // karşılanamayan kısım
  const ekle=(o,od,ad,n,br)=>{ o[ad]=num(o[ad])+n; od[ad]=num(od[ad])+n*num(br); };
  const rafDus=(ad,n)=>dus(raf,rafD,ad,n);
  /* Bir ziyarette hem bırakılıp hem o raftan satılabilir. Sayım aşamasında raf
     henüz dolmadığı için karşılanamayan miktar burada birikir, bırakıştan sonra
     düşülür. Ziyaret sonunda kalan açık taşınmaz — gerçek bir fazla satıştır. */
  let eksik={};
  const rafEkle=(ad,n,br)=>ekle(raf,rafD,ad,n,br);
  const kopya=o=>{ const y={}; Object.keys(o).forEach(k2=>{ if(num(o[k2])>0) y[k2]=num(o[k2]); }); return y; };
  /* Uygulama dışında kapanmış konsinye (excel/geçmiş aktarımı): kaydın kalan'ı
     adetten az ama bunu açıklayan satış/iade olayı yok. Aradaki fark bırakış
     anında rafa girmez — yoksa rapor, ana ekranların gösterdiği açık konsinyeyle
     çelişir. Olaylarla açıklanabilen her yerde bu düzeltme etkisizdir. */
  const disari={};
  (function(){ const acik={},olay={};
    L.forEach(x=>{ const u=x.urunAd||"?";
      if(rafArtir(x)&&x.kalan!=null) acik[u]=num(acik[u])+num(x.adet)-num(x.kalan);
      if(x.tip==="iade"?(x.kaynak!=="canta"):rafAzalt(x)) olay[u]=num(olay[u])+num(x.adet); });
    Object.keys(acik).forEach(u=>{ const d=num(acik[u])-num(olay[u]); if(d>0.001) disari[u]=d; }); })();
  let hicKons=false;   // bu kaleye bugüne dek hiç konsinye girdi mi
  const out=gr.map((g,i)=>{
    const once=kopya(raf), onceD={...rafD};
    /* ilkGiris: raf o an boş olması yetmez — raf tükenip yeniden dolduğunda
       bu ziyaret "ilk giriş" değildir, "tekrar bırakış"tır. */
    const ilkGiris=!hicKons;
    const sat=[],iade=[],birak=[],hed=[],diger=[]; let tah=0,ciro=0,tahEk=0;
    /* Kategori sırasıyla işlenir (sayım → satış → iade → bırakış); kayıt sırası
       ne olursa olsun rapor hep aynı mantığı gösterir. */
    g.kayit.forEach(x=>{ const ad=x.urunAd||"?", n=num(x.adet);
      if(x.tip==="tahsilat"){ tah+=num(x.tutar); return; }
      if(x.tip==="satis"){ const tut=x.gerilla?(num(x.tahsil)||n*num(x.satisFiyat)):n*num(x.satisFiyat);
        sat.push({ad,adet:n,birim:num(x.satisFiyat),tutar:tut,raftan:x.kaynak==="konsinye",seyyar:!!x.gerilla});
        ciro+=tut; tahEk+=num(x.tahsil); return; }
      if(x.tip==="iade"){ if(x.kaynak!=="canta") iade.push({ad,adet:n}); return; }
      if(x.tip==="konsinye"&&x.konsMod!=="hediye"){ birak.push({ad,adet:n,birim:num(x.satisFiyat),tutar:n*num(x.satisFiyat)}); return; }
      if(x.tip==="hediye"){ hed.push({ad,adet:n,raftan:x.kaynak==="konsinye"}); return; }
      // envanteri kıpırdatmayan işlemler de rapora düşsün — yoksa ziyaret boş görünür
      if(x.tip==="diplomasi"){ diger.push({t:"⚔️ Ziyaret",v:(x.not||"").slice(0,60)||"—"}); return; }
      if(x.tip==="stant"){ diger.push({t:"🎪 Stant",v:num(x.fiyat)>0?tl(num(x.fiyat)):"—"}); return; } });
    // 1) sayım: raftan satılan + raftan hediye edilen düşülür
    eksik={};
    g.kayit.forEach(x=>{ if(rafAzalt(x)&&x.tip!=="iade"){ const u=x.urunAd||"?";
      eksik[u]=num(eksik[u])+rafDus(u,num(x.adet)); } });
    const sayim=kopya(raf), sayimD={...rafD};
    // 2) iade alınanlar raftan çıkar  3) yeni bırakılanlar rafa girer
    /* Kaledeki her iade raftan çıkar — kaynak alanı taşımayan eski kayıtlar da.
       (Çantadan depoya dönüş rafla ilgisizdir, o dışarıda kalır.) */
    g.kayit.forEach(x=>{ const u=x.urunAd||"?";
      if(x.tip==="iade"&&x.kaynak!=="canta") eksik[u]=num(eksik[u])+rafDus(u,num(x.adet));
      else if(rafArtir(x)){ rafEkle(u,num(x.adet),num(x.satisFiyat)); hicKons=true;
        if(num(disari[u])>0){ const d=Math.min(num(disari[u]),num(raf[u])); rafDus(u,d); disari[u]=num(disari[u])-d; } } });
    // bırakış sonrası, aynı ziyarette karşılanamamış çıkışlar kapatılır
    Object.keys(eksik).forEach(u=>{ if(num(eksik[u])>0) eksik[u]=rafDus(u,num(eksik[u])); });
    const guncel=kopya(raf), guncelD={...rafD};
    /* 4) doğrudan satılan müşterinin malı olur — standda durur ama konsinye değildir */
    g.kayit.forEach(x=>{ if(dogrudanSatis(x)) ekle(mul,mulD,x.urunAd||"?",num(x.adet),num(x.satisFiyat)); });
    const mulk=kopya(mul), mulkD={...mulD};
    /* Aynı ürünün birden çok kaydı tek satırda toplansın — iki ayrı konsinye
       kaydıyla bırakılan 10+10 Ahtapot raporda "20 adet" olarak görünür. */
    const birlestir=(L,anahtar)=>{ const m={},sira=[];
      L.forEach(x=>{ const k2=anahtar(x); if(!m[k2]){ m[k2]={...x}; sira.push(k2); }
        else { m[k2].adet+=x.adet; if(m[k2].tutar!=null) m[k2].tutar+=num(x.tutar); } });
      return sira.map(k2=>m[k2]); };
    const birakL=birlestir(birak,x=>x.ad+"|"+x.birim);
    const satL=birlestir(sat,x=>x.ad+"|"+x.birim+"|"+(x.raftan?1:0)+"|"+(x.seyyar?1:0));
    const top=L2=>L2.reduce((s,x)=>s+num(x.tutar),0);
    return {i,bas:g.bas,son:g.son,kayit:g.kayit,once,onceD,sayim,sayimD,guncel,guncelD,mulk,mulkD,ilkGiris,
      sat:satL,
      /* Üç ayrı satış: raftan (konsinye çözülür) · doğrudan (mal müşterinin olur) · seyyar (mekanla ilgisiz) */
      satKons:satL.filter(x=>x.raftan), satDog:satL.filter(x=>!x.raftan&&!x.seyyar), satSey:satL.filter(x=>x.seyyar),
      satKonsTop:top(satL.filter(x=>x.raftan)), satDogTop:top(satL.filter(x=>!x.raftan&&!x.seyyar)),
      satSeyTop:top(satL.filter(x=>x.seyyar)),
      iade:birlestir(iade,x=>x.ad), birak:birakL,
      birakAdet:birakL.reduce((s,x)=>s+num(x.adet),0), birakTop:top(birakL),
      hed:birlestir(hed,x=>x.ad+"|"+(x.raftan?1:0)), diger,tah,ciro,tahEk}; });
  return out.reverse();   // en yeni üstte
}
const rafTop=o=>Object.keys(o||{}).reduce((s,k2)=>s+num(o[k2]),0);
/* dm verilirse her satır bırakış tutarını da taşır (birim = ortalama bırakış fiyatı) */
const rafSat=(o,dm)=>Object.keys(o||{}).sort((a,b)=>num(o[b])-num(o[a])||a.localeCompare(b,"tr")).map(k2=>{
  const adet=num(o[k2]), tutar=dm?num(dm[k2]):0;
  return {ad:k2,adet,tutar,birim:adet>0?tutar/adet:0}; });
const rafDeger=(o,dm)=>rafSat(o,dm).reduce((s,r)=>s+r.tutar,0);

  const rafTut=(o,dm)=>rafTop(o)+" adet"+(rafDeger(o,dm)>0.5?(" · "+tl(rafDeger(o,dm))):"");

      .concat(z.satSey.length>1?["Toplam: "+tl(z.satSeyTop)]:[]))
    +blok("İADE ALINAN",z.iade.map(s=>"• "+s.ad+" ×"+s.adet))
    +blok((z.ilkGiris?"KONSİNYE BIRAKILAN":"TEKRAR KONSİNYE BIRAKILAN"),z.birak.map(satRow)
      .concat(z.birak.length?["Toplam: "+z.birakAdet+" adet · "+tl(z.birakTop)]:[]))

    +((rafBirakAyni(z.guncel,z.birak)||(rafTop(z.once)===0&&rafTop(z.guncel)===0))?"":blok(

      rafSat(z.guncel,z.guncelD).length
        ?rafSat(z.guncel,z.guncelD).map(rafRow).concat(["Toplam "+rafTut(z.guncel,z.guncelD)])
        :["• konsinye kalmadı"]))

/* ═════════ ZİYARET FİŞİ · PNG ═════════
   Neden Canvas: uygulama CDN'e çıkamıyor (html2canvas gibi bir kütüphane
   yüklenemez) ve ekran görüntüsü almak kullanıcıya bırakılamaz. Canvas hem
   bağımsız hem keskin (retina için 2× ölçek) hem de doğrudan paylaşılabilir
   bir dosya üretir. Şablon Tikita renklerinde: kehribar başlık, gold tutar. */
const FIS_R={bas1:"#7c2d12",bas2:"#b45309",bolBg:"#fdf1e0",bolTxt:"#7c2d12",
  txt:"#1b1e25",mut:"#a9adb6",cizgi:"#ece7df",gold:"#b45309",yesil:"#16a34a",kirmizi:"#e0483c",kagit:"#ffffff"};
function fisBolumler(z){
  const B=[];
  /* Konsinye satırlarında bırakış birim fiyatı da yazılır — hem sayımda hem
     bırakışta hem güncel durumda, ki rafın parasal karşılığı da görünsün. */
  const rs=(o,dm)=>rafSat(o,dm).map(r=>({ad:r.ad,
    alt:r.adet+" adet"+(r.birim>0?(" × "+tl(r.birim)):""),
    sag:r.birim>0?tl(r.tutar):(r.adet+" adet")}));
  const rafTut=(o,dm)=>rafTop(o)+" adet"+(rafDeger(o,dm)>0.5?("  ·  "+tl(rafDeger(o,dm))):"");
  const mulkVar=rafTop(z.mulk)>0;
  // ilk kez ürün giren kalede sayılacak bir şey yoktu — o bölüm hiç basılmaz
  if(!z.ilkGiris) B.push(rafSat(z.sayim).length
    ?{b:"SAYIM SONRASI MÜŞTERİDE",satir:rs(z.sayim,z.sayimD),toplam:{ad:"Toplam",sag:rafTut(z.sayim,z.sayimD)}}
    :{b:"SAYIM SONRASI MÜŞTERİDE",satir:[{ad:"Rafta konsinye kalmamış",alt:"",sag:"0 adet"}]});
  // fiyat yoksa "0 ₺" yazılmaz — raf satırlarıyla aynı davranış
  const satSat=L=>L.map(x=>({ad:x.ad,alt:x.adet+(x.birim>0?(" × "+tl(x.birim)):" adet"),
    sag:x.birim>0?tl(x.tutar):(x.adet+" adet"),vurgu:x.birim>0}));
  if(z.satKons.length) B.push({b:"KONSİNYEDEN SATILAN",satir:satSat(z.satKons),
    toplam:z.satKons.length>1?{ad:"Toplam",sag:tl(z.satKonsTop)}:null});
  /* Doğrudan satış konsinyeden ayrı bölümde: mal müşterinin olur, standda
     onun malı olarak durur, sonraki sayımda konsinyeyle karışmaz. */
  if(z.satDog.length) B.push({b:"DOĞRUDAN SATIŞ",satir:satSat(z.satDog),
    toplam:z.satDog.length>1?{ad:"Toplam",sag:tl(z.satDogTop)}:null});
  if(z.satSey.length) B.push({b:"SEYYAR SATIŞ",satir:satSat(z.satSey),
    toplam:z.satSey.length>1?{ad:"Toplam",sag:tl(z.satSeyTop)}:null});
  if(z.iade.length) B.push({b:"İADE ALINAN",satir:z.iade.map(x=>({ad:x.ad,alt:"",sag:x.adet+" adet"}))});
  if(z.birak.length) B.push({b:(z.ilkGiris?"KONSİNYE BIRAKILAN":"TEKRAR KONSİNYE BIRAKILAN"),
    satir:z.birak.map(x=>({ad:x.ad,alt:x.adet+" adet × "+tl(x.birim),sag:tl(x.tutar)})),
    toplam:{ad:"Toplam",sag:z.birakAdet+" adet  ·  "+tl(z.birakTop)}});
  if(z.hed.length) B.push({b:"HEDİYE",satir:z.hed.map(x=>({ad:x.ad,alt:"",sag:x.adet+" adet"}))});
  if((z.diger||[]).length) B.push({b:"DİĞER",satir:z.diger.map(x=>({ad:x.t,alt:"",sag:x.v||"—"}))});
  /* Güncel durum yazılmaz: (a) bırakılanla birebir aynıysa, (b) rafın öncesi de
     sonrası da boşsa — sadece tahsilat/ziyaret kaydı olan uğrayışta anlamsız. */
  const rafSessiz=rafTop(z.once)===0&&rafTop(z.guncel)===0;
  if(!rafBirakAyni(z.guncel,z.birak)&&!rafSessiz)
    B.push({b:mulkVar?"STANDIN KONSİNYE DURUMU":"STANDIN GÜNCEL DURUMU",
      satir:rafSat(z.guncel).length?rs(z.guncel,z.guncelD):[{ad:"Konsinye kalmadı",alt:"",sag:"0 adet"}],
      toplam:rafSat(z.guncel).length?{ad:"Toplam",sag:rafTut(z.guncel,z.guncelD)}:null});
  /* Bu havuz birikimlidir — mekanın kendi malını satması Tikita'da olay
     üretmediği için azalmaz. Başlık bu yüzden zaman kapsamını taşır. */
  if(mulkVar) B.push({b:"MÜŞTERİNİN BUGÜNE DEK SATIN ALDIĞI",satir:rs(z.mulk,z.mulkD),
    toplam:{ad:"Toplam",sag:rafTut(z.mulk,z.mulkD)}});

}
function ziyaretPngCiz(k,z){
  const B=fisBolumler(z);
  const W=1100, OL=2, KX=40;                        // KX: kenar boşluğu
  const BAS=176, BOL=64, SAT=62, TOP=118, ALT=34;   // blok yükseklikleri

  const kis=(t,max)=>{ let s2=String(t==null?"":t); if(g.measureText(s2).width<=max) return s2;
    while(s2.length>1&&g.measureText(s2+"…").width>max) s2=s2.slice(0,-1); return s2+"…"; };
  const yuvarlak=(x,y,w,h,r)=>{ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r);

  g.fillStyle=gr; g.fillRect(0,0,W,BAS);

  /* Önce büyüt sonra kırp: büyük harfler daha geniş, ters sırada kırpılan ad
     büyütülünce bütçesini aşıp "…" bile koymadan kenardan taşıyordu. */
  F(52,800); g.fillText(kis(String((k&&k.ad)||"Kale").toLocaleUpperCase("tr"),W-2*KX),KX,84);
  const d=new Date(z.son);
  const gecerliT=!isNaN(+d)&&+d>0;   // epoch(0) bozuk tarihtir, 1970 yazılmaz
  const tarih=gecerliT?(d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric"})
    +" · "+d.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})):"tarihsiz kayıt";
  F(25,600); g.fillStyle="rgba(255,255,255,.9)"; g.fillText(tarih+"  ·  Ziyaret Raporu",KX,128);
  let y=BAS+22;
  B.forEach(bl=>{
    // bölüm başlığı
    g.fillStyle=FIS_R.bolBg; yuvarlak(KX,y,W-2*KX,BOL-14,12); g.fill();
    F(24,800); g.fillStyle=FIS_R.bolTxt; g.textAlign="left";
    g.fillText(bl.b,KX+22,y+34);
    y+=BOL;
    const ciz=(r,kalin)=>{
      F(kalin?27:26,kalin?800:600); g.fillStyle=FIS_R.txt; g.textAlign="left";
      const sagG=(()=>{ F(kalin?29:27,800); return g.measureText(String(r.sag||"")).width; })();
      F(kalin?27:26,kalin?800:600);
      const altG=r.alt?(()=>{ F(21,500); const w=g.measureText(r.alt).width; F(26,600); return w+18; })():0;
      g.fillText(kis(r.ad,W-2*KX-sagG-altG-60),KX+22,y+38);
      if(r.alt){ const adG=g.measureText(kis(r.ad,W-2*KX-sagG-altG-60)).width;
        F(21,500); g.fillStyle=FIS_R.mut; g.fillText(r.alt,KX+22+adG+18,y+38); }
      F(kalin?29:27,800); g.fillStyle=r.vurgu||kalin?FIS_R.gold:FIS_R.txt; g.textAlign="right";
      g.fillText(String(r.sag||""),W-KX-22,y+38);
      g.textAlign="left";

  const durum=bedel<=0.5?["SATIŞ YOK",FIS_R.mut]
    :(alinan>=bedel-0.5?["✓ TAHSİL EDİLDİ",FIS_R.yesil]
    :(alinan>0.5?["KISMİ TAHSİLAT",FIS_R.gold]:["⏳ TAHSİL EDİLMEDİ",FIS_R.kirmizi]));
  g.fillStyle=FIS_R.bas2; g.fillRect(KX,y+2,W-2*KX,3);
  y+=26;
  F(30,800); g.fillStyle=FIS_R.txt; g.textAlign="left";
  g.fillText("TAHSİL EDİLECEK",KX+4,y+34);
  F(46,800); g.fillStyle=FIS_R.gold; g.textAlign="right";
  g.fillText(tl(bedel),W-KX-4,y+38);
  y+=54;
  F(23,800); g.textAlign="left";
  const fazla=Math.max(0,alinan-bedel);
  const et=durum[0]+(alinan>0.5&&alinan<bedel-0.5?(" · "+tl(alinan)+" alındı, "+tl(kalan)+" kaldı")

  g.fillStyle=durum[1]; g.fillText(et,KX+21,y+27);

async function ziyaretPaylas(k,z,say){
  try{
    const cv=ziyaretPngCiz(k,z);
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    if(!blob){ say&&say("⚠ Görsel oluşturulamadı"); return; }
    const d=new Date(z.son);
    const gunAd=isNaN(+d)?"":d.toISOString().slice(0,10);
    const adDosya=("ziyaret-"+String((k&&k.ad)||"kale").replace(/[^\wçğıöşüÇĞİÖŞÜ]+/g,"-")+"-"+gunAd+".png").slice(0,80);
    const dosya=new File([blob],adDosya,{type:"image/png"});
    /* Mobilde WhatsApp'a doğrudan görsel göndermenin tek yolu paylaşım sayfası. */
    if(navigator.canShare&&navigator.canShare({files:[dosya]})){
      await navigator.share({files:[dosya],title:((k&&k.ad)||"Kale")+" · ziyaret raporu"});
      return; }
    // yedek: indir + metni WhatsApp'a taşı
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=adDosya; a.rel="noopener";
    document.body.appendChild(a); a.click();
    /* Bağlantı hemen kaldırılırsa tarayıcı 'download' adını kaçırabiliyor —
       dosya "download" diye kaydediliyor. Bir tur bekletip kaldır. */
    setTimeout(()=>{ try{ a.remove(); }catch(e){} URL.revokeObjectURL(url); },5000);
    try{ window.open("https://wa.me/?text="+encodeURIComponent(ziyaretMetni(k,z)),"_blank"); }catch(e){}
    say&&say("🖼 Görsel indirildi — WhatsApp'a ekleyebilirsin");
  }catch(e){ console.error(e); say&&say("⚠ Paylaşılamadı"); }
}

/* 🧭 GÖREV ROTASI — komutanın verdiği görevin durakları sırayla haritada.
   Duraklar komuta panelinde rota sırasına dizilmiş hâlde kaydediliyor, burada
   o sıra korunuyor. Köşedeki düğme aynı sırayı Google Maps yol tarifine taşır. */
const GMAPS_DURAK=10;   // Google Maps bağlantısında taşınabilecek en fazla nokta
function gmapsRota(duraklar){
  const L=(duraklar||[]).filter(x=>x&&x.lat&&x.lng).slice(0,GMAPS_DURAK);
  if(!L.length) return "";
  const hd=L[L.length-1], ara=L.slice(0,-1).map(x=>x.lat+","+x.lng).join("|");
  return "https://www.google.com/maps/dir/?api=1&travelmode=driving&destination="
    +hd.lat+","+hd.lng+(ara?("&waypoints="+encodeURIComponent(ara)):"");
}

        iconSize:[28,28],iconAnchor:[14,26]});
      L.marker([+x.lat,+x.lng],{icon:ic}).addTo(map)

        border:"1px solid rgba(255,255,255,.18)",fontSize:18,color:"#fff",flexShrink:0}},"‹"),
      h("div",{style:{flex:1,minWidth:0}},
        h("div",{style:{fontSize:16.5,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},(g&&g.ad)||"Görev"),
        h("div",{style:{fontSize:12,color:"rgba(255,255,255,.85)",fontWeight:600,marginTop:2}},
          dur.length+" durak · sırayla"+(fazla?(" · tarife ilk "+GMAPS_DURAK):""))),
      url?h("a",{href:url,target:"_blank",rel:"noopener",
        style:{flexShrink:0,padding:"9px 13px",borderRadius:12,background:"rgba(255,255,255,.94)",color:"#0b5f92",
          fontSize:12.5,fontWeight:800,textDecoration:"none",whiteSpace:"nowrap"}},"🧭 Google Maps"):null),
    h("div",{ref,style:{flex:1,minHeight:180}}),
    h("div",{style:{maxHeight:"38%",overflowY:"auto",background:"var(--surf)",borderTop:"1px solid var(--line)",

      dur.length?dur.map((x,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",gap:11,padding:"9px 0",
          borderTop:i?"1px solid var(--line)":"none"}},

function Harita({d,openKale,say,adaylar,openAday,onYeniKale,onYeniKaleAt,digerKaleler,hedefDuraklar}){

  useEffect(()=>{ if(!window.L||!ref.current) return;
    const L=window.L; const map=L.map(ref.current,{zoomControl:false,attributionControl:false});

    const pts=[];

      (digerKaleler||[]).forEach(dk=>{ const ic=L.divIcon({className:"",html:'<div class="kmark" style="width:24px;height:24px;background:#475569;opacity:.85"><span>🏚️</span></div>',iconSize:[24,24],iconAnchor:[12,22]});
        const mk=L.marker([+dk.lat,+dk.lng],{icon:ic}).addTo(map); mk.on("click",()=>say("🏚️ "+dk.ad+" — başka komutanın kalesi")); });
    }
    if(pts.length) map.fitBounds(pts,{padding:[50,50],maxZoom:15}); else map.setView([41.02,29.05],12);
  },[f,d.kaleler.length,adayKonum.length,(hedefDuraklar||[]).length,(digerKaleler||[]).length]);
  const filtreler=[["all","Tümü",konumlu.length+adayKonum.length],["borc","🧾",konumlu.filter(k=>k.durum.key==="borc").length],["konsinye","🏬",konumlu.filter(k=>k.acikKons>0).length],["ihmal","⚔️",konumlu.filter(k=>k.durum.key==="ihmal").length],["saglam","🛡️",konumlu.filter(k=>k.durum.key==="saglam").length],["aday","🔭",adayKonum.length]];
  return h("div",{style:{position:"relative",height:"calc(100vh - 92px)"}},
    h("div",{ref,style:{position:"absolute",inset:0}}),
    h("div",{style:{position:"absolute",top:"calc(env(safe-area-inset-top,0px) + 12px)",left:12,right:12,zIndex:500,display:"flex",gap:7,overflowX:"auto"}},
      filtreler.map(([k,ad,n])=>h("button",{key:k,onClick:()=>setF(k),style:{flexShrink:0,padding:"9px 13px",borderRadius:99,fontSize:12.5,fontWeight:700,

function Cephane({d,say,cantaAc,openUrun,onStokDuzelt,bekle}){
  // 🗂 seri süzgeci — komutadan atanan ürün serileri; seri yoksa çubuk hiç çıkmaz

  const seriAd=(()=>{ const m={}; (d.cephane||[]).forEach(u=>(u.seriler||[]).forEach(sr=>{
      const t=String(sr||"").trim(); if(t) m[t.toLocaleLowerCase("tr")]=t; }));
    return Object.keys(m).map(k=>m[k]).sort((a,b)=>a.localeCompare(b,"tr")); })();
  const uye=u=>(u.seriler||[]).some(x=>String(x).toLocaleLowerCase("tr")===seri.toLocaleLowerCase("tr"));
  const YENI_SAY=10;   // 🆕 en son eklenen kaç ürün gösterilsin
  const yeniler=enYeniUrunler(d.cephane,YENI_SAY);
  const liste=seri==="yeni"?yeniler
    :(!seri?(d.cephane||[]):(seri==="_"?(d.cephane||[]).filter(u=>!(u.seriler||[]).length):(d.cephane||[]).filter(uye)));
  const SZ=!!d.sinirsiz;   // 🏭 çanta askıda — doğrudan atölye stoğu
  // eksideki ürün "varlık" saymaz — toplam yalnız gerçekten elde olanı sayar
  const seriCanta=liste.reduce((s,u)=>s+Math.max(0,num(SZ?u.stokta:u.canta)),0);
  const stokTop=(d.cephane||[]).reduce((s,u)=>s+Math.max(0,num(u.stokta)),0);

      h("div",{style:{fontSize:13,color:"var(--mut)",fontWeight:600}},
        SZ?(seri?(liste.length+" ürün · atölyede "+seriCanta):("atölyede "+stokTop+" varlık"))

    /* ⚠️ Eksi stok: montajı fiilen biten ama programda hâlâ montajda görünen ürün

      h("div",{style:{fontSize:11.5,color:"#9a3412",fontWeight:600,lineHeight:1.5,marginBottom:9}},
        eksi.length+" üründe atölye stoğu eksiye düştü. Montajı biten ama programa girmemiş olabilir — sayıp düzelt."),
      eksi.map((u,i)=>h("div",{key:u.id||i,style:{display:"flex",alignItems:"center",gap:9,padding:"7px 0",
        borderTop:i?"1px solid #fecaca":"none"}},

        h("span",{style:{fontSize:13.5,fontWeight:800,color:"#b91c1c",flexShrink:0}},num(u.stokta)+" ad"),
        h("button",{onClick:()=>onStokDuzelt&&onStokDuzelt(u),disabled:bekle,
          style:{flexShrink:0,padding:"5px 11px",borderRadius:9,background:"#b91c1c",color:"#fff",fontSize:11.5,fontWeight:800,
            opacity:bekle?.5:1}},"⚖️ Düzelt")))):null,
    cubuk?h("div",{style:{display:"flex",gap:7,overflowX:"auto",paddingBottom:8,marginBottom:12}},
      h(Chip,{on:!seri,onClick:()=>setSeri("")},"Tümü"),
      yeniler.length?h(Chip,{on:seri==="yeni",onClick:()=>setSeri(seri==="yeni"?"":"yeni")},"🆕 En yeniler"):null,
      seriAd.map(sr=>h(Chip,{key:sr,on:seri===sr,onClick:()=>setSeri(seri===sr?"":sr)},"🗂 "+sr)),

        h("div",{style:{display:"flex",gap:10,marginTop:8,fontSize:12,color:"var(--mut)"}},
          h("span",null,h("b",{style:{color:u.stokta<0?"#b91c1c":"var(--txt)",fontSize:15}},u.stokta)," atölye"),
          u.fiyat>0&&h("span",{style:{marginLeft:"auto",color:"var(--green)",fontWeight:700}},tl(u.fiyat)))))),

      background:"linear-gradient(90deg,#f4a63a,#d97b12)",color:"#2a1408",fontSize:15,fontWeight:800,
      boxShadow:"0 10px 26px rgba(217,123,18,.4)"}},SZ?("📤 Çantandaki "+d.cantaTop+" ürünü atölyeye bırak"):"🎒 Cephane ekle"):null);
}

/* 💵 NAKİT TESLİM — topladığın parayı komutaya teslim ettiğini bildir */
function NakitTeslimSheet({ND,hareketler,onTeslim,onClose,say}){
  const [tut,setTut]=useState("");
  const [not,setNot]=useState("");
  const [bekle,setBekle]=useState(false);
  const v=num(String(tut).replace(",","."));
  const gecmis=(hareketler||[]).filter(x=>x.tip==="nakitTeslim")
    .sort((a,b)=>new Date(b.tarih)-new Date(a.tarih)).slice(0,15);
  const satir=(ad,d,renk,kalin)=>h("div",{style:{display:"flex",alignItems:"baseline",gap:10,padding:"8px 0",
      borderTop:kalin?"1.5px solid var(--line)":"none"}},
    h("div",{style:{flex:1,fontSize:kalin?14:13,fontWeight:kalin?800:600}},ad),
    h("div",{style:{fontSize:kalin?15:13.5,fontWeight:800,color:renk||"var(--txt)",whiteSpace:"nowrap"}},d));
  async function gonder(){
    if(bekle) return;
    if(v<=0){ say&&say("Tutar gir"); return; }
    if(v>ND.kalan+0.5&&!confirm("Girdiğin tutar elindeki nakitten ("+tl(ND.kalan)+") fazla.\nYine de bildirilsin mi?")) return;
    if(!confirm("💵 "+tl(v)+" komutaya teslim edildi olarak bildirilsin mi?\nKomuta onayladıktan sonra hesabından düşer.")) return;
    setBekle(true);
    try{ await onTeslim(v,not.trim()); say&&say("💵 Teslim bildirildi · "+tl(v)); onClose&&onClose(); }
    catch(e){ say&&say("⚠ Bildirilemedi"); }
    finally{ setBekle(false); }
  }
  return h(Sheet,{ik:"💵",hex:"#0e8fce",baslik:"Nakit teslim",alt:"topladığın parayı komutaya bildir",
    onClose,cta:bekle?"Bildiriliyor…":"💵 Teslim ettim",onCta:gonder,disabled:bekle||v<=0},
    h("div",{style:{background:"var(--surf2)",borderRadius:14,padding:"12px 14px",marginBottom:14}},
      satir("Kapanan haftalarda toplanan",tl(ND.toplanan)),
      satir("Teslim edilen",tl(ND.teslim),"var(--green)"),
      ND.bekleyen>0.5?satir("Onay bekleyen",tl(ND.bekleyen),"var(--gold)"):null,
      satir("ŞİMDİ TESLİM EDİLECEK",tl(ND.kalan),ND.kalan>0.5?"var(--cyan)":"var(--green)",true),
      ND.acikHafta>0.5?satir("🗓 Bu hafta toplanan (kesim sonrası)",tl(ND.acikHafta),"#9a3412"):null),
    ND.acikHafta>0.5?h("div",{style:{padding:"9px 12px",borderRadius:11,background:"#fff7ed",
      border:"1px solid #fed7aa",fontSize:11.5,fontWeight:700,color:"#9a3412",marginBottom:12,
      lineHeight:1.5}},
      "Süren haftada topladığın "+tl(ND.acikHafta)+" bu teslimata girmez. Hafta cuma akşamı "
      +"kapanınca teslim edilecek tutara eklenir."):null,
    h("div",{className:"lbl",style:{marginBottom:5}},"Teslim edilen tutar"),
    h("div",{style:{display:"flex",gap:8,marginBottom:10}},
      h("input",{type:"text",inputMode:"decimal",value:tut,onChange:e=>setTut(e.target.value),
        placeholder:"0",style:{...inp,flex:1}}),
      ND.kalan>0.5?h("button",{onClick:()=>setTut(String(Math.round(ND.kalan*100)/100)),
        style:{padding:"0 16px",borderRadius:13,background:"var(--surf2)",border:"1.5px solid var(--line)",
          fontSize:13,fontWeight:800,color:"var(--cyan)",whiteSpace:"nowrap"}},"Tümü"):null),
    h("input",{type:"text",value:not,onChange:e=>setNot(e.target.value),
      placeholder:"Not (elden, havale…)",style:{...inp,marginBottom:14}}),
    gecmis.length?h(React.Fragment,null,
      h("div",{className:"lbl",style:{marginBottom:5}},"Teslim geçmişi"),
      gecmis.map((x,i)=>h("div",{key:x.id||i,style:{display:"flex",alignItems:"center",gap:9,
          padding:"9px 0",borderBottom:"1px solid var(--line)"}},
        h("span",{style:{fontSize:16}},x.onay===false?"⏳":"✅"),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontSize:12.5,fontWeight:700}},x.onay===false?"Onay bekliyor":"Teslim alındı"),
          h("div",{style:{fontSize:11,color:"var(--mut)",marginTop:1}},
            new Date(x.tarih).toLocaleDateString("tr-TR",{day:"2-digit",month:"short"})
            +(x.not?(" · "+x.not):""))),
        h("div",{style:{fontSize:13.5,fontWeight:800,color:x.onay===false?"var(--gold)":"var(--green)"}},tl(x.tutar))))
      ):null);

/* 🗄 HAFTALIK ARŞİV — sistemin başladığı haftadan bugüne bütün haftalar.
   Her hafta yılın kaçıncı haftasıysa o numarayla ve tarih aralığıyla listelenir;
   dokununca o haftanın raporu açılır. Gönderilmiş de gönderilmemiş de burada. */

  const L=list||[];
  const durumOf=g=>g.kayit
    ?(g.kayit.durum==="odendi"?["ödendi","#dcfce7","#166534"]
     :(g.kayit.durum==="onaylandi"?["onaylandı","#e0f2fe","#075985"]:["gönderildi","#e0f2fe","#075985"]))
    :(g.adet>0||g.nakit>0.5?["gönderilmedi","#ffe4e6","#9f1239"]:["hareket yok","#f1f5f9","#64748b"]);
  const yilGrup={}; L.forEach(g=>{ (yilGrup[haftaYil(g.b0)]=yilGrup[haftaYil(g.b0)]||[]).push(g); });
  const yillar=Object.keys(yilGrup).sort((a,b)=>b-a);
  return h(Sheet,{ik:"🗄",hex:"#334155",baslik:"Haftalık arşiv",
    alt:L.length?(L.length+" hafta · en yeniden eskiye"):"",onClose,cta:"Kapat",onCta:onClose},
    yillar.map(y=>h(React.Fragment,{key:y},
      yillar.length>1?h("div",{className:"lbl",style:{margin:"6px 0 8px"}},y):null,
      yilGrup[y].map((g,i)=>{ const D2=durumOf(g);
        return h("button",{key:g.kod||i,onClick:()=>onSec&&onSec(g.b0),
          style:{display:"flex",alignItems:"center",gap:10,width:"100%",textAlign:"left",
            padding:"11px 0",borderTop:i?"1px solid var(--line)":"none",background:"none"}},
          h("div",{style:{flex:1,minWidth:0}},
            h("div",{style:{fontSize:14,fontWeight:800}},haftaNo(g.b0)+". hafta"),
            h("div",{style:{fontSize:11.5,color:"var(--mut)",marginTop:2}},
              g.etiket+(g.adet>0?(" · "+g.adet+" adet · "+tl(g.ciro)):""))),

// bir deneme (overlay) kaydını insanca özetle
function ovOzet(x){
  if(x.tip==="tahsilat") return {ik:"🧾",t:x.avans?"Tahsilat (sayımsız)":"Tahsilat",v:tl(x.tutar)};
  if(x.tip==="konsinye") return {ik:"🏬",t:"Konsinye bırakıldı",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="hediye") return {ik:"🎁",t:"Hediye edildi",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="iade") return {ik:"↩️",t:"İade",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="satis"&&x.kaynak==="konsinye") return {ik:"🏬",t:"Konsinye satış",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="satis"&&x.gerilla) return {ik:"⚡",t:"Gerilla satış",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="satis") return {ik:"💰",t:"Satış",v:num(x.adet)+" × "+(x.urunAd||"?")};
  if(x.tip==="diplomasi") return {ik:"⚔️",t:"Ziyaret",v:x.not?("“"+String(x.not).slice(0,24)+"”"):""};
  if(x.tip==="stant") return {ik:"🎪",t:"Stant",v:x.mod==="satis"?tl(x.fiyat):"hediye"};
  if(x.tip==="tabla") return {ik:"🧹",t:"Tabla toplama",v:tl(x.tutar)};
  if(x.tip==="tablaOde") return {ik:"✅",t:"Tabla hakedişi ödendi",v:tl(x.tutar)};
  if(x.tip==="nakitTeslim") return {ik:x.onay===false?"⏳":"💵",t:"Nakit teslim"+(x.onay===false?" (onay bekliyor)":""),v:tl(x.tutar)};
  return {ik:"•",t:x.tip||"kayıt",v:""};
}

/* ————— SEFER: dönem raporu + çanta doldurma ————— */
const BEDAVA_ESIK=1;   // ₺/adet — bu ve altı sembolik fiyat: ürün fiilen bedava verilmiştir
/* 🎁 SEMBOLİK FİYAT = HEDİYE. 1 ₺ ve altına verilen ürün için para alınmamıştır;
   kayıt daha en baştan "hediye" olarak açılır. Eskiden satış olarak yazılıp sefer
   raporunda elle hediyeye çevriliyordu — rapor verilmediği sürece kalede 1 ₺ ciro
   ve 1 ₺ borç olarak duruyordu. */
const sembolik=f=>num(f)<=BEDAVA_ESIK;
/* 🧾 DÖNEM RAPORU — hakediş kesme tarihinden SONRA satışta doğar, tahsilatta değil.
   Eskiden tahsilatın içinden "pazarlamacı payı" ayrılıyordu (ureticiPay/pazPay).
   Yeni modelde tahsil edilen paranın TAMAMI Tikita'ya teslim edilir; hakediş
   haftalık dönemde ayrıca ödenir. İkisi birlikte sayılırsa pazarlamacının payı
   iki kez görünür ve müşteriden alınan para eksik gösterilir. */
function donemRapor(recs){ let satAd=0,ciro=0,tah=0,konsAd=0,ganimet=0,iade=0,hediyeAd=0;
  let hakYeni=0,hakEski=0,tabla=0,nakitEski=0;
  (recs||[]).forEach(x=>{
    const yeni=(new Date(x.tarih).getTime()||0)>=HAKEDIS_BAS_MS;
    if(x.tip==="satis"){
      satAd+=num(x.adet); ciro+=num(x.adet)*num(x.satisFiyat);   // gerilla dahil — hepsi satıştır
      const th=num(x.tahsil)||num(x.adet)*num(x.satisFiyat);
      const K=num(x.adet)*num(x.alisFiyat);
      if(x.gerilla){ ganimet+=th; if(!yeni){ hakEski+=(th-K); nakitEski+=th; } }
      // yeni model: hakediş satışta doğar — kale satışı da gerilla da aynı kural
      if(yeni&&!sembolik(x.satisFiyat)) hakYeni+=num(x.adet)*num(x.satisFiyat)-K; }
    else if(x.tip==="tahsilat"){ tah+=num(x.tutar);
      if(!yeni){ hakEski+=(x.pazPay!=null?num(x.pazPay):0); nakitEski+=num(x.tutar); } }
    else if(x.tip==="tabla"){ tabla+=num(x.tutar); }   // tabla ücreti de kazançtır
    else if(x.tip==="konsinye"){ konsAd+=num(x.adet); }
    else if(x.tip==="iade"){ iade+=num(x.adet); }
    else if(x.tip==="hediye"){ hediyeAd+=num(x.adet); } });
  const hak=hakYeni+hakEski+tabla;
  const nakit=tah+ganimet;                       // pazarlamacının elindeki toplam para
  const tikita=Math.max(0,nakit-hakEski);        // yeni dönemde nakdin tamamı Tikita'ya gider
  return {satAd,ciro,tah,konsAd,hak,hakYeni,hakEski,tabla,ganimet,iade,hediyeAd,nakit,tikita,
    bos:!(satAd||tah||konsAd||ganimet||iade||hak||hediyeAd)}; }
// komuta raporunu WhatsApp metnine çevir — satış · konsinye · tahsilat sırasıyla, emojisiz
function raporMetni(v,recs){ v=v||{};
  const R=recs||[];
  const kisi=((R.find(x=>x.kullaniciAd)||{}).kullaniciAd)||"";
  const tarih=new Date().toLocaleString("tr-TR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
  const sol=(t,w)=>{ t=String(t); return t.length>=w?t.slice(0,w):t+" ".repeat(w-t.length); };
  const sag=(t,w)=>{ t=String(t); return t.length>=w?t:" ".repeat(w-t.length)+t; };
  const sat=(a,b,c)=>sol(a,17)+sag(b||"",6)+sag(c||"",10);
  const ciro=x=>num(x.adet)*num(x.satisFiyat);
  const urunTop=arr=>{ const m={}; arr.forEach(x=>{ const k=x.urunAd||"?"; const o=m[k]||(m[k]={ad:k,adet:0,tut:0});
      o.adet+=num(x.adet); o.tut+=ciro(x); }); return Object.values(m).sort((a,b)=>b.tut-a.tut); };
  const adOf=arr=>arr.reduce((s2,x)=>s2+num(x.adet),0);
  const tutOf=arr=>arr.reduce((s2,x)=>s2+ciro(x),0);
  const L=[];
  // 1) SATIŞ — gerilla · konsinyeden · toptan
  const satis=R.filter(x=>x.tip==="satis");
  const gruplar=[
    ["Gerilla",satis.filter(x=>x.gerilla&&!x.toptan)],
    ["Konsinyeden",satis.filter(x=>x.kaynak==="konsinye")],
    ["Toptan",satis.filter(x=>x.toptan)],
    ["Doğrudan",satis.filter(x=>!x.gerilla&&x.kaynak!=="konsinye")],
  ].filter(g=>g[1].length);
  if(gruplar.length){
    L.push("SATIŞ");
    gruplar.forEach(([ad,arr])=>{
      L.push(sat(ad,adOf(arr)+" ad",tl(tutOf(arr))));
      const uu=urunTop(arr);
      if(uu.length===1) L.push(sat("  "+uu[0].ad,"",""));

  }
  // 2) KONSİNYE — bırakılan · iade · satışa dönen
  const birak=R.filter(x=>x.tip==="konsinye"), iade=R.filter(x=>x.tip==="iade");
  const konsSat=satis.filter(x=>x.kaynak==="konsinye");
  if(birak.length||iade.length||konsSat.length){
    L.push("","KONSİNYE");
    const kGrup=(etiket,arr,lim)=>{ if(!arr.length) return; L.push(sat(etiket,adOf(arr)+" ad",""));
      const uu=urunTop(arr);
      if(uu.length===1) L.push(sat("  "+uu[0].ad,"",""));
      else uu.slice(0,lim).forEach(o=>L.push(sat("  "+o.ad,o.adet+"x",""))); };

  if(nakit||hak||tikita){

    if(hakEski>0) L.push(sat("  eski donem payi","",tl(hakEski)));

  }
  if(hak>0){
    L.push("","HAKEDIS (satis - alis)");
    L.push(sat("Bu donem","",tl(num(v.hakYeni)||Math.max(0,hak-tabla-hakEski))));
    if(tabla>0) L.push(sat("  tabla ucreti","",tl(tabla)));

  }
  if(!L.length) L.push("Bu dönemde işlem yok.");

function CantaSheet({d,onClose,onConfirm,bekle}){
  /* 🏭 Sınırsız yetkide çanta doldurma askıda — sheet yalnız eski çantayı boşaltmak için açılır */
  const SZ=!!d.sinirsiz;
  const [mod,setMod]=useState(SZ?"bosalt":"doldur");   // doldur = atölye→çanta · bosalt = çanta→atölye (iade)
  const [lines,setLines]=useState({});
  const bosalt=mod==="bosalt";
  const liste=bosalt?d.cephane.filter(u=>num(u.canta)>0):d.cephane;
  const secili=liste.filter(u=>num(lines[u.id])>0);
  const toplam=secili.reduce((s,u)=>s+num(lines[u.id]),0);
  const [toplu,setToplu]=useState("");        // 📦 hepsine uygulanacak adet
  const [uyari,setUyari]=useState("");        // geçici uyarı — kalıcı değil
  useEffect(()=>{ if(!uyari) return; const t=setTimeout(()=>setUyari(""),4500); return ()=>clearTimeout(t); },[uyari]);
  const kisaLst=(arr)=>arr.slice(0,3).map(x=>x.ad+" "+x.n).join(" · ")+(arr.length>3?(" +"+(arr.length-3)+" ürün"):"");
  const setLn=(u,val)=>{ if(val===""){ setLines(s=>({...s,[u.id]:""})); return; }
    let n=num(val); if(n<0) n=0;
    if(bosalt){ if(n>num(u.canta)) n=num(u.canta); }
    else if(n>num(u.stokta)){ n=num(u.stokta); setUyari(u.ad+" için atölyede "+num(u.stokta)+" adet var — o kadarı eklendi."); }
    setLines(s=>({...s,[u.id]:n})); };
  // 📦 toplu doldur — her üründen istenen kadar, stok yetmiyorsa olduğu kadar
  const topluUygula=()=>{ const n=Math.max(0,Math.round(num(toplu))); if(n<=0) return;
    const yeni={}, eksik=[], yok=[];
    liste.forEach(u=>{ const tavan=bosalt?num(u.canta):num(u.stokta); const v=Math.min(n,tavan);
      if(v>0) yeni[u.id]=v;
      if(tavan<=0) yok.push(u.ad); else if(tavan<n) eksik.push({ad:u.ad,n:tavan}); });
    setLines(yeni);

    if(eksik.length) par.push(eksik.length+" üründe stok yetmedi, olduğu kadarı eklendi: "+kisaLst(eksik));
    if(yok.length) par.push(yok.length+" ürün stokta yok, eklenmedi");
    setUyari(par.join(" · "));
  };
  const tog=m=>{ setMod(m); setLines({}); setToplu(""); setUyari(""); };
  const tb=(m,ik,txt)=>h("button",{onClick:()=>tog(m),style:{flex:1,padding:"10px 8px",borderRadius:12,fontSize:13.5,fontWeight:800,

  return h(Sheet,{ik:bosalt?"📤":"🎒",hex:"#d97b12",baslik:bosalt?"Çantayı boşalt":"Çantayı doldur",

    onCta:()=>onConfirm(secili.map(u=>({id:u.id,ad:u.ad,adet:num(lines[u.id])})),mod)},

      fontSize:11.5,fontWeight:700,color:"#9a3412",marginBottom:12,lineHeight:1.45}},
      "Artık atölyeye doğrudan erişiyorsun; çantaya doldurmana gerek yok. Çantanda kalanı buradan atölyeye bırak.")
     :h("div",{style:{display:"flex",gap:8,marginBottom:12}},tb("doldur","🎒","Doldur"),tb("bosalt","📤","Boşalt")),
    liste.length?h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
      h("input",{type:"number",inputMode:"numeric",placeholder:"adet",value:toplu,onChange:e=>setToplu(e.target.value),

      h("button",{onClick:topluUygula,disabled:num(toplu)<=0,style:{flex:1,padding:"12px 10px",borderRadius:12,fontSize:13.5,fontWeight:800,
        background:num(toplu)>0?"var(--gold)":"var(--surf2)",color:num(toplu)>0?"#2a1408":"var(--mut2)",border:"1px solid "+(num(toplu)>0?"var(--gold)":"var(--line)")}},"Hepsine uygula"),
      Object.keys(lines).length?h("button",{onClick:()=>{ setLines({}); setToplu(""); setUyari(""); },
        style:{flexShrink:0,padding:"12px 13px",borderRadius:12,fontSize:12.5,fontWeight:800,background:"var(--surf2)",border:"1px solid var(--line)",color:"var(--mut)"}},"Temizle"):null):null,
    uyari?h("div",{className:"fade",style:{padding:"9px 12px",borderRadius:11,background:"#fff7ed",border:"1px solid #fdba74",
      fontSize:11.5,fontWeight:700,color:"#9a3412",marginBottom:10,lineHeight:1.45}},uyari):null,
    liste.length?liste.map((u,i)=>h("div",{key:u.id||i,style:{display:"flex",alignItems:"center",gap:10,padding:"10px 0",borderTop:i?"1px solid var(--line)":"none"}},

/* ————— YENİ KALE (müşteri) ekle — konumlu (ana uygulamadaki KonumSec sistemi) ————— */
function YeniKaleSheet({onClose,onKaydet,bekle,ilk,kayit,onArsiv,onSil,mevcut,onVarOlan}){
  const duzen=!!(kayit&&(kayit.id||kayit.key));
  const [ad,setAd]=useState(duzen?(kayit.ad||""):"");
  const [bolge,setBolge]=useState(duzen?(kayit.bolge||""):"");
  const [tel,setTel]=useState(duzen?(kayit.telefon||""):"");
  const [not,setNot]=useState(duzen?(kayit.not||""):"");
  const [lat,setLat]=useState(duzen?(kayit.lat||""):"");
  const [lng,setLng]=useState(duzen?(kayit.lng||""):"");
  const [sonuc,setSonuc]=useState([]); const [ara,setAra]=useState(false); const [bos,setBos]=useState(false);
  const [merkez,setMerkez]=useState({lat:41.0082,lng:28.9784});   // varsayılan İstanbul
  // isim boş bırakılabilir — konum varsa otomatik ad üretilir
  const adSon=()=>{ const a=ad.trim(); if(a) return a;
    const b=bolge.trim(); if(b) return b;
    return (lat&&lng)?("Konum "+Number(lat).toFixed(4)+", "+Number(lng).toFixed(4)):""; };
  const touched=useRef(false);
  const mapDiv=useRef(null), mapObj=useRef(null), mkRef=useRef(null);
  // açılışta cihaz konumunu sessizce al → aramaları yakına öncele
  useEffect(()=>{ if(!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(p=>setMerkez({lat:p.coords.latitude,lng:p.coords.longitude}),()=>{},{enableHighAccuracy:true,timeout:8000,maximumAge:300000}); },[]);
  // haritadan gelen başlangıç noktası (uzun basma) — koordinat + ad/bölge otomatik dolar
  useEffect(()=>{ if(ilk&&ilk.lat&&ilk.lng) konumdan(ilk.lat,ilk.lng,false); },[]);
  async function tersCoz(la,lo){ let nm="",bl="";
    try{ const r=await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&addressdetails=1&accept-language=tr&lat="+la+"&lon="+lo);
      const j=await r.json(); nm=j.name||(j.display_name||"").split(",")[0]||""; bl=ilceOf(j.address); }catch(e){}
    return {nm,bl}; }
  async function konumdan(la,lo,adKoru){ la=(+la).toFixed(6); lo=(+lo).toFixed(6);
    setLat(la); setLng(lo); setMerkez({lat:+la,lng:+lo});
    const r=await tersCoz(la,lo);
    if(r.nm) setAd(p=>(adKoru||p.trim())?p:r.nm);
    if(r.bl) setBolge(p=>p.trim()?p:r.bl); }
  function gps(){ if(!navigator.geolocation) return alert("Cihaz konum desteklemiyor.");
    navigator.geolocation.getCurrentPosition(p=>konumdan(p.coords.latitude,p.coords.longitude,false),
      e=>alert("Konum alınamadı: "+e.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0}); }
  // arama: Google Places (anahtar varsa) → Nominatim → Overpass
  async function aramaYap(t){ t=(t||"").trim(); if(t.length<2) return; setAra(true); setBos(false);
    try{
      const gj=await placesText(t,merkez);
      if(gj&&gj.length){ gj.sort((a,b)=>Math.hypot(+a.lat-merkez.lat,+a.lng-merkez.lng)-Math.hypot(+b.lat-merkez.lat,+b.lng-merkez.lng)); setSonuc(gj); return; }
      const d2=0.6, vb=(merkez.lng-d2)+","+(merkez.lat+d2)+","+(merkez.lng+d2)+","+(merkez.lat-d2);
      let r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=tr&accept-language=tr&viewbox="+vb+"&bounded=1&q="+encodeURIComponent(t));
      let j=await r.json();
      if(!j.length){ r=await fetch("https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&countrycodes=tr&accept-language=tr&q="+encodeURIComponent(t)); j=await r.json(); }
      if(!j.length){ const oj=await overpassAdAra(t,merkez);
        if(oj&&oj.length){ oj.sort((a,b)=>Math.hypot(+a.lat-merkez.lat,+a.lng-merkez.lng)-Math.hypot(+b.lat-merkez.lat,+b.lng-merkez.lng)); setSonuc(oj); return; } }
      setSonuc(j.map(x=>({ad:(x.display_name||"").split(",")[0],lat:x.lat,lng:x.lon,tam:x.display_name,bolge:ilceOf(x.address)})));
      if(!j.length) setBos(true);
    }catch(e){ setBos(true); } finally{ setAra(false); } }
  // yazarken otomatik ara (debounce) — ana uygulama ile aynı
  useEffect(()=>{ if(!touched.current) return; const t=ad.trim();
    if(t.length<2){ setSonuc([]); return; }
    const id=setTimeout(()=>aramaYap(t),450); return ()=>clearTimeout(id); },[ad,merkez]);
  function sec(r){ setAd(r.ad); if(r.bolge) setBolge(p=>p.trim()?p:r.bolge);
    setLat((+r.lat).toFixed(6)); setLng((+r.lng).toFixed(6)); setMerkez({lat:+r.lat,lng:+r.lng});
    setSonuc([]); touched.current=false; }
  // mini pin haritası — dokun/sürükle ile iğnele
  useEffect(()=>{ if(!window.L||!mapDiv.current||mapObj.current) return;
    const L=window.L, c=[merkez.lat,merkez.lng];
    const map=L.map(mapDiv.current,{attributionControl:false,zoomControl:false}).setView(c,12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd"}).addTo(map);
    const pin=L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,28],html:"<div style='color:#dc2626'><svg width='30' height='30' viewBox='0 0 24 24' fill='currentColor'><path d='M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5a2.5 2.5 0 110-5 2.5 2.5 0 010 5z'/></svg></div>"});
    const mk=L.marker(c,{draggable:true,icon:pin}).addTo(map);
    mkRef.current=mk; mapObj.current=map;
    map.on("click",e=>{ mk.setLatLng(e.latlng); konumdan(e.latlng.lat,e.latlng.lng,true); });
    mk.on("dragend",()=>{ const p=mk.getLatLng(); konumdan(p.lat,p.lng,true); });
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} },250);
    return ()=>{ try{ map.remove(); }catch(e){} mapObj.current=null; };
  },[]);
  useEffect(()=>{ if(!mapObj.current||!mkRef.current) return;
    if(lat&&lng){ const ll=[+lat,+lng]; mkRef.current.setLatLng(ll); mapObj.current.setView(ll,16); }
    else mapObj.current.setView([merkez.lat,merkez.lng],mapObj.current.getZoom());
  },[lat,lng,merkez]);
  // 🔁 aynı dükkân zaten var mı — yeni eklerken uyar, var olanı aç
  const benzer=duzen?[]:benzerKaleler(adSon(),lat,lng,mevcut,null);
  return h(Sheet,{ik:duzen?"✏️":"🏰",hex:benzer.length?"#d97b12":"#16a34a",baslik:duzen?("Düzenle · "+(kayit.ad||"")):"Yeni kale (müşteri)",
    alt:duzen?"bilgileri güncelle":"ilk satış/konsinyeyle kaleye dönüşür",onClose,
    cta:bekle?"⏳…":(duzen?"💾 Kaydet":(benzer.length?"⚠️ Yine de yeni kale ekle":"🏰 Ekle ve ilk akını yap")),
    disabled:!(ad.trim()||(lat&&lng))||bekle,
    onCta:()=>{ if(benzer.length&&!confirm("⚠️ Aynı dükkân zaten kayıtlı:\n"+benzer.map(x=>"• "+x.ad).join("\n")
        +"\n\nYine de İKİNCİ bir kale açılsın mı?\nAçarsan satışlar ve borç ikiye bölünür.")) return;
      onKaydet({id:duzen?(kayit.id||null):null,key:duzen?(kayit.key||null):null,ad:adSon(),bolge:bolge.trim(),telefon:tel.trim(),not:not.trim(),lat,lng}); }},
    benzer.length?h("div",{style:{padding:"12px 13px",borderRadius:14,marginBottom:14,background:"#fff7ed",border:"1px solid #fdba74"}},
      h("div",{style:{fontSize:13,fontWeight:800,color:"#9a3412",marginBottom:4}},"⚠️ Bu kale zaten kayıtlı"),
      h("div",{style:{fontSize:11.5,color:"#9a3412",lineHeight:1.5,marginBottom:9}},
        "İkinci kez eklersen satışlar iki kaleye bölünür, borcu iki yerden tahsil etmen gerekir."),
      benzer.map((x,i)=>h("button",{key:x.key||x.id||i,onClick:()=>onVarOlan&&onVarOlan(x),
        style:{display:"flex",alignItems:"center",gap:9,width:"100%",textAlign:"left",padding:"10px 11px",borderRadius:11,
          marginBottom:i<benzer.length-1?7:0,background:"var(--surf)",border:"1px solid var(--line)"}},
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontSize:13,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},x.ad),
          h("div",{style:{fontSize:11,color:"var(--mut)",marginTop:1}},
            (x.sebep==="konum"?"📍 aynı konumda":"aynı isim")+(x.bolge?(" · "+x.bolge):"")
            +(num(x.borc)>0.5?(" · borç "+tl(x.borc)):""))),
        h("span",{style:{fontSize:12,fontWeight:800,color:"var(--cyan)",flexShrink:0}},"Bunu aç ›")))):null,
    h("div",{className:"lbl",style:{marginBottom:8}},"Mekan adı (isteğe bağlı) — yaz, konumuyla bulunsun"),
    h("div",{style:{display:"flex",gap:8,marginBottom:6}},
      h("input",{value:ad,onChange:e=>{touched.current=true;setAd(e.target.value);},placeholder:"örn. Moda Kafe",
        style:{...inp,flex:1,fontSize:15,fontWeight:600}}),
      h("button",{onClick:gps,style:{flexShrink:0,padding:"0 14px",borderRadius:13,background:"var(--surf2)",border:"1px solid var(--line)",fontSize:13,fontWeight:800,color:"var(--cyan)"}},"📍 Konumum")),
    ara?h("div",{style:{fontSize:11.5,color:"var(--mut)",marginBottom:6}},"⏳ aranıyor…"):null,
    bos?h("div",{style:{fontSize:11.5,color:"var(--red)",fontWeight:700,marginBottom:6}},"Sonuç çıkmadı — haritadan iğnele ya da 📍 kullan"):null,
    sonuc.length>0?h("div",{className:"card",style:{marginBottom:10,maxHeight:200,overflowY:"auto",boxShadow:"none"}},
      sonuc.map((r,i)=>h("button",{key:i,onClick:()=>sec(r),style:{display:"block",width:"100%",textAlign:"left",padding:"10px 13px",borderTop:i?"1px solid var(--line)":"none"}},
        h("div",{style:{fontSize:13.5,fontWeight:700}},r.ad),
        h("div",{style:{fontSize:11,color:"var(--mut)",marginTop:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.tam||r.bolge||"")))):null,
    h("div",{ref:mapDiv,style:{height:160,borderRadius:14,overflow:"hidden",border:"1px solid var(--line)",marginBottom:8}}),
    (lat&&lng)

          h("button",{onClick:()=>{setLat("");setLng("");},style:{marginLeft:"auto",fontSize:11.5,fontWeight:800,color:"var(--red)"}},"kaldır"))
      : h("div",{style:{fontSize:11.5,color:"var(--mut)",marginBottom:12}},"Haritaya dokunarak ya da iğneyi sürükleyerek de seçebilirsin."),
    h("div",{className:"lbl",style:{marginBottom:8}},"Bölge"),
    h("input",{value:bolge,onChange:e=>setBolge(e.target.value),placeholder:"örn. Kadıköy",style:{...inp,fontSize:15,fontWeight:600,marginBottom:14}}),

/* ————— GEÇMİŞ TARİHLİ İŞLEM — çanta/stok oynamaz, seçilen güne yazılır ————— */
function GecmisSheet({k,d,fgList,onClose,onFire}){
  const [tarih,setTarih]=useState("");

  const konsList=(k&&k.konsKalem)||[];

  // 📈 ürün/tarih değişince o tarihteki fiyatı otomatik uygula (kullanıcı elle değiştirmediyse)
  const secDMs=tarih?new Date(tarih+"T12:00:00").getTime():Date.now();
  const etkin=(()=>{ if(!(urun&&urun.id)) return {satis:0,veris:0,eski:false};
    const e2=fiyatEtkin(urun.id,secDMs,urun.fiyat,urun.pazFiyat,fgList);
    return urun.pazOzel?{...e2,veris:num(urun.pazFiyat)}:e2; })();   // kişiye özel veriliş geçmiş genel fiyatla ezilmez
  useEffect(()=>{ if(elleFiyat||!urun||!urun.id) return; setFiyat(etkin.satis); setVeris(etkin.veris); },[urun,tarih,elleFiyat]);
  const tips=[["satis","💰 Satış"],["konsinye","🏬 Konsinye"],["konsatis","💵 Kons. satıldı"],["iade","↩ İade"],["tahsilat","🧾 Tahsilat"],["stant","🎪 Stant"]];

  const kalemSec=h("div",{style:{marginBottom:14}},h("div",{className:"lbl",style:{marginBottom:8}},"Ürün (bu kaledeki konsinyeden)"),
    konsList.length?h("div",{style:{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}},

        onClick:()=>{setKkalem(c);setAdet(c.adet);setKsfiyat(String(Math.round(num(c.birim))||""));}},
        c.ad+" ("+c.adet+")")))
