  const adetIn=h("div",null,h("div",{className:"lbl",style:{marginBottom:8}},"Adet"),
    h("input",{type:"number",inputMode:"numeric",value:adet||"",onChange:e=>setAdet(num(e.target.value)),style:inp}));
  let gecerli=!!tarih, ctaTxt="📅 Geçmişe kaydet", payload=null;
  if(tip==="satis"){ gecerli=gecerli&&!!urun.ad&&adet>0; payload={type:"satis",urun,adet,fiyat,veris}; ctaTxt="📅 "+tl(adet*fiyat)+" satış ekle (borç yazar)"; }
  else if(tip==="konsinye"){ gecerli=gecerli&&!!urun.ad&&adet>0&&num(fiyat)>0;
    payload={type:"konsinye",kmod:"birak",urun,adet,fiyat,veris};
    ctaTxt="📅 "+adet+" adet konsinye ekle · "+tl(adet*num(fiyat)); }

// dosyadan sıkıştırılmış JPEG dataURL üret (Firestore'a sığsın diye küçültülür)
function dosyaOku(file,maxW){ return new Promise((res,rej)=>{ const r=new FileReader();
  r.onload=()=>{ const img=new Image(); img.onload=()=>{ const sc=Math.min(1,maxW/Math.max(img.width,img.height));
      const c=document.createElement("canvas"); c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height); res(c.toDataURL("image/jpeg",.72)); };
    img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }
function metniSar(ctx,text,maxW){ const words=String(text).split(/\s+/); const lines=[]; let cur="";
  for(const w of words){ const t=cur?cur+" "+w:w; if(ctx.measureText(t).width>maxW&&cur){ lines.push(cur); cur=w; } else cur=t; }
  if(cur) lines.push(cur); return lines; }
// paylaşım görseli: foto + ad + fiyat + tanıtım → 1080×1350 satış kartı
function urunKartCiz(u,tanitim,fotoData){ return new Promise(res=>{
  const W=1080,H2=1350; const c=document.createElement("canvas"); c.width=W; c.height=H2; const x=c.getContext("2d");
  x.fillStyle="#f4f2ee"; x.fillRect(0,0,W,H2);
  const px=60,py=60,ps=960,r=36;
  const rr=()=>{ x.beginPath(); x.moveTo(px+r,py); x.arcTo(px+ps,py,px+ps,py+ps,r); x.arcTo(px+ps,py+ps,px,py+ps,r); x.arcTo(px,py+ps,px,py,r); x.arcTo(px,py,px+ps,py,r); x.closePath(); };
  const devam=()=>{
    x.textAlign="center";
    x.fillStyle="#1b1e25"; x.font="800 60px system-ui,sans-serif"; x.fillText(u.ad||"",W/2,1116);
    x.fillStyle="#d97b12"; x.font="800 84px system-ui,sans-serif";
    x.fillText(Math.round(num(u.fiyat)).toLocaleString("tr-TR")+" ₺",W/2,1212);
    if(tanitim){ x.fillStyle="#7c818c"; x.font="600 34px system-ui,sans-serif";
      metniSar(x,tanitim,940).slice(0,2).forEach((l,i)=>x.fillText(l,W/2,1268+i*44)); }
    x.fillStyle="#a9adb6"; x.font="700 26px system-ui,sans-serif"; x.fillText("Tikita",W/2,H2-22);
    res(c); };
  if(fotoData){ const img=new Image();
    img.onload=()=>{ x.save(); rr(); x.clip();
      const sc=Math.max(ps/img.width,ps/img.height); const dw=img.width*sc,dh=img.height*sc;
      x.drawImage(img,px+(ps-dw)/2,py+(ps-dh)/2,dw,dh); x.restore(); devam(); };

    img.src=fotoData; }
  else { x.save(); rr(); x.fillStyle="#ffffff"; x.fill(); x.restore();
    x.font="300px system-ui"; x.textAlign="center"; x.fillText("📦",W/2,py+ps/2+100); devam(); }
}); }

  // deneme işlemini izole (demo_) kaydet — gerçek defter korunur
  async function performWrite(p){
    const k=p.k, key=k?k.key:null;
    const now=p.gecTarih?new Date(p.gecTarih+"T12:00:00").toISOString():new Date().toISOString();   // 📅 geçmiş kayıt: seçilen gün
    /* 📅 geçmiş kayıt: 'tarih' seçilen gün, 'girildi' fiilen ne zaman girildiği.
       kaynak'ı "konsinye" olması gereken satırlarda yalnız girEk eklenir — orada
       kaynak raf defterini sürdüğü için ezilemez. */
    const girEk=p.gecTarih?{girildi:new Date().toISOString()}:{};
    const gecEk=p.gecTarih?{kaynak:"gecmis",...girEk}:{};
    const kul={kullaniciId:emirId,kullaniciAd:(d&&d.emir&&d.emir.ad)||"Emir"};
    const yerB=k?{yer:k.ad,bolge:k.bolge||"",musteriId:k.musteriId||""}:{};
    if(p.type==="tahsilat"){
      const acik=emirHar.filter(x=>x.tip==="satis"&&!x.gerilla&&kkOf(x)===key)
        .map(x=>{const bek=num(x.adet)*num(x.satisFiyat);const onceki=x.tahsil==null?bek:num(x.tahsil);return {x,bek,onceki,borc:Math.max(0,bek-onceki)};})
        .filter(o=>o.borc>0).sort((a,b)=>new Date(a.x.tarih)-new Date(b.x.tarih));
      /* 🧾 SIRA ÖNEMLİ: önce dağıtım planı çıkarılır (hiçbir şey yazılmaz), sonra
         TAHSİLAT KAYDI yazılır, en son satış satırlarına işlenir.
         Eskiden tersiydi: satırların tahsil'i artıyor, tahsilat kaydı yazılamazsa
         (bağlantı koparsa) borç kapanmış görünüyor ama para hiçbir raporda çıkmıyordu.
         Bu sırayla yarıda kalırsa para görünür, borç açık kalır — yani düzeltilebilir. */
      let kalan=Math.min(num(p.tut),k?k.borc:num(p.tut)),uP=0,pP=0,uyg=0; const plan=[];   // kalenin güncel borcunu aşma
      for(const o of acik){ if(kalan<=0)break; const dd=Math.min(o.borc,kalan);
        const b=payBol(o.x,dd,o.onceki); uP+=b.u;pP+=b.p; kalan-=dd; uyg+=dd; plan.push({id:o.x.id,dd}); }
      if(uyg<=0) return {iptal:"Bu kalede açık borç yok."};
      await save("pazarlama_hareket",{...kul,tip:"tahsilat",tutar:uyg,ureticiPay:uP,pazPay:pP,...yerB,...gecEk,tarih:now});
      for(const it of plan) await save("pazarlama_hareket",{id:it.id,tahsil:increment(it.dd)});   // atomik — satışın borcu gerçekten kapanır
    } else if(p.type==="satis"){
      const u=p.urun||{}; const gerilla=!k; const satisId=uid();
      if(sembolik(p.fiyat)){
        // 🎁 1 ₺ ve altı: satış değil hediye — kaleye borç yazılmaz, ciroya girmez, hakediş doğurmaz
        await save("pazarlama_hareket",{id:satisId,...kul,tip:"hediye",kaynak:"hediye",...(gerilla?{gerilla:true}:gecEk),
          urunId:u.id||"",urunAd:u.ad||"?",adet:num(p.adet),
          alisFiyat:(num(p.veris)>0?num(p.veris):num(u.pazFiyat)),maliyetBirim:num(u.maliyet),satisFiyat:0,tahsil:0,
          yer:gerilla?"⚡ Seyyar":k.ad,bolge:k?(k.bolge||""):"",musteriId:k?(k.musteriId||""):"",tarih:now});
        if(u.id&&!p.gecTarih){ await cantaDelta(u.id,u.ad,-num(p.adet)); await save("stok_urun",{id:u.id,hediye:increment(num(p.adet))}); }

      /* 🎁 Kampanya ödülü stoğu önce tüketilir: o adetler bedelsiz geldiği için

      const odulEl=(!p.gecTarih&&u.id)?Math.min(num(p.adet),num(u.odul)):0;
      const normalAd=num(p.adet)-odulEl;
      const verisN=(num(p.veris)>0?num(p.veris):num(u.pazFiyat));

        yer:gerilla?"⚡ Seyyar":k.ad,bolge:k?(k.bolge||""):"",musteriId:k?(k.musteriId||""):"",tarih:now};
      if(normalAd>0)
        await save("pazarlama_hareket",{id:satisId,...ortak,adet:normalAd,alisFiyat:verisN,
          tahsil:gerilla?normalAd*num(p.fiyat):0});
      if(odulEl>0)
        await save("pazarlama_hareket",{id:(normalAd>0?uid():satisId),...ortak,adet:odulEl,

      if(u.id&&!p.gecTarih){
        if(odulEl>0) await save("stok_urun",{id:u.id,odulStokK:{[emirId]:increment(-odulEl)}});
        if(normalAd>0) await cantaDelta(u.id,u.ad,-normalAd); }
      // 🤝 "bu fiyat bu müşteride kalsın" — satış+veriliş ÇİFTİ müşteri kartına yazılır
      if(p.anlasmaKaydet&&k&&k.musteriId&&u.id&&num(p.anlasmaKaydet.satis)>0)

      // satışta anında alınan: satışın tahsil'i artar (borç kapanır) + tahsilat kaydı (önce üretici) — ana uygulama ile aynı
      if(!gerilla&&num(p.alinan)>0){ const alin=Math.min(num(p.alinan),num(p.adet)*num(p.fiyat));

        const parca=p.items.reduce((s,x)=>s+x.adet,0);
        const oran=maliyet>0?p.para/maliyet:0;
        for(const {urun,adet} of p.items){
          const birim=maliyet>0?Math.round(num(urun.pazFiyat)*oran*100)/100:Math.round((p.para/parca)*100)/100;
          await save("pazarlama_hareket",{...kul,tip:"satis",gerilla:true,toptan:true,kaynak:"gerilla",urunId:urun.id||"",urunAd:urun.ad,
            adet,alisFiyat:num(urun.pazFiyat),maliyetBirim:num(urun.maliyet),satisFiyat:birim,tahsil:adet*birim,yer,bolge:p.bolge||"",lat:p.lat||"",lng:p.lng||"",musteriId:"",tarih:now});
          if(urun.id) await cantaDelta(urun.id,urun.ad,-adet);

            adet,alisFiyat:num(urun.pazFiyat),maliyetBirim:num(urun.maliyet),satisFiyat:hd?0:fiyat,tahsil:hd?0:adet*fiyat,yer,bolge:p.bolge||"",lat:p.lat||"",lng:p.lng||"",musteriId:"",tarih:now});

         GÜNCEL fiyatı yazılır ve geçmiş tarihli kayıt yanlış fiyatla donar */
      if(p.kmod==="birak"){ const items=p.items||[{urun:p.urun||{},adet:p.adet,fiyat:p.fiyat,veris:p.veris}]; const kmod2=p.mod||"konsinye";

            const anl2=anlasmaOf(k,u.id);

    onDuzen:k=>setYeniKale({kayit:{id:k.musteriId||"",key:k.key,ad:k.ad,bolge:k.bolge||"",telefon:k.telefon||"",not:k.not||"",lat:k.lat||"",lng:k.lng||""}}),
    kesifRedSet:redSet,kesifEkle:async r=>{ try{ await save("musteri",{ad:r.ad,bolge:r.bolge||"",lat:String(r.lat),lng:String(r.lng),kesif:true,kullaniciId:emirId,tarih:new Date().toISOString()}); say("🧭 Aday eklendi · "+r.ad); }catch(e){ say("⚠ Eklenemedi"); } },
    kesifReddet:async r=>{ try{ await save("kesif_red",{id:adNorm(r.ad),ad:r.ad}); }catch(e){} }});
  else if(view==="harita") ekran=h(Harita,{d,openKale,say,adaylar:adayGoster,openAday:a=>setAdaySec(a),
    digerKaleler,hedefDuraklar,
    onYeniKale:()=>setYeniKale(true),onYeniKaleAt:(la,lo)=>setYeniKale({lat:la,lng:lo})});
  else if(view==="cephane") ekran=h(Cephane,{d,say,cantaAc:()=>setCantaSheet(true),openUrun:u=>setUrunSec(u),onStokDuzelt:stokDuzelt,bekle:sbekle});
  else ekran=h(Rapor,{d,say,raporVer,hareketler:emirHar,ovList:ov,geriAl:geriAlKayit,odemeEmirleri,onOdemeAl:tablaOdemeAl,
    hakDonemler:hakedisKayit,onHakGonder:hakedisGonder,benId:emirId,onNakitTeslim:nakitTeslimEt});

  return h("div",null,
    AS_ID?h("div",{style:{background:"#1e3a5f",color:"#fff",fontSize:12,fontWeight:800,padding:"calc(env(safe-area-inset-top,0px) + 7px) 14px 7px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}},
      h("span",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},"👁 "+((d&&d.emir&&d.emir.ad)||"kullanıcı")+" ekranı · yönetici görünümü"),
      h("button",{onClick:()=>location.href="admin.html",style:{flexShrink:0,padding:"5px 11px",borderRadius:8,background:"rgba(255,255,255,.22)",color:"#fff",fontSize:11.5,fontWeight:800}},"← Komuta")):null,
    veriHata?h("div",{style:{margin:"8px 12px 0",padding:"9px 13px",borderRadius:12,background:"#fff7ed",border:"1px solid #fdba74",fontSize:12,fontWeight:700,color:"#9a3412"}},
      "⚠️ Sunucu veri kotası dolu — kayıtlı önbellek gösteriliyor, yeni veriler gecikebilir. Yarın otomatik düzelir."):null,
    ekran,
    h(Nav,{aktif:kaleGuncel?"kaleler":view,go}),
    h(Toast,{msg:toastMsg}),
    (!AS_ID&&!kaleGuncel&&view!=="harita")?h("button",{onClick:sifremiDegistir,
      style:{display:"block",margin:"8px auto 0",padding:"7px 15px",borderRadius:11,background:"var(--surf)",border:"1px solid var(--line)",color:"var(--mut)",fontSize:12,fontWeight:800}},"🔑 Şifremi değiştir"):null,
    (!kaleGuncel&&view!=="harita")?h("div",{style:{textAlign:"center",padding:"12px 0 6px"}},
      AS_ID
        ? h("button",{onClick:()=>location.href="admin.html",style:{color:"var(--mut2)",fontSize:12,fontWeight:800}},"👁 "+((d&&d.emir&&d.emir.ad)||"")+" · ← Komuta'ya dön")
        : h(React.Fragment,null,
            h("button",{onClick:()=>{ if(confirm("Çıkış yapmak istiyor musunuz?")) location.href="index.html?giris=1"; },
              style:{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 16px",borderRadius:11,border:"1px solid var(--red)",background:"var(--surf)",color:"var(--red)",fontSize:12.5,fontWeight:800}},"⏻ Çıkış yap"),
            h("div",{style:{marginTop:8,color:"var(--mut2)",fontSize:10.5}},"⚔️ Tikita · "+((d&&d.emir&&d.emir.ad)||"Pazarlamacı")+" · "+SURUM))):null,
    sheet&&(sheet.type==="gerilla"
      ? h(GerillaSheet,{d,onClose:()=>setSheet(null),onFire:fire})
      : sheet.type==="gecmis"
      ? h(GecmisSheet,{k:sheet.k,d,fgList,onClose:()=>setSheet(null),onFire:fire})
      : sheet.type==="talep"
      ? h(TalepSheet,{talepler:emirTalep,onGonder:talepGonder,onCevapla:talepCevapla,onKonum:talepKonum,onSil:talepSil,onClose:()=>setSheet(null)})
      : h(ActionSheet,{type:sheet.type,k:(sheet.k&&sheet.k.key?(d.kaleler.find(x=>x.key===sheet.k.key)||sheet.k):sheet.k),d,onClose:()=>setSheet(null),onFire:fire})),
    (!kaleGuncel&&view==="us")?h("button",{onClick:()=>setSheet({type:"talep"}),
      style:{position:"fixed",right:16,bottom:"calc(env(safe-area-inset-bottom,0px) + 150px)",zIndex:36,width:54,height:54,borderRadius:"50%",background:"linear-gradient(135deg,#1e3a5f,#0e8fce)",color:"#fff",fontSize:24,boxShadow:"0 8px 22px rgba(14,143,206,.42)",display:"flex",alignItems:"center",justifyContent:"center"}},"💬",
      talepYeniCevap>0?h("span",{style:{position:"absolute",top:-2,right:-2,minWidth:20,height:20,borderRadius:99,background:"#e0483c",color:"#fff",fontSize:11,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 5px",border:"2px solid var(--bg)"}},talepYeniCevap):null):null,
    yeniKale&&h(YeniKaleSheet,{bekle:ykBekle,
      ilk:(typeof yeniKale==="object"&&yeniKale.lat&&!yeniKale.kayit)?yeniKale:null,
      kayit:(typeof yeniKale==="object"&&yeniKale.kayit)?yeniKale.kayit:null,
      mevcut:[...(d?d.kaleler:[]),...adayGoster],
      onVarOlan:x=>{ setYeniKale(false); if(x&&x.key){ const k2=(d.kaleler||[]).find(y=>y.key===x.key); if(k2){ setKale(k2); return; } } setAdaySec(x); },
      onArsiv:kaleArsivle,onSil:kaleSil,onClose:()=>setYeniKale(false),onKaydet:yeniKaleKaydet}),
    /* 🏰 ferman — sınırsız yetki kazanmış ve henüz onaylamamışsa her açılışta çıkar.
       Görüntüleme (view-as) sırasında çıkmaz; onayı pazarlamacının kendisi verir. */
    rotaGorev&&h(GorevRotaSheet,{g:rotaGorev,say,onClose:()=>setRotaGorev(null)}),
    fermanGerek&&h(FermanSheet,{d,bekle:sbekle,onOk:fermanOnayla}),
    /* 🎯 yetki fermanı beklerken görev fermanı sıraya girer — üst üste binmez */
    (!fermanGerek&&okunmamisGorev)&&h(GorevFerman,{g:okunmamisGorev,d,bekle:sbekle,
      onOk:gorevOkundu,onHarita:()=>{ const g=okunmamisGorev; gorevOkundu(); setRotaGorev(g); }}),
    (!fermanGerek&&!okunmamisGorev&&okunmamisKampanya)&&h(KampanyaFerman,{k:okunmamisKampanya,d,
      bekle:sbekle,onOk:kampanyaOkundu}),
    urunSec&&h(UrunSheet,{u:(d.cephane.find(c=>c.id===urunSec.id)||urunSec),sinirsiz:!!(d&&d.sinirsiz),
      recs:emirHar.filter(x=>["satis","konsinye","iade"].includes(x.tip)&&(x.urunId===urunSec.id||(x.urunAd&&x.urunAd===urunSec.ad))),
      kaleler:d.kaleler,say,
      kisiler:(()=>{ const tm={}; (tumMus||[]).forEach(m=>{const t=(m.telefon||"").trim(); if(t) tm[m.id]=t;});
        const out=[],seen=new Set();
        d.kaleler.forEach(k=>{ const t=k.musteriId&&tm[k.musteriId]; if(t&&!seen.has(t)){ seen.add(t); out.push({ad:k.ad,tel:t}); } });
        (tumMus||[]).filter(m=>(m.kullaniciId||"")===emirId).forEach(m=>{ const t=(m.telefon||"").trim(); if(t&&!seen.has(t)){ seen.add(t); out.push({ad:m.ad||t,tel:t}); } });
        return out; })(),
      fotolar:(urunFoto||[]).filter(f=>f.urunId===urunSec.id).sort((a,b)=>new Date(b.tarih)-new Date(a.tarih)),
      onFiyat:v=>urunEkKaydet(urunSec.id,{satisFiyat:v},"💰 Satış fiyatı güncellendi: "+tl(v)),
      onTanitim:t=>urunEkKaydet(urunSec.id,{tanitim:t},"📝 Tanıtım kaydedildi"),
      onFotoEkle:f=>fotoEkle(urunSec.id,f),
      onFotoSil:fotoSil,
      onClose:()=>setUrunSec(null)}),
    adaySec&&h(AdaySheet,{a:adaySec,onClose:()=>setAdaySec(null),
      onAkin:()=>{const a=adaySec;setAdaySec(null);openSheet("satis",synthK(a));},
      onKons:()=>{const a=adaySec;setAdaySec(null);openSheet("konsinye",synthK(a));},
      onGizle:async()=>{const a=adaySec;if(!confirm("🙈 "+a.ad+" aday listesinden gizlensin mi?"))return;
        try{await save("kesif_red",{id:a.id,ad:a.ad});}catch(e){} setAdaySec(null); say("🙈 Gizlendi · "+a.ad);}}),
    seferSheet&&h(SeferRaporSheet,{mod:seferSheet.mod,veri:seferSheet.veri,recs:seferSheet.recs,bekle:sbekle,onClose:()=>setSeferSheet(null),onOnay:seferOnay}),
    cantaSheet&&h(CantaSheet,{d,bekle:sbekle,onClose:()=>setCantaSheet(false),onConfirm:cantaEkle}),
    brifAcik&&h(Briefing,{d,hedefler:emirHedef,sorular,say,onClose:()=>setBrifAcik(false)}),
    bilgi&&h(Sheet,{ik:bilgi.ik,hex:bilgi.hex||"#d97b12",baslik:bilgi.baslik,alt:bilgi.alt,onClose:()=>setBilgi(null),cta:"Kapat",onCta:()=>setBilgi(null)},
      (bilgi.govde||[]).map((g,i)=>typeof g==="string"?h("div",{key:i,style:{fontSize:14.5,lineHeight:1.5,color:"var(--txt)",padding:"4px 0",borderTop:i?"1px solid var(--line)":"none"}},g):g)),
    reward&&h(Reward,{xp:reward.xp,mesaj:reward.mesaj,onDone:()=>{const m=reward.mesaj;setReward(null);say("✅ "+m);}}));
}
/* 🛡 HATA KALKANI — bir ekran çizilirken hata verirse React bütün ağacı söküyor
   ve geriye bomboş sayfa kalıyordu. Kalkan hatayı yakalar, sebebini ve sürümü
   yazar; "Ekranı sıfırla" son açık sekmeyi unutup baştan açar. */
class HataKalkani extends React.Component{
  constructor(p){ super(p); this.state={hata:null}; }
  static getDerivedStateFromError(e){ return {hata:e}; }
  componentDidCatch(e,bilgi){ console.error("EKRAN HATASI",e,bilgi); }
  render(){
    if(!this.state.hata) return this.props.children;
    const e=this.state.hata;
    const yz={fontFamily:"-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"};
    return h("div",{style:{...yz,padding:"26px 20px",maxWidth:520,margin:"0 auto",color:"var(--txt,#1b1e25)"}},
      h("div",{style:{fontSize:40,marginBottom:10}},"🛠"),
      h("div",{style:{fontSize:19,fontWeight:800,marginBottom:8}},"Bu ekran çizilemedi"),
      h("div",{style:{fontSize:13.5,lineHeight:1.6,color:"var(--mut,#5b616e)",marginBottom:16}},
        "Uygulama açık, sorun tek bir ekranda. Aşağıdaki satırı komutaya ilet — nerede takıldığı oradan anlaşılır."),
      h("pre",{style:{fontSize:11,background:"var(--surf2,#f4f5f7)",border:"1px solid var(--line,#e3e5e9)",
        borderRadius:10,padding:11,whiteSpace:"pre-wrap",wordBreak:"break-word",color:"#9a3412",marginBottom:16}},
        String((e&&e.message)||e)+"\n"+String((e&&e.stack)||"").split("\n").slice(1,4).join("\n")),
      h("button",{onClick:()=>{ try{ sessionStorage.clear(); }catch(_){} location.reload(); },
        style:{width:"100%",padding:14,border:0,borderRadius:14,background:"#1b1e25",color:"#fff",fontSize:15,fontWeight:800}},
        "Ekranı sıfırla ve yenile"),
      h("div",{style:{fontSize:11,color:"var(--mut2,#9aa0ac)",textAlign:"center",marginTop:12,fontWeight:700}},"sürüm "+(typeof SURUM!=="undefined"?SURUM:"—")));
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(h(HataKalkani,null,h(App)));
</script>
