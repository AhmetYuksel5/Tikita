const tl=n=>{const v=r2(n); return (v<0?"−":"")+Math.abs(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" ₺";};

function useColl(name){ const [rows,setRows]=useState(null);

/* ═════════ 2 · DE-FACTO VARSAYIMLAR ═════════

const VAR_ALAN=[

/* ═════════ 3 · ÜRÜN BİRİM MALİYETİ ═════════ */
function plParcalari(p,parcalar){ parcalar=parcalar||[];
  if(p.parcaAdlar&&p.parcaAdlar.length){ const s=p.parcaAdlar.filter(x=>parcalar.includes(x)); if(s.length) return s; }
  if(p.parcaAd&&parcalar.includes(p.parcaAd)) return [p.parcaAd];
  return parcalar.slice(); }
function gerekenP(u,p){ return Math.max(1,Math.round(num(((u&&u.parcaAdet)||{})[p]||1))); }
function plParcaKatki(p,u){ const parcalar=(u&&u.parcalar)||[]; const cov=plParcalari(p,parcalar);
  const adt=Math.max(0,num(p.adet||1)); const ps=p.parcaSayi||null; const m={};
  cov.forEach(pt=>{ const v=ps?num(ps[pt]):0; m[pt]=(ps&&v>0)?v:adt*gerekenP(u,pt); }); return m; }

function maliyetTablo(urunler,plan,filamentler,sarflar){
  const filById={}; (filamentler||[]).forEach(f=>filById[f.id]=f);
  const sarfById={}; (sarflar||[]).forEach(s=>sarfById[s.id]=s);
  const baskiByU={}; (plan||[]).forEach(p=>{ if(!p.urunId) return; (baskiByU[p.urunId]=baskiByU[p.urunId]||[]).push(p); });
  const pcost=p=>{ const fl=filById[p.filamentId]; const kg=fl?num(fl.kgFiyat):0;
    return {mak:num(p.sureDk)/60*SAAT_MALIYET, fila:num(p.gram)/1000*kg, fl:!!fl}; };
  const M={};
  (urunler||[]).forEach(u=>{
    const parts=(u.parcalar||[]).filter(Boolean);
    const prints=baskiByU[u.id]||[];
    let baski=0, kaynak="yok";
    if(parts.length){
      let top=0, eksik=false;
      parts.forEach(part=>{ let w=0,wc=0;
        prints.forEach(p=>{ const cov=plParcalari(p,parts); if(cov.indexOf(part)<0) return;
          const c=pcost(p); const tut=c.mak+c.fila; if(tut<=0) return;
          const kk=plParcaKatki(p,u); const totP=Object.keys(kk).reduce((s,k)=>s+num(kk[k]),0);
          const my=num(kk[part]); if(totP<=0||my<=0) return;
          w+=my; wc+=(tut/totP)*my; });
        if(w<=0){ eksik=true; return; }
        top+=(wc/w)*gerekenP(u,part); });
      baski=eksik?0:top; kaynak=eksik?"eksik":"parça";
    } else {
      let ta=0,tt=0; prints.forEach(p=>{ const c=pcost(p); const tut=c.mak+c.fila; const a=num(p.adet);
        if(tut<=0||a<=0) return; ta+=a; tt+=tut; });
      baski=ta>0?tt/ta:0; kaynak=ta>0?"baskı":"yok";
    }
    if(num(u.maliyet)>0){ baski=num(u.maliyet); kaynak="elle"; }
    const sarf=((u.sarfList||[]).reduce((s,x)=>{ const sf=sarfById[x.sarfId]; return sf? s+Math.max(0,num(x.adet))*num(sf.birimFiyat) : s; },0));
    const iscilik=num(u.iscilik);
    const bk=baski>0?baski:( num(u.maliyetGuncel)>0 ? Math.max(0,num(u.maliyetGuncel)-sarf) : 0 );
    M[u.id]={id:u.id,ad:u.ad||"?",baski:bk,sarf,iscilik,birim:bk+sarf,tam:bk+sarf+iscilik,kaynak:bk>0?kaynak:"yok",
      pazFiyat:num(u.pazFiyat),satisFiyat:num(u.satisFiyat),u};
  });
  return M;
}

/* ═════════ 4 · YEVMİYE ÜRETİCİSİ ═════════
   Her operasyonel olay → çift taraflı fiş. Hiçbir kayıt veritabanına yazılmaz. */
function defterUret(D,V){
  const F=[]; const uyari=[];
  const M=D.maliyet;
  const kdvO=num(V.kdvOran)/100;
  const brutView=V.hasilatGorusu!=="net";
  // KDV dahil fiyattan net ve KDV ayrıştırma
  const ayir=brut=>{ const b=num(brut); if(!V.fiyatlarKdvDahil) return {net:b,kdv:b*kdvO};
    const net=b/(1+kdvO); return {net,kdv:b-net}; };
  const ek=(t,tur,ac,sat,ref)=>{ const s=(sat||[]).filter(x=>Math.abs(num(x.b))>0.004||Math.abs(num(x.a))>0.004)
      .map(x=>({h:x.h,b:r2(x.b),a:r2(x.a)}));
    if(!s.length) return;
    const tb=s.reduce((z,x)=>z+x.b,0), ta=s.reduce((z,x)=>z+x.a,0);
    if(Math.abs(tb-ta)>0.02){ // dengeleyici — asla dengesiz fiş çıkmasın
      s.push({h:"629",b:tb<ta?r2(ta-tb):0,a:tb>ta?r2(tb-ta):0}); }
    F.push({t:ISO(t),tur,ac,s,ref}); };

  const bm=u=>{ const m=M[u]; return m?m.birim:0; };
  const T0=ISO(V.acilisTarih+"T00:00:00");
  const simdi=Date.now();

  /* ——— 4.1 açılış fişi ——— */
  const filAlim=(D.giderler||[]).filter(g=>g.tur==="Filament alımı");
  const alinanKg=filAlim.reduce((s,g)=>s+num(g.kg),0);
  const dusenKg=(D.filamentler||[]).reduce((s,f)=>s+num(f.dusenKg),0);
  const kgFiyatOrt=(()=>{ const f=(D.filamentler||[]).filter(x=>num(x.kgFiyat)>0);
    return f.length? f.reduce((s,x)=>s+num(x.kgFiyat),0)/f.length : 600; })();
  const acKg=(V.acilisFilamentKg==null||V.acilisFilamentKg==="")
    ? Math.max(0,r2(dusenKg-alinanKg+(D.filamentler||[]).reduce((s,f)=>s+Math.max(0,num(f.stokKg)),0)))
    : num(V.acilisFilamentKg);
  const acSarf=(D.sarflar||[]).reduce((s,x)=>s+num(x.stokta)*num(x.birimFiyat),0);
  const mkSay=Math.max(1,(D.makineler||[]).length);
  const mkDeger=mkSay*num(V.makineBirimDeger);
  {
    const A=[ {h:"100",b:num(V.acilisKasa)}, {h:"102",b:num(V.acilisBanka)},
      {h:"150",b:acKg*kgFiyatOrt}, {h:"157",b:acSarf},
      {h:"253",b:mkDeger}, {h:"257",a:num(V.acilisBirikmisAmort)},
      {h:"300",a:num(V.acilisKrediKV)}, {h:"400",a:num(V.acilisKrediUV)} ];
    const tb=A.reduce((s,x)=>s+num(x.b),0), ta=A.reduce((s,x)=>s+num(x.a),0);
    A.push({h:"500",a:tb-ta});
    ek(T0,"acilis","Açılış bilançosu (varsayım)",A,"acilis");
  }

  /* ——— 4.2 üretim: bitmiş baskılar ——— */
  const filById={}; (D.filamentler||[]).forEach(f=>filById[f.id]=f);
  // 🏭 parçalı ürünün deposu 151 Yarı Mamuller, tekli ürünün deposu 152.1 Mamuller
  const parcaliMi=uid2=>{ const u=D.urunById[uid2]; return !!(u&&(u.parcalar||[]).filter(Boolean).length); };
  const depoH=uid2=>parcaliMi(uid2)?"151":"152.1";
  let yuklenenOH=0;
  (D.plan||[]).forEach(p=>{
    if(!p.basladi) return;
    const bas=ISO(p.gercekBaslangic||p.baslangic); if(!bas) return;
    const bit=bas+num(p.sureDk)*60000; if(bit>simdi) return;
    const fl=filById[p.filamentId];
    // baskı bitince gerçekte düşen gram (K1 otomatik düşümü) varsa onu esas al
    const gram=(p.filDus&&num(p.filDus.gram)>0)?num(p.filDus.gram):num(p.gram);
    const fila=gram/1000*(fl?num(fl.kgFiyat):kgFiyatOrt);
    const oh=num(p.sureDk)/60*SAAT_MALIYET;
    if(fila+oh<=0) return;
    const u=D.urunById[p.urunId];
    const parcali=parcaliMi(p.urunId);
    // 🧵 sarf malzemesi de üretimde mamule yüklenir — yoksa 157 şişer, 152 negatife düşer
    const mm=M[p.urunId]||{};
    let uretilenSet=num(p.adet);
    if(parcali&&u){ const parts=(u.parcalar||[]).filter(Boolean); const kk=plParcaKatki(p,u);
      uretilenSet=parts.length?parts.reduce((s2,pt)=>s2+num(kk[pt])/gerekenP(u,pt),0)/parts.length:0; }
    const sarfTut=Math.max(0,num(mm.sarf))*Math.max(0,uretilenSet);
    yuklenenOH+=oh;
    ek(bit,"uretim",(u?u.ad:"Ürün")+" · baskı"+(fl?"":" (filament seçilmemiş)"),
      [{h:parcali?"151":"152.1",b:fila+oh+sarfTut},{h:"150",a:fila},{h:"157",a:sarfTut},{h:"730",a:oh}],"plan:"+p.id);
  });

  /* ——— 4.3 fiili genel üretim gideri: amortisman ——— */
  const aylikAmort=num(V.makineOmurYil)>0 ? mkDeger/(num(V.makineOmurYil)*12) : 0;
  {
    let y=new Date(T0).getFullYear(), m=new Date(T0).getMonth();
    let toplamAmort=0;
    for(let i=0;i<120;i++){
      const son=new Date(y,m+1,0,23,59,59).getTime();
      if(son>simdi) break;
      ek(son,"amortisman","Amortisman · "+ayEt(son),[{h:"730",b:aylikAmort},{h:"257",a:aylikAmort}],"amort:"+ayEt(son));
      toplamAmort+=aylikAmort; m++; if(m>11){m=0;y++;}
    }
  }

  /* ——— 4.4 tabla ücreti · montaj hakedişi (üretim gideri tahakkuku) ——— */
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="tabla") return;
    ek(x.tarih,"tabla","Tabla ücreti · "+(x.kullaniciAd||""),
      [{h:"730",b:num(x.tutar)},{h:"335",a:num(x.tutar)}],"har:"+x.id); });

  (D.montajGorev||[]).forEach(g=>{
    const alinan=num(g.alinanAdet), teslim=num(g.teslimAdet), kusur=num(g.kusurAdet);
    const bir=num(g.birimUcret); const mal=bm(g.urunId);
    if(alinan>0&&g.alisTarih) ek(g.alisTarih,"montaj","Montaja çıkış · "+(g.urunAd||""),
      [{h:"152.4",b:alinan*mal},{h:depoH(g.urunId),a:alinan*mal}],"mg:"+g.id+":c");
    if(teslim>0||kusur>0){
      const t=g.teslimTarih||g.tarih;
      ek(t,"montaj","Montajdan giriş · "+(g.urunAd||""),
        [{h:"152.1",b:teslim*mal},{h:"689",b:kusur*mal},{h:"152.4",a:(teslim+kusur)*mal}],"mg:"+g.id+":g");
      if(teslim>0&&bir>0) ek(t,"montaj","Montaj hakedişi · "+(g.kullaniciAd||""),
        [{h:"730",b:teslim*bir},{h:"335",a:teslim*bir}],"mg:"+g.id+":h");
    }
  });

  /* ——— 4.5 stok hareketleri: depo → çanta → konsinye ——— */
  (D.hareketler||[]).forEach(x=>{
    const mal=bm(x.urunId), a=num(x.adet);
    if(x.tip==="al"&&a>0&&mal>0)
      ek(x.tarih,"stok","Çantaya çıkış · "+(x.urunAd||""),[{h:"152.2",b:a*mal},{h:depoH(x.urunId),a:a*mal}],"har:"+x.id);
    else if(x.tip==="konsinye"&&a>0&&mal>0)
      ek(x.tarih,"konsinye","Konsinye bırakma · "+(x.urunAd||"")+" @ "+(x.yer||""),
        [{h:"152.3",b:a*mal},{h:"152.2",a:a*mal}],"har:"+x.id);
    else if(x.tip==="iade"&&a>0&&mal>0)
      ek(x.tarih,"konsinye","Konsinye iade · "+(x.urunAd||"")+" @ "+(x.yer||""),
        [{h:"152.2",b:a*mal},{h:"152.3",a:a*mal}],"har:"+x.id);
  });

  /* ——— 4.6 satış ——— */
  (D.hareketler||[]).forEach(x=>{
    if(x.tip!=="satis") return;
    const a=num(x.adet); if(a<=0) return;
    const mus=num(x.satisFiyat)*a;                       // uç müşteri bedeli
    const veris=(num(x.alisFiyat)>0?num(x.alisFiyat):(M[x.urunId]?M[x.urunId].pazFiyat:0))*a;  // pazarlamacıya veriliş
    const mal=(num(x.maliyetBirim)>0?num(x.maliyetBirim):bm(x.urunId))*a;
    const konsMu=x.kaynak==="konsinye";
    const kaynakH=konsMu?"152.3":"152.2";
    const hasilatBrut=brutView?mus:Math.min(veris,mus>0?mus:veris);
    const {net,kdv}=ayir(hasilatBrut);
    const prim=brutView?Math.max(0,mus-veris):0;         // pazarlamacı payı → pazarlama gideri
    // ⚡ gerilla (seyyar) satış PEŞİNDİR: ayrı tahsilat kaydı yazılmaz, para anında alınır.
    // Bunu 120'ye borç yazarsak alacak sonsuza dek açık kalır.
    const pesin=!!(x.gerilla||x.kaynak==="gerilla");
    if(pesin){
      // kesme sonrası: pazarlamacı nakdin TAMAMINI teslim eder, hakedişi haftalık ayrı ödenir
      const yeni=ISO(x.tarih)>=HAKEDIS_BAS_MS;
      // kesme sonrası: para PAZARLAMACININ elinde (108), teslim edilince 100'e geçer
      ek(x.tarih,"satis","Gerilla satış · "+(x.urunAd||"")+" ×"+ad(a)+" @ "+(x.yer||"saha"),
        yeni?[{h:"108",b:hasilatBrut},{h:"631",b:prim},{h:"600",a:net},{h:"391",a:kdv},{h:"335",a:prim}]
            :[{h:"100",b:hasilatBrut-prim},{h:"631",b:prim},{h:"600",a:net},{h:"391",a:kdv}],"har:"+x.id);
    } else {
      ek(x.tarih,"satis","Satış · "+(x.urunAd||"")+" ×"+ad(a)+" @ "+(x.yer||"saha"),
        [{h:"120",b:hasilatBrut},{h:"600",a:net},{h:"391",a:kdv}],"har:"+x.id);
      if(prim>0.004) ek(x.tarih,"prim","Pazarlamacı payı tahakkuku · "+(x.kullaniciAd||""),
        [{h:"631",b:prim},{h:"335",a:prim}],"har:"+x.id+":p");
    }
    if(mal>0) ek(x.tarih,"smm","SMM · "+(x.urunAd||""),[{h:"620",b:mal},{h:kaynakH,a:mal}],"har:"+x.id+":m");
  });

  /* ——— 4.7 hediye ——— */
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="hediye") return;
    const a=num(x.adet), mal=bm(x.urunId)*a; if(mal<=0) return;
    ek(x.tarih,"hediye","Numune/hediye · "+(x.urunAd||""),[{h:"631.9",b:mal},{h:"152.2",a:mal}],"har:"+x.id); });

  /* ——— 4.8 tahsilat ——— */
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="tahsilat") return;
    const tut=num(x.tutar); if(tut<=0) return;
    if(x.avans){ ek(x.tarih,"tahsilat","Sayımsız avans · "+(x.yer||""),
        [{h:"100",b:tut},{h:"340",a:tut}],"har:"+x.id); return; }
    const uP=num(x.ureticiPay), pP=num(x.pazPay);
    if(brutView){
      // kesme sonrası: tahsilatın tamamı Tikita'ya gelir, pazarlamacı payı mahsup edilmez
      if(ISO(x.tarih)>=HAKEDIS_BAS_MS){
        ek(x.tarih,"tahsilat","Tahsilat · "+(x.yer||"")+" · "+(x.kullaniciAd||""),
          [{h:"108",b:tut},{h:"120",a:tut}],"har:"+x.id);
      } else {
        const bilinen=uP+pP; const artik=Math.max(0,tut-bilinen);
        ek(x.tarih,"tahsilat","Tahsilat · "+(x.yer||"")+" · "+(x.kullaniciAd||""),
          [{h:"100",b:uP+artik},{h:"335",b:pP},{h:"120",a:tut}],"har:"+x.id);
      }
    } else {
      ek(x.tarih,"tahsilat","Tahsilat (üretici payı) · "+(x.yer||""),
        [{h:"100",b:uP>0?uP:tut},{h:"120",a:uP>0?uP:tut}],"har:"+x.id);
    }
  });

  /* ——— 4.9 stant ——— */
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="stant") return;
    const f=num(x.fiyat); if(f<=0) return;
    ek(x.tarih,"stant","Stant bedeli · "+(x.yer||""),[{h:"631.9",b:f},{h:"100",a:f}],"har:"+x.id); });

  /* ——— 4.9b nakit teslim: saha kasası → Tikita kasası ——— */
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="nakitTeslim") return;
    const t=num(x.tutar); if(t<=0) return;
    if(x.onay===false) return;   // henüz teslim alınmadı — para hâlâ sahada
    ek(x.tarih,"teslim","Nakit teslim · "+(x.kullaniciAd||"")+(x.not?(" · "+x.not):""),
      [{h:"100",b:t},{h:"108",a:t}],"har:"+x.id); });

  /* ——— 4.10 tek seferlik giderler ——— */
  const GIDER_HESAP={"Pazarlamacı hakedişi":"335","Montaj işçiliği":"335","Elektrik":"730","Bakım":"730",
    "Kargo":"631.9","Vergi":"360","Tanıtım":"631.9","Diğer":"632"};
  const STOK_HESAP={"Filament alımı":"150","Sarf malzemesi alımı":"157","Yedek parça alımı":"157"};
  (D.giderler||[]).forEach(g=>{
    const brut=num(g.tutar); if(brut<=0) return;
    const {net,kdv}=ayir(brut);
    const sh=STOK_HESAP[g.tur]||(g.stok?"157":null);
    if(sh){ ek(g.tarih,"alim","Stok alımı · "+(g.tur||"")+(g.aciklama?(" · "+g.aciklama):""),
        [{h:sh,b:net},{h:"191",b:kdv},{h:"100",a:brut}],"gid:"+g.id); return; }
    const hs=GIDER_HESAP[g.tur]||"632";
    if(hs==="335"){ ek(g.tarih,"odeme",(g.tur||"Hakediş ödemesi")+(g.aciklama?(" · "+g.aciklama):""),
        [{h:"335",b:brut},{h:"100",a:brut}],"gid:"+g.id); return; }
    if(hs==="360"){ ek(g.tarih,"vergi","Vergi ödemesi"+(g.aciklama?(" · "+g.aciklama):""),
        [{h:"360",b:brut},{h:"100",a:brut}],"gid:"+g.id); return; }
    ek(g.tarih,"gider",(g.tur||"Gider")+(g.aciklama?(" · "+g.aciklama):""),
      [{h:hs,b:net},{h:"191",b:kdv},{h:"100",a:brut}],"gid:"+g.id);
  });

  /* ——— 4.11 sabit giderler: aylık tahakkuk ——— */
  const SABIT_HESAP={"Kira":"632","İnternet":"632","Maaş":"632","Abonelik":"632",
    "Sigorta":"632","Vergi":"632","Diğer":"632"};
  (D.sabitGider||[]).forEach(s=>{
    const tut=num(s.tutar); if(tut<=0||!s.baslangic) return;
    const yatirim=!!s.stok;
    let [y,m]=s.baslangic.split("-").map(Number); if(!y) return; m=(m||1)-1;
    for(let i=0;i<120;i++){
      const ayk=y+"-"+String(m+1).padStart(2,"0");
      if(s.bitis&&ayk>s.bitis) break;
      const son=new Date(y,m+1,0,23,59,59).getTime();
      if(son>simdi) break;
      if(son>=T0){
        if(yatirim){
          const faiz=tut*num(V.kredFaizPay)/100, ana=tut-faiz;
          ek(son,"yatirim",(s.tur||"Taksit")+" · "+ayk,
            [{h:"400",b:ana},{h:"780",b:faiz},{h:"100",a:tut}],"sab:"+s.id+":"+ayk);
        } else {
          const {net,kdv}=ayir(tut);
          ek(son,"sabit",(s.tur||"Sabit gider")+" · "+ayk,
            [{h:SABIT_HESAP[s.tur]||"632",b:net},{h:"191",b:kdv},{h:"100",a:tut}],"sab:"+s.id+":"+ayk);
        }
      }
      m++; if(m>11){m=0;y++;}
    }
  });

  /* ——— fiziki sayım referansı (kapanış fişi için) ——— */
  const fiziki={"150":0,"151":0,"152.1":0,"152.2":0,"152.3":0,"152.4":0,"157":0};
  (D.urunler||[]).forEach(u=>{ const m=bm(u.id); if(m<=0) return;
    fiziki["152.1"]+=num(u.stokta)*m;
    fiziki["152.2"]+=Object.keys(u.pazStokK||{}).reduce((s,k)=>s+num(u.pazStokK[k]),0)*m;
    fiziki["152.3"]+=num(u.konsinye)*m;
    fiziki["152.4"]+=num(u.montajda)*m; });
  (D.filamentler||[]).forEach(f=>{ fiziki["150"]+=num(f.stokKg)*num(f.kgFiyat); });
  (D.sarflar||[]).forEach(s=>{ fiziki["157"]+=num(s.stokta)*num(s.birimFiyat); });

  F.sort((x,y)=>x.t-y.t||0);
  F.forEach((f,i)=>f.no=i+1);
  return {fisler:F,uyari,acKg,kgFiyatOrt,aylikAmort,mkSay,mkDeger,yuklenenOH,fiziki};
}

/* ═════════ 4b · DÖNEM SONU KAPANIŞ FİŞLERİ ═════════
   Seçilen döneme bağlıdır — bu yüzden defterden ayrı üretilir. */
function kapanisUret(F,b0,b1,fiziki,V,D_HAR){
  const K=[]; const simdi=Date.now();
  const ek=(t,tur,ac,sat,ref)=>{ const s=(sat||[]).filter(x=>Math.abs(num(x.b))>0.004||Math.abs(num(x.a))>0.004)
      .map(x=>({h:x.h,b:r2(x.b),a:r2(x.a)}));
    if(!s.length) return;
    const tb=s.reduce((z,x)=>z+x.b,0), ta=s.reduce((z,x)=>z+x.a,0);
    if(Math.abs(tb-ta)>0.02) s.push({h:"659",b:tb<ta?r2(ta-tb):0,a:tb>ta?r2(tb-ta):0});
    K.push({t:ISO(t),tur,ac,s,ref}); };
  const son=Math.min(b1,simdi);

  // 1) 730 yansıtma farkı — dönem içi fiili ile yüklenen arasındaki fark 620'ye
  let b=0,a=0;
  F.forEach(f=>{ if(f.t<b0||f.t>b1) return; f.s.forEach(x=>{ if(x.h==="730"){b+=x.b;a+=x.a;} }); });
  const ohFark=r2(b-a);
  if(Math.abs(ohFark)>0.02)
    ek(son,"kapanis","Üretim gider farkı · 730 → 620",
      ohFark>0?[{h:"620",b:ohFark},{h:"730",a:ohFark}]:[{h:"730",b:-ohFark},{h:"620",a:-ohFark}],"kapanis:730");

  // 2) stok sayım düzeltmesi — fiziki sayım BUGÜNÜN sayımıdır,
  //    yalnızca bugüne kadar uzanan dönemlerde uygulanır
  const sayimGecerli=b1>=simdi-GUN_MS;
  let sayimFark=0; const sayimDetay={};
  if(sayimGecerli){
    const bak={}; F.concat(K).forEach(f=>{ if(f.t>b1) return; f.s.forEach(x=>{ bak[x.h]=(bak[x.h]||0)+x.b-x.a; }); });
    const sat=[];
    ["150","151","152.1","152.2","152.3","152.4","157"].forEach(k=>{
      const f=r2(num(fiziki[k])-(bak[k]||0));
      if(Math.abs(f)>0.5){ sat.push({h:k,b:f>0?f:0,a:f<0?-f:0}); sayimFark+=f; sayimDetay[k]=f; } });
    if(sat.length){
      const kars=V.sayimFarki==="gelir"?"659":"571";
      sat.push({h:kars,b:sayimFark<0?-sayimFark:0,a:sayimFark>0?sayimFark:0});
      ek(son,"sayim","Stok sayım düzeltmesi · "+(kars==="571"?"özkaynak":"gelir tablosu"),sat,"kapanis:sayim"); }
  }
  // 3) alıcılar mutabakatı — satışların "tahsil" alanı ile tahsilat kayıtları uyuşmayabilir
  //    (eski/excel kayıtlarında tahsilat fişi yazılmadan tahsil işaretlenmiş olabilir)
  let mutFark=0;
  if(sayimGecerli&&D_HAR){
    let acik=0;
    D_HAR.forEach(x=>{ if(x.tip!=="satis") return;
      if(x.gerilla||x.kaynak==="gerilla") return;
      const bek=num(x.adet)*num(x.satisFiyat);
      acik+=Math.max(0,bek-(x.tahsil==null?bek:num(x.tahsil))); });
    let defter=0; F.concat(K).forEach(f=>{ if(f.t>b1) return; f.s.forEach(x=>{ if(x.h==="120") defter+=x.b-x.a; }); });
    mutFark=r2(defter-acik);
    // Karşı hesap KASA DEĞİL: paranın nereye girdiği bilinmiyor, uydurma nakit yaratmamalı.
    if(Math.abs(mutFark)>0.5)
      ek(son,"mutabakat","Alıcılar mutabakatı · kayıtsız tahsilat",
        mutFark>0?[{h:"571",b:mutFark},{h:"120",a:mutFark}]:[{h:"120",b:-mutFark},{h:"571",a:-mutFark}],"kapanis:120");
  }
  return {kapanis:K,ohFark,sayimFark:r2(sayimFark),sayimDetay,sayimGecerli,mutFark};
}

/* ═════════ 5 · MİZAN / TABLOLAR ═════════ */
function mizanHesapla(F,b0,b1){
  const bil={}, gel={};
  F.forEach(f=>{
    const ic=f.t<=b1;
    const donem=f.t>=b0&&f.t<=b1;
    f.s.forEach(x=>{
      const H=HM[x.h]; if(!H) return;
      if(BILANCO_G[H.g]){ if(ic){ bil[x.h]=bil[x.h]||{b:0,a:0}; bil[x.h].b+=x.b; bil[x.h].a+=x.a; } }
      else { if(donem){ gel[x.h]=gel[x.h]||{b:0,a:0}; gel[x.h].b+=x.b; gel[x.h].a+=x.a; }
             if(ic){ bil["_kum"+x.h]=bil["_kum"+x.h]||{b:0,a:0}; bil["_kum"+x.h].b+=x.b; bil["_kum"+x.h].a+=x.a; } }
    });
  });
  const bakiye=(o,k)=>{ const H=HM[k]; if(!o) return 0; return H&&H.y==="a" ? o.a-o.b : o.b-o.a; };
  const B={}; Object.keys(bil).forEach(k=>{ if(k.indexOf("_kum")===0) return; B[k]=bakiye(bil[k],k); });
  const G={}; Object.keys(gel).forEach(k=>{ G[k]=bakiye(gel[k],k); });
  // kümüle dönem kârı (bilanço için) — gelir + , gider − , kontra hesap ters işaretli
  const isaret=H=>(H.g==="GEL"?1:-1)*(H.eksi?-1:1);
  let kumKar=0;
  Object.keys(bil).forEach(k=>{ if(k.indexOf("_kum")!==0) return; const kk=k.slice(4); const H=HM[kk]; if(!H) return;
    kumKar+=isaret(H)*bakiye(bil[k],kk); });
  return {B,G,kumKar,ham:{bil,gel}};
}

function gelirTablosu(G){
  const g=k=>num(G[k]);
  const brutSatis=g("600")+g("602");
  const iade=g("610");
  const netSatis=brutSatis-iade;
  const smm=g("620")+g("629");
  const brutKar=netSatis-smm;
  const fag=g("631")+g("631.9")+g("632")+g("654");
  const faalKar=brutKar-fag;
  const diger=-(g("689")+g("659"));
  const fvok=faalKar+diger;
  const fin=g("780");
  const vergiOncesi=fvok-fin;
  const vergi=g("691");
  const net=vergiOncesi-vergi;
  return {brutSatis,iade,netSatis,smm,brutKar,fag,faalKar,diger,fvok,fin,vergiOncesi,vergi,net,
    d:{s600:g("600"),s602:g("602"),s610:iade,s620:g("620"),s629:g("629"),s631:g("631"),s632:g("632"),
       s631b:g("631.9"),s654:g("654"),s659:g("659"),s689:g("689"),s780:fin,s691:vergi}};
}

function bilancoKur(B0,kumKar,donemKar){
  // 🔁 sunum düzeltmesi: ters bakiye veren hesap karşı tarafa taşınır
  //    (335 Personele Borçlar borç bakiyesi verirse → 136 Personelden Alacaklar)
  const B={...B0};
  if(num(B["335"])<0){ B["136"]=num(B["136"])-num(B["335"]); B["335"]=0; }
  if(num(B["120"])<0){ B["340"]=num(B["340"])-num(B["120"]); B["120"]=0; }
  const grup=gr=>HESAP.filter(x=>x.g===gr).map(x=>({k:x.k,ad:x.ad,v:num(B[x.k]),eksi:!!x.eksi})).filter(x=>Math.abs(x.v)>0.004);
  const top=a=>a.reduce((s,x)=>s+(x.eksi?-x.v:x.v),0);
  const DV=grup("DV"), DUV=grup("DUV"), KV=grup("KVYK"), UV=grup("UVYK"), OZ=grup("OZ");
  const tDV=top(DV), tDUV=top(DUV), tKV=top(KV), tUV=top(UV), tOZ=top(OZ)+kumKar;
  const dk=donemKar==null?kumKar:num(donemKar);      // seçilen dönemin kârı
  const gecmis=r2(kumKar-dk);                        // önceki dönemlerden devreden
  return {DV,DUV,KV,UV,OZ,tDV,tDUV,tKV,tUV,tOZ,kumKar,donemKar:r2(dk),gecmisKar:gecmis,
    aktif:tDV+tDUV, pasif:tKV+tUV+tOZ, fark:r2(tDV+tDUV-(tKV+tUV+tOZ))};
}

function nakitAkis(F,b0,b1,amort){
  // dolaysız: nakit hesaplarının hareketleri kategorilere ayrılır
  const NAK={"100":1,"102":1,"108":1};
  const kat={faaliyet:0,yatirim:0,finansman:0};
  const KAT_TUR={satis:"faaliyet",tahsilat:"faaliyet",gider:"faaliyet",sabit:"faaliyet",alim:"faaliyet",
    odeme:"faaliyet",stant:"faaliyet",vergi:"faaliyet",teslim:"faaliyet",yatirim:"finansman"};
  let acilisNakit=0, kapanisNakit=0;
  F.forEach(f=>{
    let d=0; f.s.forEach(x=>{ if(NAK[x.h]) d+=x.b-x.a; });
    if(Math.abs(d)<0.004) return;
    // açılış fişi bir nakit AKIŞI değil, açılış bakiyesidir
    if(f.tur==="acilis"){ if(f.t<=b1){ acilisNakit+=d; kapanisNakit+=d; } return; }
    if(f.t<b0) acilisNakit+=d;
    if(f.t<=b1) kapanisNakit+=d;
    if(f.t>=b0&&f.t<=b1){ const k=KAT_TUR[f.tur]||"faaliyet"; kat[k]+=d; }
  });
  return {...kat,acilisNakit:r2(acilisNakit),kapanisNakit:r2(kapanisNakit),
    netDegisim:r2(kat.faaliyet+kat.yatirim+kat.finansman),amort};
}

/* ═════════ 6 · ANALİZLER ═════════ */
function alacakYaslandir(hareketler,b1,V){
  // yaş = vade tarihinden itibaren geçen gün. Negatif = vadesi gelmemiş.
  const vd=num(V.vade), sg=Math.max(1,num(V.supheliGun));
  const d1=Math.round(sg/3), d2=Math.round(sg*2/3);
  const dilim=[{ad:"Vadesi gelmemiş",min:-1e9,max:-1,t:0,n:0},
    {ad:"1–"+d1+" gün gecikmiş",min:0,max:d1,t:0,n:0},
    {ad:(d1+1)+"–"+d2+" gün",min:d1+1,max:d2,t:0,n:0},
    {ad:(d2+1)+"–"+sg+" gün",min:d2+1,max:sg,t:0,n:0},
    {ad:sg+"+ gün",min:sg+1,max:1e9,t:0,n:0}];
  const kale={};
  (hareketler||[]).forEach(x=>{
    if(x.tip!=="satis") return; const t=ISO(x.tarih); if(!t||t>b1) return;
    const bek=num(x.adet)*num(x.satisFiyat);
    const tah=x.tahsil==null?bek:num(x.tahsil);
    const borc=r2(bek-tah); if(borc<=0.5) return;
    const yas=Math.floor((b1-t)/GUN_MS)-vd;
    const d=dilim.find(z=>yas>=z.min&&yas<=z.max)||dilim[dilim.length-1]; d.t+=borc; d.n++;
    const key=(x.yer||"?")+" · "+(x.kullaniciAd||"");
    kale[key]=kale[key]||{ad:x.yer||"?",paz:x.kullaniciAd||"",t:0,n:0,enEski:0};
    kale[key].t+=borc; kale[key].n++; kale[key].enEski=Math.max(kale[key].enEski,yas);
  });
  const toplam=dilim.reduce((s,d)=>s+d.t,0);
  const supheli=dilim[dilim.length-1].t*num(V.supheliOran)/100;   // en yaşlı dilim
  const kaleL=Object.keys(kale).map(k=>kale[k]).sort((a,b)=>b.t-a.t);
  return {dilim,toplam:r2(toplam),supheli:r2(supheli),kaleL};
}

function urunKarlilik(hareketler,M,b0,b1,V){
  const kdvO=num(V.kdvOran)/100;
  const netle=b=>V.fiyatlarKdvDahil? b/(1+kdvO) : b;
  const brutView=V.hasilatGorusu!=="net";
  const R={};
  (hareketler||[]).forEach(x=>{
    if(x.tip!=="satis") return; const t=ISO(x.tarih); if(t<b0||t>b1) return;
    const id=x.urunId||("a:"+(x.urunAd||"?"));
    const m=M[x.urunId];
    R[id]=R[id]||{ad:x.urunAd||(m?m.ad:"?"),adet:0,hasilat:0,smm:0,prim:0,iscilik:0,tahsil:0,bekl:0};
    const a=num(x.adet);
    const mus=num(x.satisFiyat)*a;
    const veris=(num(x.alisFiyat)>0?num(x.alisFiyat):(m?m.pazFiyat:0))*a;
    const mal=(num(x.maliyetBirim)>0?num(x.maliyetBirim):(m?m.birim:0))*a;
    R[id].adet+=a;
    R[id].hasilat+=netle(brutView?mus:Math.min(veris,mus>0?mus:veris));
    R[id].smm+=mal;
    R[id].prim+=brutView?Math.max(0,mus-veris):0;
    R[id].iscilik+=(m?m.iscilik:0)*a;
    R[id].bekl+=mus;
    R[id].tahsil+=(x.tahsil==null?mus:num(x.tahsil));
  });
  const L=Object.keys(R).map(k=>{ const x=R[k];
    const katki=x.hasilat-x.smm-x.prim;
    return {...x,id:k,katki,marj:x.hasilat>0?katki/x.hasilat*100:0,
      birimKatki:x.adet>0?katki/x.adet:0, alacak:r2(x.bekl-x.tahsil)}; })
    .sort((a,b)=>b.katki-a.katki);
  return L;
}

// katkı payı = net satış − DEĞİŞKEN maliyet.
// Pazarlamacı payı (631) satışla orantılıdır → sabit gider değil, değişken maliyettir.
function basabas(GTb){
  const degisken=GTb.smm+GTb.d.s631;
  const sabit=GTb.d.s631b+GTb.d.s632+GTb.d.s654+GTb.fin;
  const katkiOran=GTb.netSatis>0?(GTb.netSatis-degisken)/GTb.netSatis:0;
  return {katkiOran:katkiOran*100, sabit, degisken, katki:GTb.netSatis-degisken,
    ciro:katkiOran>0?sabit/katkiOran:null,
    guvenlik:GTb.netSatis>0&&katkiOran>0?((GTb.netSatis-sabit/katkiOran)/GTb.netSatis*100):null};
}

function oranlar(BL,GTb,gunSayi,amort,hamB){
  const HB=hamB||{};   // ham mizan — bilanço sunum düzeltmelerinden etkilenmez
  const o={};
  o.brutMarj=GTb.netSatis>0?GTb.brutKar/GTb.netSatis*100:null;
  o.faalMarj=GTb.netSatis>0?GTb.faalKar/GTb.netSatis*100:null;
  o.netMarj=GTb.netSatis>0?GTb.net/GTb.netSatis*100:null;
  o.favok=GTb.faalKar+amort;
  o.favokMarj=GTb.netSatis>0?o.favok/GTb.netSatis*100:null;
  o.cari=BL.tKV>0?BL.tDV/BL.tKV:null;
  const stokTop=HESAP.filter(x=>x.stok).reduce((s,x)=>s+num(BL.DV.find(z=>z.k===x.k)?BL.DV.find(z=>z.k===x.k).v:0),0);
  o.stokDeger=stokTop;
  o.asit=BL.tKV>0?(BL.tDV-stokTop)/BL.tKV:null;
  o.borcOz=BL.tOZ!==0?(BL.tKV+BL.tUV)/BL.tOZ:null;
  o.kaldirac=BL.aktif>0?(BL.tKV+BL.tUV)/BL.aktif*100:null;
  o.roa=BL.aktif>0?GTb.net/BL.aktif*100:null;
  o.roe=BL.tOZ>0?GTb.net/BL.tOZ*100:null;
  const alacak=Math.max(0,num(HB["120"]));
  o.dso=GTb.netSatis>0?alacak/(GTb.netSatis/gunSayi):null;
  o.dio=GTb.smm>0?stokTop/(GTb.smm/gunSayi):null;
  const borc=Math.max(0,num(HB["320"]))+Math.max(0,num(HB["335"]))+Math.max(0,num(HB["360"]));
  o.dpo=GTb.smm>0?borc/(GTb.smm/gunSayi):null;
  o.ccc=(o.dio!=null&&o.dso!=null)?o.dio+o.dso-(o.dpo||0):null;
  return o;
}

/* ——— aylık KDV beyanı ——— */
function kdvAylik(F,b0,b1){
  const A={}; let onceki=0;
  F.forEach(f=>{
    if(f.t<b0){ f.s.forEach(x=>{ if(x.h==="391") onceki+=x.a-x.b; else if(x.h==="191") onceki-=x.b-x.a; }); return; }
    if(f.t>b1) return;
    const k=ayEt(f.t);
    f.s.forEach(x=>{ if(x.h!=="391"&&x.h!=="191") return;
      A[k]=A[k]||{ay:k,hes:0,ind:0};
      if(x.h==="391") A[k].hes+=x.a-x.b; else A[k].ind+=x.b-x.a; }); });
  let devir=Math.max(0,-onceki);   // dönem başında devreden KDV'yle başla
  return Object.keys(A).sort().map(k=>{ const o=A[k];
    const net=o.hes-o.ind-devir;
    const odenecek=Math.max(0,net); devir=Math.max(0,-net);
    return {...o,odenecek:r2(odenecek),devreden:r2(devir),net:r2(net)}; });
}

/* ——— üretim gideri: standart yükleme vs fiili ——— */
function ohAnaliz(F,b0,b1,V){
  let yuklenen=0, fiili=0; const kaynak={};
  F.forEach(f=>{ if(f.t<b0||f.t>b1||f.tur==="kapanis") return;   // kapanış fişi 730'u sıfırlar, yükleme değildir
    f.s.forEach(x=>{ if(x.h!=="730") return;
      if(x.a>0) yuklenen+=x.a;
      if(x.b>0){ fiili+=x.b; kaynak[f.tur]=r2((kaynak[f.tur]||0)+x.b); } }); });
  const std=num(V.ohAmort)+num(V.ohElektrik)+num(V.ohBakim);
  const saat=SAAT_MALIYET>0?yuklenen/SAAT_MALIYET:0;
  return {yuklenen:r2(yuklenen),fiili:r2(fiili),fark:r2(fiili-yuklenen),kaynak,saat:r2(saat),
    std,birimFiili:saat>0?r2(fiili/saat):null,
    bilesen:[["Amortisman",num(V.ohAmort)],["Elektrik",num(V.ohElektrik)],["Bakım",num(V.ohBakim)]]};
}

/* ═════════ 7 · DENETİM ═════════ */
function denetim(D,V,F,MZ,BL,GTb,AY,UK,KP,OH){
  const K=[]; const dur=(s,b,d,x)=>K.push({s,b,d,x});
  // 1 mizan dengesi
  let tb=0,ta=0; F.forEach(f=>f.s.forEach(x=>{tb+=x.b;ta+=x.a;}));
  dur(Math.abs(tb-ta)<0.05?"ok":"hata","Yevmiye dengesi",
    "Borç "+tl(tb)+" · Alacak "+tl(ta),Math.abs(tb-ta)<0.05?"":"Fark "+tl(tb-ta));
  // 2 bilanço dengesi
  dur(Math.abs(BL.fark)<1?"ok":"hata","Bilanço dengesi",
    "Aktif "+tl(BL.aktif)+" · Pasif "+tl(BL.pasif),Math.abs(BL.fark)<1?"":"Fark "+tl(BL.fark));
  // 3 negatif stok
  const negF=(D.filamentler||[]).filter(f=>num(f.stokKg)<0);
  const negS=(D.sarflar||[]).filter(s=>num(s.stokta)<0);
  const negU=(D.urunler||[]).filter(u=>num(u.stokta)<0);
  const negN=negF.length+negS.length+negU.length;
  dur(negN?"hata":"ok","Negatif stok",negN?(negN+" kalem"):"Yok",
    negN?[].concat(negF.map(f=>f.ad+" "+r2(f.stokKg)+" kg"),negS.map(s=>s.ad+" "+ad(s.stokta)),negU.map(u=>u.ad+" "+ad(u.stokta))).join(" · "):"");
  // 4 maliyeti tanımsız ürünler
  const malYok=(D.urunler||[]).filter(u=>{ const m=D.maliyet[u.id]; return m&&m.birim<=0&&(num(u.stokta)>0||num(u.satildi)>0); });
  dur(malYok.length?"uyari":"ok","Maliyeti tanımsız ürün",malYok.length?(malYok.length+" ürün"):"Yok",
    malYok.slice(0,12).map(u=>u.ad).join(" · "));
  // 5 alisFiyat=0 satışlar
  const af0=(D.hareketler||[]).filter(x=>x.tip==="satis"&&num(x.alisFiyat)<=0);
  dur(af0.length?"uyari":"ok","Veriliş fiyatı sıfır satış",af0.length?(af0.length+" kayıt"):"Yok",
    af0.slice(0,8).map(x=>(x.urunAd||"?")+" · "+gun(x.tarih)).join(" · "));
  // 6 maliyetBirim=0 satışlar
  const mb0=(D.hareketler||[]).filter(x=>x.tip==="satis"&&num(x.maliyetBirim)<=0);
  dur(mb0.length?"uyari":"ok","Donmuş maliyeti olmayan satış",mb0.length?(mb0.length+" kayıt · güncel maliyet kullanıldı"):"Yok","");
  // 7 filamentsiz baskı
  const flYok=(D.plan||[]).filter(p=>p.basladi&&!p.filamentId);
  dur(flYok.length?"uyari":"ok","Filamenti seçilmemiş baskı",flYok.length?(flYok.length+" baskı · ortalama kg fiyatı kullanıldı"):"Yok","");
  // 8 üretim gider sapması
  const sapKap=num(KP.ohFark);
  dur(GTb.netSatis>0&&Math.abs(sapKap)>GTb.netSatis*0.15?"uyari":"ok","Üretim gider farkı",
    tl(sapKap)+(GTb.netSatis>0?(" · net satışın "+yzd(Math.abs(sapKap)/GTb.netSatis*100)):""),
    sapKap>0?"Fiili genel üretim gideri, "+tl0(SAAT_MALIYET)+"/saat standardının üstünde":"Fiili gider standardın altında");
  // 8b saat maliyeti standardı gerçeği yansıtıyor mu
  if(OH&&OH.birimFiili!=null&&OH.saat>0.5){
    const sapmaY=SAAT_MALIYET>0?(OH.birimFiili-SAAT_MALIYET)/SAAT_MALIYET*100:0;
    dur(Math.abs(sapmaY)>35?"uyari":"ok","Saat maliyeti standardı",
      "Standart "+tl0(SAAT_MALIYET)+"/saat · fiili "+tl(OH.birimFiili)+"/saat",
      Math.abs(sapmaY)>35?("Standart "+(sapmaY>0?"düşük":"yüksek")+" · ürün maliyetleri "+(sapmaY>0?"olduğundan az":"olduğundan çok")+" görünüyor, kâr marjları "+(sapmaY>0?"iyimser":"kötümser")):"");
  }
  // 9 stok sayım farkı
  const sf=num(KP.sayimFark);
  const sfDet=Object.keys(KP.sayimDetay||{}).map(k=>k+" "+tl0(KP.sayimDetay[k])).join(" · ");
  dur(!KP.sayimGecerli?"bilgi":(Math.abs(sf)<Math.max(500,GTb.smm*0.15)?"ok":"uyari"),
    "Defter–sayım stok farkı",
    KP.sayimGecerli?tl(sf):"Geçmiş dönem — bugünün sayımı uygulanmadı",
    KP.sayimGecerli?(sfDet+(V.sayimFarki==="gelir"?" → gelir tablosu":" → özkaynak (571)")):"");
  // 9b negatif defter stoku
  const dfs=KP.defterStok||{};
  const negD=Object.keys(dfs).filter(k=>dfs[k]<-1);
  dur(negD.length?"uyari":"ok","Negatif defter stoku",negD.length?(negD.length+" hesap"):"Yok",
    negD.map(k=>k+" "+tl0(dfs[k])).join(" · ")+(negD.length?" — üretim kaydı olmayan satış/çıkış":""));
  // 9c gelecek tarihli kayıt
  const ilerde=F.filter(f=>f.t>Date.now()+GUN_MS);
  dur(ilerde.length?"uyari":"ok","Gelecek tarihli kayıt",ilerde.length?(ilerde.length+" fiş"):"Yok",
    ilerde.slice(0,5).map(f=>gun(f.t)+" "+f.ac).join(" · "));
  // 10 yaşlanmış alacak
  const sonD=AY.dilim[AY.dilim.length-1];
  const eski=sonD.t;
  dur(eski>0?"uyari":"ok",num(V.supheliGun)+"+ gün gecikmiş alacak",tl(eski)+" · "+sonD.n+" satış",
    AY.kaleL.filter(k=>k.enEski>=num(V.supheliGun)).slice(0,6).map(k=>k.ad+" "+tl0(k.t)).join(" · "));
  // 11 negatif katkılı ürün
  const negK=UK.filter(x=>x.katki<0);
  dur(negK.length?"uyari":"ok","Negatif katkılı ürün",negK.length?(negK.length+" ürün"):"Yok",
    negK.slice(0,8).map(x=>x.ad+" "+tl0(x.katki)).join(" · "));
  // 12 kasa bakiyesi + gereken asgari açılış
  const kasa=num(MZ.B["100"]);
  let enDusukKasa=0, kk=0;
  F.slice().sort((a,b)=>a.t-b.t).forEach(f=>{ f.s.forEach(x=>{ if(x.h==="100") kk+=x.b-x.a; });
    if(kk<enDusukKasa) enDusukKasa=kk; });
  const gereken=enDusukKasa<0?num(V.acilisKasa)-enDusukKasa:num(V.acilisKasa);
  dur(kasa<0?"hata":(enDusukKasa<0?"uyari":"ok"),"Kasa bakiyesi",tl(kasa),
    enDusukKasa<0?("Dönem içi en düşük nokta "+tl0(enDusukKasa)+" — açılış kasası en az "+tl0(gereken)+" olmalıydı"):"");
  // 12b 120 Alıcılar mutabakatı — tahsilat kaydı olmadan "tahsil" işaretlenmiş satışlar
  let acikBorc=0;
  (D.hareketler||[]).forEach(x=>{ if(x.tip!=="satis") return;
    if(x.gerilla||x.kaynak==="gerilla") return;
    const bek=num(x.adet)*num(x.satisFiyat);
    acikBorc+=Math.max(0,bek-(x.tahsil==null?bek:num(x.tahsil))); });
  const mutFark=num(KP.mutFark);   // mutabakat fişi ÖNCESİ fark
  dur(Math.abs(mutFark)<Math.max(200,acikBorc*0.05)?"ok":"uyari","Alıcılar mutabakatı",
    "Açık borç "+tl(acikBorc)+(Math.abs(mutFark)>0.5?(" · düzeltilen "+tl(mutFark)):""),
    Math.abs(mutFark)>0.5?"Tahsilat kaydı yazılmadan satışta tahsil işaretlenmiş — dönem sonu mutabakat fişiyle kasaya alındı":"");
  // 13 konsinye tutarlılığı
  let konsHar=0; (D.hareketler||[]).forEach(x=>{ if(x.tip==="konsinye") konsHar+=num(x.kalan); });
  const konsStok=(D.urunler||[]).reduce((s,u)=>s+num(u.konsinye),0);
  dur(Math.abs(konsHar-konsStok)<=2?"ok":"uyari","Konsinye adet tutarlılığı",
    "Hareket "+ad(konsHar)+" · Ürün kartı "+ad(konsStok),Math.abs(konsHar-konsStok)>2?("Fark "+ad(konsHar-konsStok)+" adet"):"");
  // 14 kapanmamış avans
  const avans=num(MZ.B["340"]);
  dur(avans>0?"uyari":"ok","Mahsup edilmemiş avans",tl(avans),avans>0?"Sayımsız tahsilat, satışla eşleştirilmemiş":"");
  // 14b saha kasası — pazarlamacıda duran, teslim alınmamış nakit
  const saha=num(MZ.B["108"]);
  let teslimBek=0;
  (D.hareketler||[]).forEach(x=>{ if(x.tip==="nakitTeslim"&&x.onay===false) teslimBek+=num(x.tutar); });
  dur(saha<-1?"hata":(saha>0.5?"uyari":"ok"),"Saha kasası (pazarlamacıda)",tl(saha),
    saha<-1?"Teslim alınan, tahsil edilenden fazla — fazla teslim kaydı var"
      :(saha>0.5?("Henüz Tikita kasasına girmemiş nakit"+(teslimBek>0.5?(" · "+tl(teslimBek)+" onay bekliyor"):"")):""));
  // 15 personele borç
  const hak=num(MZ.B["335"]);
  dur(hak>0?"bilgi":(hak<-1?"uyari":"ok"),hak<-1?"Personele fazla ödeme":"Ödenmemiş hakediş",
    tl(Math.abs(hak)),hak<-1?"Tahakkuk edenden fazla ödenmiş — bilançoda 136 Personelden Alacaklar":"Pazarlamacı payı + montaj işçiliği tahakkuku");
  // 16 KDV pozisyonu
  const kdvB=num(MZ.B["391"])-num(MZ.B["191"]);
  dur(kdvB>0?"bilgi":"ok","KDV pozisyonu",kdvB>0?("Ödenecek "+tl(kdvB)):("Devreden "+tl(-kdvB)),"");
  // 16b hesap planında olmayan kod — sessizce düşerse bilanço bozulur
  const bilinmez={};
  F.forEach(f=>f.s.forEach(x=>{ if(!HM[x.h]) bilinmez[x.h]=(bilinmez[x.h]||0)+1; }));
  const bkod=Object.keys(bilinmez);
  dur(bkod.length?"hata":"ok","Hesap planı bütünlüğü",bkod.length?(bkod.length+" tanımsız kod"):"Tüm kodlar tanımlı",
    bkod.map(k=>k+" ("+bilinmez[k]+")").join(" · "));
  // 16c muhasebeleştirilemeyen hareketler
  const ISLENEN={satis:1,konsinye:1,iade:1,al:1,tahsilat:1,hediye:1,tabla:1};
  const disarida={};
  (D.hareketler||[]).forEach(x=>{ const t=x.tip||"(boş)";
    if(ISLENEN[t]) return;
    if(t==="stant"&&num(x.fiyat)>0) return;
    disarida[t]=(disarida[t]||0)+1; });
  const dsay=Object.keys(disarida).reduce((s2,k)=>s2+disarida[k],0);
  dur(dsay?"uyari":"ok","Muhasebeleştirilemeyen hareket",dsay?(dsay+" kayıt"):"Yok",
    Object.keys(disarida).map(k=>k+" "+disarida[k]).join(" · ")+(dsay?" — bedelsiz ziyaret/stant kayıtları defterde iz bırakmaz":""));
  // 17 varsayım bağımlılığı
  dur("bilgi","Varsayıma dayanan tutarlar",
    "Açılış "+tl(num(V.acilisKasa)+num(V.acilisBanka))+" · Makine "+tl(num(V.makineBirimDeger))+"/adet · Faiz payı %"+num(V.kredFaizPay),
    "Bu kalemler veritabanında yok, Varsayım sekmesinden değiştirilir");
  // 18 nakit vs kâr sapması
  return K;
}

/* ═════════ 9 · UYGULAMA ═════════ */
function App(){
  const urunler=useColl("stok_urun"), plan=useColl("plan"), hareketler=useColl("pazarlama_hareket"),
        filamentler=useColl("filament"), sarflar=useColl("sarf"), giderler=useColl("gider"),
        sabitGider=useColl("sabit_gider"), montajGorev=useColl("montaj_gorev"),
        makineler=useColl("makineler"), kullanicilar=useColl("kullanici");
  const [V,setV]=useState(varsayilanVarsayim);
  const [sekme,setSekme]=useState("panel");
  const [aralik,setAralik]=useState("tum");
  const [ozelB,setOzelB]=useState(""), [ozelS,setOzelS]=useState("");

  const yuklu=urunler&&plan&&hareketler&&filamentler&&sarflar&&giderler&&sabitGider&&montajGorev&&makineler;

  const [b0,b1]=useMemo(()=>{
    const n=new Date(); const son=n.getTime();
    if(aralik==="ozel"&&ozelB&&ozelS) return [ISO(ozelB+"T00:00:00"),ISO(ozelS+"T23:59:59")];
    if(aralik==="ay") return [ayBas(n.getFullYear(),n.getMonth()),son];
    if(aralik==="gecenay"){ const b=ayBas(n.getFullYear(),n.getMonth()-1); return [b,ayBas(n.getFullYear(),n.getMonth())-1]; }
    if(aralik==="ceyrek") return [ayBas(n.getFullYear(),n.getMonth()-2),son];
    if(aralik==="yil") return [ayBas(n.getFullYear(),0),son];
    if(aralik==="hafta"){ const d=new Date(n); const wd=(d.getDay()+6)%7; d.setHours(0,0,0,0); d.setDate(d.getDate()-wd); return [d.getTime(),son]; }
    return [0,son];
  },[aralik,ozelB,ozelS]);

  const HES=useMemo(()=>{
    if(!yuklu) return null;
    const urunById={}; urunler.forEach(u=>urunById[u.id]=u);
    const M=maliyetTablo(urunler,plan,filamentler,sarflar);
    const D={urunler,plan,hareketler,filamentler,sarflar,giderler,sabitGider,montajGorev,makineler,
      kullanicilar:kullanicilar||[],urunById,maliyet:M};
    const {fisler:ham,acKg,kgFiyatOrt,aylikAmort,mkSay,mkDeger,fiziki}=defterUret(D,V);
    const KP=kapanisUret(ham,b0,b1,fiziki,V,hareketler);
    const fisler=ham.concat(KP.kapanis).sort((a,b)=>a.t-b.t);
    fisler.forEach((f,i)=>f.no=i+1);
    // defter stoğu (sayım öncesi) — denetim için
    KP.defterStok={}; ham.forEach(f=>{ if(f.t>b1) return; f.s.forEach(x=>{
      if(x.h.indexOf("15")===0) KP.defterStok[x.h]=r2((KP.defterStok[x.h]||0)+x.b-x.a); }); });
    KP.fiziki=fiziki;
    let MZ=mizanHesapla(fisler,b0,b1);
    let GTb=gelirTablosu(MZ.G);
    // 🧾 kurumlar vergisi karşılığı — dönem kârı üzerinden, ikinci geçişte deftere eklenir
    const vOran=num(V.kurumlarVergisi)/100;
    if(vOran>0&&GTb.vergiOncesi>0&&num(GTb.vergi)<=0){
      const vt=r2(GTb.vergiOncesi*vOran);
      if(vt>0.5){ fisler.push({t:Math.min(b1,Date.now()),tur:"vergi",ac:"Kurumlar vergisi karşılığı · %"+num(V.kurumlarVergisi),
          s:[{h:"691",b:vt,a:0},{h:"370",b:0,a:vt}],ref:"kapanis:vergi"});
        fisler.sort((a,b2)=>a.t-b2.t); fisler.forEach((f,i)=>f.no=i+1);
        MZ=mizanHesapla(fisler,b0,b1); GTb=gelirTablosu(MZ.G); }
    }
    const BL=bilancoKur(MZ.B,MZ.kumKar,GTb.net);
    const gunSayi=Math.max(1,Math.round((Math.min(b1,Date.now())-Math.max(b0,ISO(V.acilisTarih+"T00:00:00")))/GUN_MS));
    // dönem amortismanı
    let donemAmort=0; fisler.forEach(f=>{ if(f.tur==="amortisman"&&f.t>=b0&&f.t<=b1) f.s.forEach(x=>{ if(x.h==="730") donemAmort+=x.b; }); });
    const NA=nakitAkis(fisler,b0,b1,donemAmort);
    const AY=alacakYaslandir(hareketler,b1,V);
    const UK=urunKarlilik(hareketler,M,b0,b1,V);
    const BB=basabas(GTb);
    const sabitTop=BB.sabit;
    const OR=oranlar(BL,GTb,gunSayi,donemAmort,MZ.B);
    const KDV=kdvAylik(fisler,b0,b1);
    const OH=ohAnaliz(fisler,b0,b1,V);
    const DN=denetim(D,V,fisler,MZ,BL,GTb,AY,UK,KP,OH);
    return {D,M,fisler,MZ,GTb,BL,NA,AY,UK,BB,OR,DN,KP,KDV,OH,gunSayi,donemAmort,acKg,kgFiyatOrt,aylikAmort,mkSay,mkDeger,sabitTop};
  },[yuklu,urunler,plan,hareketler,filamentler,sarflar,giderler,sabitGider,montajGorev,makineler,kullanicilar,V,b0,b1]);

  if(!yuklu) return h("div",{style:{padding:"120px 20px",textAlign:"center",color:"var(--mut)"}},
    h("div",{style:{width:28,height:28,border:"3px solid var(--line)",borderTopColor:"var(--acc)",borderRadius:"50%",
      margin:"0 auto 16px",animation:"sp .8s linear infinite"}}),
    h("div",{style:{fontSize:13,fontWeight:700}},"Defter kuruluyor"));

  const SEK=[{k:"panel",ad:"Panel"},{k:"gelir",ad:"Gelir Tablosu"},{k:"bilanco",ad:"Bilanço"},
    {k:"nakit",ad:"Nakit Akış"},{k:"analiz",ad:"Analiz"},{k:"urun",ad:"Ürün Kârlılığı"},
    {k:"mizan",ad:"Mizan"},{k:"defter",ad:"Yevmiye"},{k:"denetim",ad:"Denetim"},{k:"varsayim",ad:"Varsayım"}];
  const ARALIK=[["hafta","Bu hafta"],["ay","Bu ay"],["gecenay","Geçen ay"],["ceyrek","3 ay"],["yil","Yıl"],["tum","Tümü"],["ozel","Özel"]];

  return h("div",null,
    /* başlık */
    h("div",{style:{padding:"16px 14px 12px",display:"flex",alignItems:"flex-end",gap:12,flexWrap:"wrap"}},
      h("div",{style:{flex:1,minWidth:180}},
        h("div",{style:{fontSize:20,fontWeight:800,letterSpacing:"-.5px"}},"Tikita · Finans"),
        h("div",{style:{fontSize:11.5,color:"var(--mut)",marginTop:2}},
          "Tek düzen hesap planı · çift taraflı kayıt · salt okunur · "+SURUM)),
      h("button",{onClick:()=>setV(V.hasilatGorusu==="brut"?{...V,hasilatGorusu:"net"}:{...V,hasilatGorusu:"brut"}),
        style:{padding:"7px 12px",borderRadius:8,border:"1px solid var(--line2)",background:"var(--surf)",
          fontSize:11.5,fontWeight:800,color:"var(--acc)"}},
        V.hasilatGorusu==="brut"?"Hasılat: uç müşteri (aracı)":"Hasılat: pazarlamacıya veriliş")),
    /* tarih aralığı */
    h("div",{className:"kaydir",style:{display:"flex",gap:6,padding:"0 14px 12px"}},
      ARALIK.map(([k,a])=>h("button",{key:k,onClick:()=>setAralik(k),
        style:{padding:"6px 11px",borderRadius:7,fontSize:11.5,fontWeight:800,whiteSpace:"nowrap",
          border:"1px solid "+(aralik===k?"var(--acc)":"var(--line)"),
          background:aralik===k?"#e0f2fe":"var(--surf)",color:aralik===k?"var(--acc)":"var(--mut)"}},a)),
      aralik==="ozel"?h("div",{style:{display:"flex",gap:6,alignItems:"center"}},
        h("input",{type:"date",value:ozelB,onChange:e=>setOzelB(e.target.value),style:{...inpS,padding:"5px 8px",fontSize:12,width:"auto"}}),
        h("input",{type:"date",value:ozelS,onChange:e=>setOzelS(e.target.value),style:{...inpS,padding:"5px 8px",fontSize:12,width:"auto"}})):null),
    h(Sekme,{liste:SEK,aktif:sekme,setAktif:setSekme}),
    h("div",{style:{padding:"6px 12px 0"}},
      sekme==="panel"?h(Panel,{H:HES,V,b0,b1}):
      sekme==="gelir"?h(GelirEkran,{H:HES,V}):
      sekme==="bilanco"?h(BilancoEkran,{H:HES}):
      sekme==="nakit"?h(NakitEkran,{H:HES,V,b0,b1}):
      sekme==="analiz"?h(AnalizEkran,{H:HES,V}):
      sekme==="urun"?h(UrunEkran,{H:HES,V}):
      sekme==="mizan"?h(MizanEkran,{H:HES}):
      sekme==="defter"?h(DefterEkran,{H:HES,b0,b1}):
      sekme==="denetim"?h(DenetimEkran,{H:HES}):
      h(VarsayimEkran,{V,setV,H:HES})));
}

/* ——— Panel ——— */
function Panel({H,V,b0,b1}){
  const {GTb,BL,OR,NA,AY,UK,DN,BB,donemAmort}=H;
  const kritik=DN.filter(x=>x.s==="hata").length, uy=DN.filter(x=>x.s==="uyari").length;
  const nakit=num(BL.DV.reduce((s,x)=>s+(["100","102","108"].indexOf(x.k)>=0?x.v:0),0));
  const top5=UK.slice(0,5);

  return h("div",null,
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(148px,1fr))",gap:10,marginBottom:14}},

      h(Kutu,{b:"Faaliyet kârı",v:tl0(GTb.faalKar),alt:yzd(OR.faalMarj),renk:GTb.faalKar<0?"var(--neg)":"var(--ink)"}),
      h(Kutu,{b:"FAVÖK",v:tl0(OR.favok),alt:yzd(OR.favokMarj)}),
      h(Kutu,{b:"Net dönem kârı",v:tl0(GTb.net),alt:yzd(OR.netMarj),renk:GTb.net<0?"var(--neg)":"var(--pos)"}),
      h(Kutu,{b:"Nakit",v:tl0(nakit),alt:"kasa + banka + saha",renk:nakit<0?"var(--neg)":"var(--ink)"}),
      h(Kutu,{b:"Alacak",v:tl0(AY.toplam),alt:"tahsilat gün "+(OR.dso!=null?Math.round(OR.dso):"—")}),
      h(Kutu,{b:"Stok",v:tl0(OR.stokDeger),alt:"devir gün "+(OR.dio!=null?Math.round(OR.dio):"—")}),
      h(Kutu,{b:"Özkaynak",v:tl0(BL.tOZ),alt:"aktif "+tl0(BL.aktif)}),
      h(Kutu,{b:"Denetim",v:kritik?(kritik+" hata"):(uy?(uy+" uyarı"):"temiz"),
        renk:kritik?"var(--neg)":(uy?"var(--warn)":"var(--pos)"),alt:DN.length+" kontrol"})),

    h(Bolum,{b:"Kâr köprüsü",alt:"net satışlardan net kâra"},
      h(Sat,{ad:"Net satışlar",v:GTb.netSatis,kalin:true}),
      h(Sat,{ad:"Satılan mamul maliyeti",v:-GTb.smm,gir:1}),
      h(Sat,{ad:"Brüt kâr",v:GTb.brutKar,kalin:true,ust:true}),
      h(Sat,{ad:"Pazarlamacı payı",v:-GTb.d.s631,gir:1}),
      GTb.d.s631b?h(Sat,{ad:"Diğer pazarlama giderleri",v:-GTb.d.s631b,gir:1}):null,
      h(Sat,{ad:"Genel yönetim",v:-GTb.d.s632,gir:1}),
      GTb.d.s654?h(Sat,{ad:"Şüpheli alacak karşılığı",v:-GTb.d.s654,gir:1}):null,
      h(Sat,{ad:"Faaliyet kârı",v:GTb.faalKar,kalin:true,ust:true}),
      GTb.d.s689?h(Sat,{ad:"Zayiat ve olağandışı",v:-GTb.d.s689,gir:1}):null,
      GTb.fin?h(Sat,{ad:"Finansman gideri",v:-GTb.fin,gir:1}):null,

      h(Sat,{ad:"Net dönem kârı",v:GTb.net,kalin:true,ust:true,renk:GTb.net<0?"var(--neg)":"var(--pos)"})),

    h(Bolum,{b:"Katkı payı · ilk 5 ürün",alt:"hasılat − maliyet − pazarlamacı payı"},

function NakitEkran({H,V,b0,b1}){
  const {NA,GTb,AY,OR,BL,fisler,donemAmort,sabitTop}=H;
  // 13 haftalık projeksiyon
  const proj=useMemo(()=>{
    const haftaSatis=(()=>{
      let t=0,n=0; const bas=Date.now()-56*GUN_MS;
      (H.D.hareketler||[]).forEach(x=>{ if(x.tip!=="satis") return; const tt=ISO(x.tarih);
        if(tt<bas||tt>Date.now()) return; t+=num(x.adet)*num(x.satisFiyat); });
      n=8; return t/n; })();
    const aylikSabit=(H.D.sabitGider||[]).filter(s=>!s.stok&&num(s.tutar)>0)
      .reduce((s,x)=>s+num(x.tutar),0);
    const aylikYat=(H.D.sabitGider||[]).filter(s=>s.stok&&num(s.tutar)>0)
      .reduce((s,x)=>s+num(x.tutar),0);
    const egri=V.tahsilatEgri||[45,30,15,10];
    const alacakTah=AY.dilim.map((d,i)=>d.t*num(egri[i])/100);
    const alacakHafta=alacakTah.reduce((s,x)=>s+x,0)/13;
    let nakit=NA.kapanisNakit; const R=[];
    for(let w=1;w<=13;w++){
      const gir=haftaSatis+alacakHafta;
      const cik=(aylikSabit+aylikYat)*12/52 + haftaSatis*0.45;   // hakediş + değişken maliyet payı
      nakit+=gir-cik;
      R.push({w,gir:r2(gir),cik:r2(cik),nakit:r2(nakit)});
    }
    return {R,haftaSatis:r2(haftaSatis),aylikSabit,aylikYat,alacakHafta:r2(alacakHafta)};
  },[H,V,NA]);
  const enDusuk=proj.R.reduce((m,x)=>Math.min(m,x.nakit),NA.kapanisNakit);
  const maxN=Math.max.apply(null,proj.R.map(x=>Math.abs(x.nakit)).concat([1]));

    h(Bolum,{b:"Nakit akış tablosu",alt:"dolaysız yöntem · kasa, banka ve saha nakdi"},

      h(Sat,{ad:"Dönem sonu nakit",v:NA.kapanisNakit,kalin:true,
        renk:NA.kapanisNakit<0?"var(--neg)":"var(--ink)"})),
    h(Bolum,{b:"Kâr–nakit köprüsü",alt:"net kâr neden kasada görünmüyor"},
      h(Sat,{ad:"Net dönem kârı",v:GTb.net,kalin:true}),
      h(Sat,{ad:"Amortisman (nakit çıkışı yok)",v:donemAmort,gir:1}),
      h(Sat,{ad:"Alacaklardaki artış",v:-AY.toplam,gir:1}),

      h(Sat,{ad:"Ödenmemiş hakediş ve borçlar",v:BL.tKV,gir:1}),
      h(Sat,{ad:"Yaklaşık nakit pozisyonu",v:GTb.net+donemAmort-AY.toplam-OR.stokDeger+BL.tKV,kalin:true,ust:true})),
    h(Bolum,{b:"13 haftalık nakit projeksiyonu",
      alt:"haftalık satış "+tl0(proj.haftaSatis)+" · alacak tahsili "+tl0(proj.alacakHafta)+"/hafta"},
      h("div",{style:{padding:"10px 14px"}},
        h("div",{style:{display:"flex",alignItems:"flex-end",gap:3,height:110,marginBottom:8}},
          proj.R.map(x=>h("div",{key:x.w,style:{flex:1,display:"flex",flexDirection:"column",justifyContent:"flex-end",height:"100%"}},
            h("div",{title:"H"+x.w+": "+tl0(x.nakit),
              style:{height:Math.max(2,Math.abs(x.nakit)/maxN*100)+"%",
                background:x.nakit<0?"var(--neg)":"var(--acc)",borderRadius:"3px 3px 0 0"}})))),
        h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:10.5,color:"var(--mut)",fontWeight:700}},

    const b=MZ.ham.bil[x.k]||MZ.ham.gel[x.k]||MZ.ham.bil["_kum"+x.k]||{b:0,a:0};
    const bak=BILANCO_G[x.g]?num(MZ.B[x.k]):num(MZ.G[x.k]);
    return {...x,b:b.b,a:b.a,bak};
  }).filter(x=>Math.abs(x.b)>0.004||Math.abs(x.a)>0.004);
  const TB=rows.reduce((s,x)=>s+x.b,0), TA=rows.reduce((s,x)=>s+x.a,0);
  return h("div",null,
    h("div",{className:"card",style:{padding:"12px 14px",marginBottom:14,display:"flex",gap:14,flexWrap:"wrap"}},
      h("div",{style:{flex:1,minWidth:110}},h("div",{className:"lbl"},"Toplam borç"),
        h("div",{className:"mono",style:{fontSize:17,fontWeight:800}},tl0(TB))),
      h("div",{style:{flex:1,minWidth:110}},h("div",{className:"lbl"},"Toplam alacak"),
        h("div",{className:"mono",style:{fontSize:17,fontWeight:800}},tl0(TA))),
      h("div",{style:{flex:1,minWidth:110}},h("div",{className:"lbl"},"Fiş"),
        h("div",{className:"mono",style:{fontSize:17,fontWeight:800}},ad(fisler.length)))),
    h(Bolum,{b:"Mizan",alt:"bilanço hesapları kümüle · sonuç hesapları dönem içi",ic:false},
      h("div",{className:"kaydir"},h("table",null,
        h("thead",null,h("tr",null,h("th",null,"Kod"),h("th",null,"Hesap"),
          h("th",{className:"n"},"Borç"),h("th",{className:"n"},"Alacak"),h("th",{className:"n"},"Bakiye"))),
        h("tbody",null,
          rows.map(x=>h("tr",{key:x.k},
            h("td",{className:"mono",style:{color:"var(--mut)"}},x.k),
            h("td",{style:{fontWeight:600}},x.ad),
            h("td",{className:"n"},tl0(x.b)),h("td",{className:"n"},tl0(x.a)),
            h("td",{className:"n",style:{fontWeight:800}},tl0(x.bak)))),
          h("tr",{className:"tot"},h("td",null,""),h("td",null,"TOPLAM"),
            h("td",{className:"n"},tl0(TB)),h("td",{className:"n"},tl0(TA)),
            h("td",{className:"n",style:{color:Math.abs(TB-TA)<0.05?"var(--pos)":"var(--neg)"}},tl(TB-TA))))))));
}

/* ——— Yevmiye ——— */
function DefterEkran({H,b0,b1}){
  const {fisler}=H;
  const [tur,setTur]=useState("");
  const [ara,setAra]=useState("");
  const [limit,setLimit]=useState(120);
  const TURLER=useMemo(()=>{ const s={}; fisler.forEach(f=>s[f.tur]=(s[f.tur]||0)+1);
    return Object.keys(s).sort().map(k=>({k,n:s[k]})); },[fisler]);
  const L=useMemo(()=>fisler.filter(f=>{
    if(f.t<b0||f.t>b1) return false;
    if(tur&&f.tur!==tur) return false;
    if(ara){ const q=ara.toLocaleLowerCase("tr");
      if((f.ac||"").toLocaleLowerCase("tr").indexOf(q)<0 && f.s.every(x=>x.h.indexOf(q)<0)) return false; }
    return true; }).sort((a,b)=>b.t-a.t),[fisler,tur,ara,b0,b1]);
  return h("div",null,
    h("div",{className:"card",style:{padding:"10px 12px",marginBottom:12}},
      h("input",{value:ara,onChange:e=>{setAra(e.target.value);setLimit(120);},placeholder:"Açıklama ya da hesap kodu",style:inpS}),
      h("div",{className:"kaydir",style:{display:"flex",gap:5,marginTop:9}},
        h("button",{onClick:()=>setTur(""),style:{padding:"5px 9px",borderRadius:6,fontSize:11,fontWeight:800,
          border:"1px solid "+(tur===""?"var(--acc)":"var(--line)"),background:tur===""?"#e0f2fe":"var(--surf)",
          color:tur===""?"var(--acc)":"var(--mut)",whiteSpace:"nowrap"}},"Tümü "+fisler.length),
        TURLER.map(t=>h("button",{key:t.k,onClick:()=>{setTur(t.k);setLimit(120);},
          style:{padding:"5px 9px",borderRadius:6,fontSize:11,fontWeight:800,whiteSpace:"nowrap",
            border:"1px solid "+(tur===t.k?"var(--acc)":"var(--line)"),
            background:tur===t.k?"#e0f2fe":"var(--surf)",color:tur===t.k?"var(--acc)":"var(--mut)"}},t.k+" "+t.n)))),
    h("div",{style:{fontSize:11.5,color:"var(--mut)",padding:"0 4px 8px",fontWeight:700}},
      ad(L.length)+" fiş · gösterilen "+ad(Math.min(limit,L.length))),
    L.slice(0,limit).map((f,i)=>h("div",{key:i,className:"card",style:{marginBottom:8,overflow:"hidden"}},
      h("div",{style:{padding:"9px 12px",background:"var(--surf2)",borderBottom:"1px solid var(--line)",
        display:"flex",gap:8,alignItems:"baseline"}},
        h("span",{className:"mono",style:{fontSize:11,color:"var(--mut)",fontWeight:700}},gun(f.t)),
        h("span",{style:{flex:1,fontSize:12.5,fontWeight:700,minWidth:0}},f.ac),
        h(Rozet,{t:f.tur,r:"bilgi"})),
      h("table",null,h("tbody",null,f.s.map((x,j)=>h("tr",{key:j},
        h("td",{className:"mono",style:{width:52,color:"var(--mut)"}},x.h),
        h("td",{style:{fontSize:12.5}},hAd(x.h)),
        h("td",{className:"n",style:{width:110,fontWeight:x.b?800:400,color:x.b?"var(--ink)":"var(--mut2)"}},x.b?tl(x.b):"·"),
        h("td",{className:"n",style:{width:110,fontWeight:x.a?800:400,color:x.a?"var(--ink)":"var(--mut2)"}},x.a?tl(x.a):"·"))))))),
    L.length>limit?h("button",{onClick:()=>setLimit(limit+200),
      style:{width:"100%",padding:13,borderRadius:10,background:"var(--surf)",border:"1px solid var(--line2)",
        fontSize:13,fontWeight:800,color:"var(--acc)",marginTop:4}},"Daha fazla göster"):null);
}

/* ——— Denetim ——— */
function DenetimEkran({H}){
  const {DN}=H;
  const sira={hata:0,uyari:1,bilgi:2,ok:3};
  const L=DN.slice().sort((a,b)=>sira[a.s]-sira[b.s]);
  const say=s=>DN.filter(x=>x.s===s).length;
  return h("div",null,
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:10,marginBottom:14}},
      h(Kutu,{b:"Hata",v:say("hata"),renk:say("hata")?"var(--neg)":"var(--pos)"}),
      h(Kutu,{b:"Uyarı",v:say("uyari"),renk:say("uyari")?"var(--warn)":"var(--pos)"}),
      h(Kutu,{b:"Bilgi",v:say("bilgi")}),
      h(Kutu,{b:"Temiz",v:say("ok"),renk:"var(--pos)"})),
    L.map((x,i)=>h("div",{key:i,className:"card",style:{padding:"11px 13px",marginBottom:8,
      borderLeft:"3px solid "+(x.s==="hata"?"var(--neg)":(x.s==="uyari"?"var(--warn)":(x.s==="bilgi"?"var(--acc)":"var(--pos)")))}},
      h("div",{style:{display:"flex",gap:9,alignItems:"baseline",marginBottom:x.x?4:0}},
        h("div",{style:{flex:1,fontSize:13,fontWeight:800,minWidth:0}},x.b),
        h(Rozet,{t:x.s==="ok"?"temiz":x.s,r:x.s})),
      h("div",{className:"mono",style:{fontSize:12.5,fontWeight:700,color:"var(--txt)"}},x.d),
      x.x?h("div",{style:{fontSize:11.5,color:"var(--mut)",marginTop:4,lineHeight:1.45}},x.x):null)));
}

/* ——— Varsayım ——— */
function VarsayimEkran({V,setV,H}){
  const grp={}; VAR_ALAN.forEach(a=>{(grp[a.grp]=grp[a.grp]||[]).push(a);});
  const set=(k,v)=>setV({...V,[k]:v});
  return h("div",null,
    h("div",{className:"card",style:{padding:"12px 14px",marginBottom:14,background:"#fffbeb",borderColor:"#fcd34d"}},
      h("div",{style:{fontSize:12.5,fontWeight:800,color:"#92400e"}},"Bu değerler veritabanında yok"),
      h("div",{style:{fontSize:11.5,color:"#a16207",marginTop:3,lineHeight:1.5}},
        "Sayfa açıkken bellekte tutulur, hiçbir kayda yazılmaz. Sekmeyi kapatınca varsayılana döner.")),
    Object.keys(grp).map(g=>h(Bolum,{key:g,b:g},
      h("div",{style:{padding:"6px 14px 12px",display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:10}},
        grp[g].map(a=>h("div",{key:a.k},
          h("div",{className:"lbl",style:{marginBottom:4}},a.ad),
          h("input",{type:a.tip==="tarih"?"date":"text",
            value:V[a.k]==null?"":String(V[a.k]),
            placeholder:a.bos||"",
            onChange:e=>{ const t=e.target.value;
              const say=z=>num(String(z).indexOf(",")>=0?String(z).replace(/\./g,"").replace(",","."):z);
              set(a.k, a.tip==="tarih"?t : (t===""?(a.bos?null:0):(a.tip==="sayi"||a.tip==="tl"?say(t):t))); },
            style:inpS})))))),
    h(Bolum,{b:"Türetilen değerler",alt:"varsayımlardan ve veriden hesaplandı"},
      h(Sat,{ad:"Açılış filament",v:0,ik:ad(H.acKg)+" kg · "+tl0(H.acKg*H.kgFiyatOrt)}),
      h(Sat,{ad:"Ortalama filament kg fiyatı",v:H.kgFiyatOrt}),
      h(Sat,{ad:"Makine sayısı",v:0,ik:ad(H.mkSay)+" adet"}),
      h(Sat,{ad:"Makine parkı değeri",v:H.mkDeger}),
      h(Sat,{ad:"Aylık amortisman",v:H.aylikAmort}),
      h(Sat,{ad:"Dönem amortismanı",v:H.donemAmort}),
      h(Sat,{ad:"Saat maliyeti standardı",v:0,ik:tl0(SAAT_MALIYET)+"/saat"}),
      h(Sat,{ad:"  amortisman payı",v:num(V.ohAmort),gir:1}),
      h(Sat,{ad:"  elektrik payı",v:num(V.ohElektrik),gir:1}),
      h(Sat,{ad:"  bakım payı",v:num(V.ohBakim),gir:1})),
    h("button",{onClick:()=>setV(varsayilanVarsayim()),
      style:{width:"100%",padding:13,borderRadius:10,background:"var(--surf)",border:"1px solid var(--line2)",
        fontSize:13,fontWeight:800,color:"var(--mut)",marginBottom:20}},"Varsayılana dön"));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
