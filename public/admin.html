/* 🩺 BEYAZ SAYFA NÖBETÇİSİ — modül hiç çalışmazsa (CDN gitmedi, sözdizimi hatası,
   eski önbellek) ekran bomboş kalıyordu. Burası klasik <script>: modül yüklenemese
   bile çalışır, 9 saniye sonra kök hâlâ boşsa sebebi ekrana yazar. */
(function(){
  var HATA=null;
  window.addEventListener("error",function(e){
    if(!HATA) HATA=(e&&e.message||"")+((e&&e.filename)?("\n"+e.filename+":"+(e.lineno||0)):""); },true);
  window.addEventListener("unhandledrejection",function(e){
    if(!HATA) HATA="İstek başarısız: "+String((e&&e.reason&&e.reason.message)||e.reason||""); });
  function goster(){
    var r=document.getElementById("root");
    if(!r||r.childNodes.length) return;
    r.innerHTML='<div style="padding:26px 20px;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;'
      +'max-width:520px;margin:0 auto;color:#1b1e25">'
      +'<div style="font-size:40px;margin-bottom:10px">📡</div>'
      +'<div style="font-size:19px;font-weight:800;margin-bottom:8px">Uygulama yüklenemedi</div>'
      +'<div style="font-size:13.5px;line-height:1.6;color:#5b616e;margin-bottom:16px">'
      +'Sayfa açıldı ama ekran çizilemedi. En sık sebebi bağlantının kesik olması '
      +'(uygulama açılışta internetten kütüphane çekiyor).</div>'
      +(HATA?('<pre style="font-size:11px;background:#f4f5f7;border:1px solid #e3e5e9;border-radius:10px;'
      +'padding:11px;white-space:pre-wrap;word-break:break-word;color:#9a3412;margin-bottom:16px">'
      +String(HATA).replace(/[<>&]/g,"")+'</pre>'):'')
      +'<button id="tk-nobet-yenile" style="width:100%;padding:14px;border:0;border-radius:14px;'
      +'background:#1b1e25;color:#fff;font-size:15px;font-weight:800">Yeniden dene</button>'
      +'<button id="tk-nobet-sifirla" style="width:100%;padding:12px;margin-top:9px;border:1px solid #e3e5e9;'
      +'border-radius:14px;background:#fff;color:#5b616e;font-size:13px;font-weight:700">Ekranı sıfırla ve yenile</button>'
      +'</div>';
    var a=document.getElementById("tk-nobet-yenile"); if(a) a.onclick=function(){ location.reload(); };
    var b=document.getElementById("tk-nobet-sifirla"); if(b) b.onclick=function(){
      try{ sessionStorage.clear(); }catch(e){} location.reload(); };
  }
  setTimeout(goster,9000);
})();
</script>

/* 🗂 SERİ — bir ürün birden fazla seride bulunabilir. Kalıcı alan: seriler[] (dizi).
   Eski kayıtlarda tek metinlik "seri" alanı vardı; okurken ona da bakılır.
   Yazarken ikisi de tazelenir (seri = dizinin ilki) ki eski istemciler de bir şey görsün. */
const seriListe=u=>{ if(!u) return [];
  // nesnenin kendi alanı ham kayıttan önce gelir (hesapA kartı ham kaydı taşır)
  const kay=Array.isArray(u.seriler)?u.seriler
          :((u.raw&&Array.isArray(u.raw.seriler))?u.raw.seriler:[]);
  const esk=(u.seri!=null)?u.seri:((u.raw&&u.raw.seri)||"");
  const L=[]; const gor={};
  const kat=v=>{ const t=String(v||"").trim(); if(!t) return; const ak=t.toLocaleLowerCase("tr");
    if(gor[ak]) return; gor[ak]=1; L.push(t); };

/* ═══ 🗓 HAKEDİŞ DÖNEMİ — Cumartesi 00:00 → Cuma 23:59 (deneme.html ile birebir) ═══ */
const HAKEDIS_BAS="2026-08-08";
const HAKEDIS_BAS_MS=new Date(HAKEDIS_BAS+"T00:00:00").getTime();
const haftaBasMs=t=>{ const d=new Date(t); d.setHours(0,0,0,0);
  d.setDate(d.getDate()-((d.getDay()+1)%7)); return d.getTime(); };
const haftaBitMs=t=>haftaBasMs(t)+7*864e5-1;
const haftaKod=t=>{ const b=new Date(haftaBasMs(t));
  return b.getFullYear()+"-"+String(b.getMonth()+1).padStart(2,"0")+"-"+String(b.getDate()).padStart(2,"0"); };
const gunKisa=t=>new Date(t).toLocaleDateString("tr-TR",{day:"2-digit",month:"short"});
const haftaEtiket=t=>gunKisa(haftaBasMs(t))+" – "+gunKisa(haftaBitMs(t));
/* 📅 YILIN KAÇINCI HAFTASI — haftalarımız Cumartesi başladığı için ISO takvimi
   kullanılamıyor; kendi sınırlarımızla sayılıyor. Yılın 1. haftası, ortası (Salı)
   o yıla düşen ilk haftadır; böylece yıl dönümünde ne boşluk ne tekrar oluşur. */
const haftaNo=t=>{ const b=haftaBasMs(t); const orta=b+3*864e5;
  const y=new Date(orta).getFullYear();
  let ilk=haftaBasMs(new Date(y,0,1).getTime());
  if(new Date(ilk+3*864e5).getFullYear()<y) ilk+=7*864e5;
  return Math.round((b-ilk)/(7*864e5))+1; };
const haftaYil=t=>new Date(haftaBasMs(t)+3*864e5).getFullYear();
const haftaAdi=t=>haftaNo(t)+". hafta ("+haftaEtiket(t)+")";

const HAK_DURUM={bildirildi:["Onay bekliyor","#fef3c7","#92400e"],onaylandi:["Ödeme bekliyor","#e0f2fe","#075985"],
  odendi:["Ödendi","#dcfce7","#166534"],ret:["Reddedildi","#ffe4e6","#9f1239"]};

   tema değişince sadece ekranda görünen etiketler değişir. */
const TEMALAR={
  fetih:{ad:"Fetih",ik:"⚔️",alt:"komuta · saha · akın",L:{
    panelAd:"Komuta Merkezi", avatar:"👑", navUs:"Komuta",
    hudBaski:"BASKIDA", hudTabla:"BEKLEYEN", hudCiro:"BUGÜN CİRO",

    dikkat:"DİKKAT", alacakEt:"Sahada açık alacak: ", alacakAlt:"pazarlamacı bazında dökümü Rapor Alacak",
    stokUyari:" üründe stok azaldı", uretimAd:"Üretim", makineYok:"Makine tanımlı değil"},
    I:{panel:"👑",baski:"🖨️",tabla:"🧹",ciro:"💰",uyari:"⚠️",kisi:"🎖️",kisiKart:"👤",konum:"📍",stok:"📦",
       alacak:"🧾",mesaj:"💬",satis:"💰",tahsilat:"🧾",konsinye:"🏬",hediye:"🎁",iade:"↩️",stant:"🎪",
       diplomasi:"🤝",uretim:"🖨️",rota:"🧭",harita:"🗺️",ayarlar:"⚙️",tema:"🎨",cikis:"⏻",ekran:"🖥",telefon:"📱"}},
  kurumsal:{ad:"Kurumsal",ik:"🏢",alt:"panel · personel · saha",L:{
    panelAd:"Yönetim Paneli", avatar:"🏢", navUs:"Panel",

    talepBaslik:"TALEPLER", talepBirim:"",
    sahaBaslik:"PAZARLAMACILAR", sahaBirim:" pazarlamacı",
    ekipBos:"Pazarlamacı yok.", adimBos:"Kayıtlı işlem yok.", kisiKarti:"Pazarlamacı kartını aç ›",
    dikkat:"UYARILAR", alacakEt:"Açık alacak: ", alacakAlt:"pazarlamacı bazında döküm",
    stokUyari:" üründe stok azaldı", uretimAd:"Üretim", makineYok:"Makine tanımlı değil"},
    geo:true,   // ⬛ kurumsal kuralı: renkli emoji YOK — tek/iki tonlu geometrik simge
    I:{panel:"bina",baski:"printer",tabla:"tabla",ciro:"coins",uyari:"uyari",kisi:"kisi",kisiKart:"kisi",konum:"pin",stok:"box",
       alacak:"fis",mesaj:"mesaj",satis:"coins",tahsilat:"fis",konsinye:"store",hediye:"hediye",iade:"iade",stant:"stant",
       diplomasi:"anlasma",uretim:"printer",rota:"pusula",harita:"harita",ayarlar:"ayar",tema:"tema",cikis:"cikis",ekran:"ekran",telefon:"telefon"}}
};
let TEMA="kurumsal"; try{ TEMA=localStorage.getItem("tk_tema")||"kurumsal"; }catch(e){}
const TT=()=>(TEMALAR[TEMA]||TEMALAR.kurumsal).L;
// tema simgesi: kurumsalda geometrik Icn, fetihte emoji
const IK=(key,c,s)=>{ const t=TEMALAR[TEMA]||TEMALAR.kurumsal; const v=(t.I||{})[key]; if(!v) return null;
  return t.geo ? h(Icn,{n:v,c:c||"currentColor",s:s||18})
               : h("span",{style:{fontSize:(s||18)-1,lineHeight:1}},v); };
let BEN_ID=null; try{ BEN_ID=localStorage.getItem("tk_uid"); }catch(e){}   // giriş yapan kullanıcının id'si (index.html giriş kapısı yazar)
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
async function save(coll,obj){ const id=obj.id||uid(); const {id:_,...dd}=obj; await setDoc(doc(db,coll,id),dd,{merge:true}); return id; }
async function remove(coll,id){ await deleteDoc(doc(db,coll,id)); }
// — eski panel ile ORTAK plan yardımcıları (birebir) —
async function planOtele(makineId,plan,oldStartMs,deltaMs,editedId){ if(!deltaMs) return;
  const ds=(plan||[]).filter(p=>p.makineId===makineId&&p.id!==editedId&&new Date(p.baslangic).getTime()>oldStartMs);
  for(const p of ds){ await save("plan",{id:p.id,baslangic:new Date(new Date(p.baslangic).getTime()+deltaMs).toISOString()}); } }
async function planKaydir(makineId,plan,edited){
  const arr=(plan||[]).filter(p=>p.makineId===makineId&&p.id!==edited.id)
    .map(p=>({id:p.id,s:new Date(p.baslangic).getTime(),dk:num(p.sureDk)}));
  arr.push({id:edited.id,s:edited.s,dk:edited.dk});
  arr.sort((a,b)=>a.s-b.s);
  let prevEnd=null;
  for(const j of arr){ let s2=j.s;
    if(prevEnd!=null&&s2<prevEnd) s2=prevEnd;
    if(s2!==j.s) await save("plan",{id:j.id,baslangic:new Date(s2).toISOString()});
    prevEnd=s2+j.dk*60000; } }
async function stokLogla(u,delta,sebep,ekstra){ delta=Math.round(num(delta)); if(!delta||!u||!u.id) return;
  return save("stok_hareket",{urunId:u.id,urunAd:u.ad||"",delta,sebep,tarih:new Date().toISOString(),kullaniciAd:"Komuta",...(ekstra||{})}); }
// makine etiketini no + ad olarak ayır (eski kayıtlarda "01-Praga" biçiminden no türetilir)
const mkParca=mk=>{ const ad=((mk&&mk.ad)||"").trim(); const no=String((mk&&mk.no)||"").trim();
  if(no) return {no,ad};
  const m=ad.match(/^(\d{1,3})\s*[-–—.\s]\s*(.+)$/);
  return m?{no:m[1],ad:m[2].trim()}:{no:"",ad}; };
// filament kodu: F01, F02… ("no" alanından; yoksa addan türetilir)
/* Kod artık marka önekli: ENDER → EN01, EN02 … Eski F02 biçimi de okunur. */
const flKod=fl=>{ const k=String((fl&&fl.kod)||"").trim();
  if(k) return k.toLocaleUpperCase("tr");
  const n=String((fl&&fl.no)||"").trim();
  if(n) return /^[Ff]?\d+$/.test(n)?("F"+n.replace(/^[Ff]/,"").padStart(2,"0")):n.toLocaleUpperCase("tr");
  const m=String((fl&&fl.ad)||"").match(/^[Ff]?(\d{1,3})\s*[-–—._]?\s*/);
  return m?("F"+m[1].padStart(2,"0")):""; };
const flAd=fl=>String((fl&&fl.ad)||"").replace(/^[Ff]?\d{1,3}\s*[-–—._]?\s*/,"").trim()||String((fl&&fl.ad)||"");
/* Marka + renk: yeni kayıtlarda ayrı alanlar, eski kayıtlarda addan çıkarılır
   ("ENDER SİYAH" → marka ENDER, renk SİYAH) */
const flMarka=fl=>{ const m=String((fl&&fl.marka)||"").trim(); if(m) return m;
  const p=flAd(fl).trim().split(/\s+/); return p.length>1?p[0]:""; };
const flRenk=fl=>{ const r=String((fl&&fl.renk)||"").trim(); if(r) return r;
  const p=flAd(fl).trim().split(/\s+/); return p.length>1?p.slice(1).join(" "):flAd(fl); };
/* Filament türü — en üst kırılım. Girilmemişse addan tanınır. */
const FL_TUR=["PLA","PLA+","PLA Silk","PETG","ABS","ASA","TPU"];
const FL_TUR_YOK="Türü girilmemiş";
const flTur=fl=>{ const t=String((fl&&fl.tur)||"").trim(); if(t) return t;
  /* "Silk" → tr büyütmede "SİLK" olur; aranan sözcükler ASCII olduğu için İ→I çevrilir */
  const a=(String((fl&&fl.ad)||"")+" "+String((fl&&fl.marka)||"")+" "+String((fl&&fl.renk)||""))
    .toLocaleUpperCase("tr").replace(/İ/g,"I");
  const bul=["PLA+","PLA SILK","PETG","ABS","ASA","TPU","PLA"].find(x=>a.indexOf(x)>=0);
  if(!bul) return "";
  return bul==="PLA SILK"?"PLA Silk":bul; };
/* Marka kodu ELLE belirlenir; renkler bu kodun üzerinden numaralanır.
   Kod verilmemişse ilk iki harf öneri olur — ENDER → EN, FİLAMİX → Fİ */
const flKodTemiz=k=>String(k||"").trim().toLocaleUpperCase("tr")
  .replace(/[^0-9A-ZÇĞİÖŞÜ]/g,"").slice(0,4);
const flOnek=m=>flKodTemiz(m).slice(0,2)||"FL";
const flAyni=(a,b)=>String(a||"").trim().toLocaleLowerCase("tr")
  ===String(b||"").trim().toLocaleLowerCase("tr");
/* markanın kayıtlı kodu — o markanın herhangi bir filamentinde duruyor */
const flMarkaKod=(list,marka)=>{
  const bul=(list||[]).find(f=>f&&flAyni(flMarka(f),marka)&&flKodTemiz(f.markaKod));
  return bul?flKodTemiz(bul.markaKod):flOnek(marka); };
/* markaların kod defteri: {marka, kod, elle} */
const flMarkaKodlari=list=>flGruplar(list).filter(g=>g.marka&&g.marka!=="Diğer")
  .map(g=>({marka:g.marka,kod:flMarkaKod(list,g.marka),say:g.list.length,
    elle:g.list.some(f=>flKodTemiz(f.markaKod))}));
/* Aynı koddaki en büyük numaradan bir sonrası — kod çakışmasın */
const flSonraKod=(list,marka,markaKod)=>{
  const on=flKodTemiz(markaKod)||flMarkaKod(list,marka); let en=0;
  (list||[]).forEach(f=>{ const k=flKod(f);
    if(k.indexOf(on)===0){ const n=parseInt(k.slice(on.length),10); if(n>en) en=n; } });
  return on+String(en+1).padStart(2,"0"); };
/* markaya göre grup — çok çeşit olan marka üstte */
const flGruplar=list=>{ const g={};
  (list||[]).forEach(f=>{ const m=flMarka(f)||"Diğer"; (g[m]=g[m]||[]).push(f); });
  return Object.keys(g).sort((a,b)=>g[b].length-g[a].length||a.localeCompare(b,"tr"))
    .map(m=>({marka:m,list:g[m].slice().sort((a,b)=>flKod(a).localeCompare(flKod(b),"tr")
      ||flRenk(a).localeCompare(flRenk(b),"tr")),
      kg:g[m].reduce((s2,f)=>s2+num(f.stokKg),0),
      kgFiyat:(()=>{ const v=g[m].map(f=>num(f.kgFiyat)).filter(x=>x>0);
        return v.length?Math.round(v.reduce((s2,x)=>s2+x,0)/v.length):0; })()})); };
/* tür → marka → renk: iki katmanlı kırılım */
const flTurGrup=list=>{ const g={};
  (list||[]).forEach(f=>{ const t=flTur(f)||FL_TUR_YOK; (g[t]=g[t]||[]).push(f); });
  const sira=t=>{ if(t===FL_TUR_YOK) return 99; const i=FL_TUR.indexOf(t); return i<0?50:i; };
  return Object.keys(g).sort((a,b)=>sira(a)-sira(b)||a.localeCompare(b,"tr"))
    .map(t=>({tur:t,say:g[t].length,kg:g[t].reduce((s2,f)=>s2+num(f.stokKg),0),
      markalar:flGruplar(g[t])})); };
/* Filamentleri marka koduyla baştan numaralar — karışmış kodları toparlar.
   yalnizMarka verilirse sadece o markanın renkleri yeniden numaralanır. */
const flYenidenKodla=(list,yalnizMarka,yeniKod)=>{ const say={}; const out=[];
  flTurGrup(list).forEach(tg=>tg.markalar.forEach(mg=>{
    const marka=mg.marka==="Diğer"?"":mg.marka;
    if(yalnizMarka!=null&&!flAyni(marka,yalnizMarka)) return;
    const on=(yalnizMarka!=null&&flKodTemiz(yeniKod))?flKodTemiz(yeniKod)
      :(marka?flMarkaKod(list,marka):"FL");
    mg.list.forEach(f=>{ say[on]=(say[on]||0)+1;
      const kod=on+String(say[on]).padStart(2,"0");

function haversineKm(aLat,aLng,bLat,bLng){ const R=6371, dLa=(bLat-aLat)*Math.PI/180, dLo=(bLng-aLng)*Math.PI/180,
  la1=aLat*Math.PI/180, la2=bLat*Math.PI/180;
  const s=Math.sin(dLa/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }
function pointInPoly(pt,poly){ const x=pt[1],y=pt[0]; let ic=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][1], yi=poly[i][0], xj=poly[j][1], yj=poly[j][0];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ic=!ic; }
  return ic; }

// geciken başlamamış iş "şimdi"ye kayar; üzerinden başka iş başlatılmışsa (geride) sayılmaz
function planEffBas(plan,now){
  const m={}, byMak={};
  (plan||[]).forEach(p=>{ (byMak[p.makineId||"?"]=byMak[p.makineId||"?"]||[]).push(p); });
  Object.values(byMak).forEach(arr=>{
    arr.sort((a,b)=>new Date(a.baslangic)-new Date(b.baslangic));
    let sonBas=-Infinity;
    arr.forEach(p=>{ if(p.basladi){ const gs=new Date(p.gercekBaslangic||p.baslangic).getTime(); if(gs>sonBas) sonBas=gs; } });
    let cursor=-Infinity;
    arr.forEach(p=>{ const ps=new Date(p.baslangic).getTime(), dur=num(p.sureDk)*60000;
      /* 🔁 "geride" artık iş emrini gizlemiyor: geç kalmış iş kuyruğun önüne alınıp
         normal sırayla diziliyor. Eskiden bu bayrak, üzerinden başka iş başlatılmış
         bekleyen işleri takvimden tamamen düşürüyordu. */
      const geride=false;
      let s;
      if(p.basladi){ s=new Date(p.gercekBaslangic||p.baslangic).getTime(); }
      else if(geride) s=ps;
      else { s=Math.max(ps,cursor); if(ps<now) s=Math.max(now,cursor); }
      if(!geride) cursor=Math.max(cursor,s+dur);
      if(p.id) m[p.id]={s,geride};
    });
  });
  return m;
}

// makine zaman çizelgesi — efektif konum + boş/kayıp/gecikme (index.html makineTimeline ile birebir)
function makineTimeline(makineId,plan,baslaMs,bitMs,now){
  now=now||Date.now();
  const all=(plan||[]).filter(p=>p.makineId===makineId).map(p=>({p,ps:new Date(p.baslangic).getTime(),dk:num(p.sureDk)})).sort((a,b)=>a.ps-b.ps);
  let sonBaslamaMs=-Infinity;
  all.forEach(({p,ps})=>{ if(p.basladi){ const gs=p.gercekBaslangic?new Date(p.gercekBaslangic).getTime():ps; if(gs>sonBaslamaMs) sonBaslamaMs=gs; } });
  let cursor=-Infinity;
  const eff=all.map(({p,ps,dk})=>{ const geride=false; let s;   /* bkz. planEffBas — bekleyen iş gizlenmez */
    if(p.basladi){ s=ps; } else if(geride){ s=ps; } else { s=Math.max(ps,cursor); if(ps<now) s=Math.max(now,cursor); }
    const e=s+dk*60000; if(!geride) cursor=Math.max(cursor,e); return {p,s,e,kaymis:s!==ps,geride}; });
  const js=eff.filter(x=>x.e>baslaMs&&x.s<bitMs).sort((a,b)=>a.s-b.s);
  let printMs=0; js.forEach(x=>{ printMs+=Math.min(bitMs,x.e)-Math.max(baslaMs,x.s); });
  const bos=[]; let cur=baslaMs;
  js.forEach(x=>{ const s=Math.max(baslaMs,x.s); if(s>cur) bos.push({start:cur,end:s}); cur=Math.max(cur,Math.min(bitMs,x.e)); });
  if(cur<bitMs) bos.push({start:cur,end:bitMs});
  let kayipMs=0; bos.forEach(b=>{ const pe=Math.min(b.end,now||0); if(pe>b.start) kayipMs+=pe-b.start; });
  let gecikmeMs=0,gecikmeSayi=0; js.forEach(x=>{ const base=x.p.planSureDk!=null?num(x.p.planSureDk):num(x.p.sureDk); const g=(num(x.p.sureDk)-base)*60000; if(g>0){ gecikmeMs+=g; gecikmeSayi++; } });
  const bosMs=(bitMs-baslaMs)-printMs;
  return {js,eff,bos,printMs,bosMs,kayipMs,bosGelecekMs:bosMs-kayipMs,gecikmeMs,gecikmeSayi};
}

/* bir tarif bloğu = {tablaAdet, tur:{makine türü→kalem}, varsayilan}. Parçalı üründe

function baskiBlokOku(b){

     ürünün rengini belirler, filamenti planlama sırasında seçilir. Bu yüzden

  const filOku=a=>(Array.isArray(a)?a:[]).filter(f=>f&&num(f.gram)>0&&(f.filamentId||f.degisken))

  const kalem=o=>{ const fil=filOku(o&&o.filament);
    return {sureDk:Math.max(0,Math.round(num(o&&o.sureDk))),filament:fil,
      gram:fil.reduce((s2,f)=>s2+f.gram,0)}; };
  const tur={};
  if(b&&b.tur&&typeof b.tur==="object") Object.keys(b.tur).forEach(k=>{
    const c=kalem(b.tur[k]); if(c.sureDk>0||c.gram>0) tur[String(k).trim()]=c; });
  /* eski biçim (süre türe göre, filament ortak) — türlere dağıtılarak okunur */
  if(!Object.keys(tur).length&&b&&b.sure&&typeof b.sure==="object"){
    const ortak=filOku(b.filament); const gr=ortak.reduce((s2,f)=>s2+f.gram,0);
    Object.keys(b.sure).forEach(k=>{ const s3=num(b.sure[k]);
      if(s3>0) tur[String(k).trim()]={sureDk:Math.round(s3),filament:ortak,gram:gr}; }); }
  const vs=kalem((b&&b.varsayilan)||{sureDk:num(b&&b.varsayilanSureDk),filament:b&&b.filament});
  return {tablaAdet:Math.max(1,Math.round(num(b&&b.tablaAdet)||1)),tur,varsayilan:vs,
    turler:Object.keys(tur)};
}
const baskiBlokDolu=x=>!!x&&(x.turler.length>0||x.varsayilan.sureDk>0||x.varsayilan.gram>0);
function baskiOku(u){
  const b=(u&&u.baskiBilgi)||null; if(!b) return null;
  const ana=baskiBlokOku(b);
  /* parça parça tarif — her parçanın kendi tablası, süresi, filamenti */
  const parca={}; const parcaAdlar=[];
  if(b.parca&&typeof b.parca==="object") Object.keys(b.parca).forEach(k=>{
    const x=baskiBlokOku(b.parca[k]);
    if(baskiBlokDolu(x)){ parca[k]=x; parcaAdlar.push(k); } });
  const ayri=!!b.ayri&&parcaAdlar.length>0;
  if(!ayri&&!baskiBlokDolu(ana)) return null;
  return {...ana,ayri,parca,parcaAdlar,not:b.not||""};
}
/* Makine türüne göre çözülmüş tarif. Tür tanımlı değilse varsayılana, o da
   yoksa tanımlı türlerin ortalamasına düşer (filament en çok tüketen türden —
   çeşitleri ortalamak yanıltıcı olurdu). */
function baskiBlokCoz(bb,tur){
  if(!bb) return null;
  const t=String(tur||"").trim();
  if(t&&bb.tur[t]) return {...bb.tur[t],tablaAdet:bb.tablaAdet,kaynak:t};
  const v=bb.varsayilan;
  if(v&&(v.sureDk>0||v.gram>0)) return {...v,tablaAdet:bb.tablaAdet,kaynak:"varsayılan"};
  if(bb.turler.length){
    /* süresi girilmemiş tür ortalamayı aşağı çekmesin */
    const sl=bb.turler.filter(x=>bb.tur[x].sureDk>0);
    const sureDk=sl.length?Math.round(sl.reduce((s2,x)=>s2+bb.tur[x].sureDk,0)/sl.length):0;
    const en=bb.turler.slice().sort((a,b2)=>bb.tur[b2].gram-bb.tur[a].gram)[0];
    return {sureDk,filament:bb.tur[en].filament,gram:bb.tur[en].gram,
      tablaAdet:bb.tablaAdet,kaynak:"ortalama"}; }
  return null;
}
/* parcaAd verilirse o parçanın tarifi; parçalı üründe parça verilmezse BİR TAKIM
   (her parçadan gerektiği kadar) için toplam süre/gram döner */
function baskiCoz(bb,tur,parcaAd,u){
  if(!bb) return null;
  if(!bb.ayri) return baskiBlokCoz(bb,tur);
  const p=String(parcaAd||"").trim();
  if(p&&bb.parca[p]) return baskiBlokCoz(bb.parca[p],tur);
  /* takım toplamı: her parça kendi tablasından, takımda gereken adet kadar */
  let sureDk=0; const fg={}; let eksik=false; let kay="";
  bb.parcaAdlar.forEach(k=>{ const c=baskiBlokCoz(bb.parca[k],tur);
    if(!c||!(c.sureDk>0)){ eksik=true; return; }
    const cap=Math.max(1,num(c.tablaAdet));
    const ger=u?gerekenP(u,k):1;
    sureDk+=c.sureDk/cap*ger;
    c.filament.forEach(f=>{ fg[f.filamentId]=(fg[f.filamentId]||0)+num(f.gram)/cap*ger; });
    if(!kay) kay=c.kaynak; });
  if(eksik||!(sureDk>0)) return null;
  const filament=Object.keys(fg).slice(0,BASKI_FIL_MAX)
    .map(id=>({filamentId:id,gram:Math.round(fg[id]*10)/10}));
  return {sureDk:Math.round(sureDk),filament,gram:filament.reduce((s2,f)=>s2+f.gram,0),
    tablaAdet:1,kaynak:kay||"takım",takim:true};
}
/* ürün kartındaki tek satırlık özet */
function baskiOzet(bb){
  if(!bb) return "girilmemiş";
  if(bb.ayri){
    const gr=[]; let tSet={};
    bb.parcaAdlar.forEach(k=>{ const p=bb.parca[k];
      p.turler.forEach(t=>{ tSet[t]=1; if(p.tur[t].gram>0) gr.push(p.tur[t].gram); });
      if(p.varsayilan.gram>0) gr.push(p.varsayilan.gram); });
    const par=[bb.parcaAdlar.length+" parça ayrı tabla"];
    const tn=Object.keys(tSet).length;
    if(tn) par.push(tn+" makine türü");
    if(gr.length){ const en=Math.min.apply(null,gr), us=Math.max.apply(null,gr);
      par.push(en===us?(Math.round(en*10)/10+" gr"):(Math.round(en*10)/10+"–"+Math.round(us*10)/10+" gr")); }
    return par.join(" · ");
  }
  const par=[bb.tablaAdet+" ad/tabla"];
  const n=bb.turler.length;
  if(n) par.push(n+" makine türü");
  else if(bb.varsayilan.sureDk>0||bb.varsayilan.gram>0) par.push("tek tarif");
  const gr=bb.turler.map(t=>bb.tur[t].gram).filter(x=>x>0);
  if(gr.length){ const en=Math.min.apply(null,gr), us=Math.max.apply(null,gr);
    par.push(en===us?(Math.round(en*10)/10+" gr"):(Math.round(en*10)/10+"–"+Math.round(us*10)/10+" gr")); }
  else if(bb.varsayilan.gram>0) par.push(Math.round(bb.varsayilan.gram*10)/10+" gr");
  return par.join(" · ");
}

/* ————— ÜRETİM PLANLAMA ARACI —————
   Bir "plan" kaydı = bir tabla baskısıdır: sureDk sürede adet kadar ürün (parçalı
   üründe parcaSayi kadar parça) çıkar. Geçmiş baskılardan ürün başına dakika/gram
   ve bir tablaya kaç parça sığdığı türetilir; planlama bunun üzerine kurulur. */
const PLAN_ORNEK_AZ=2;   // bu sayıdan az örnekle çıkarılan birim "zayıf" sayılır
function planBirim(urunler,plan,filamentler,tur,makineler){
  const P=(plan||[]).filter(p=>num(p.sureDk)>0&&num(p.adet)>0);
  const byU={}; P.forEach(p=>{ const k=p.urunId||""; if(k) (byU[k]=byU[k]||[]).push(p); });
  /* Tarifi olmayan üründe geçmiş baskılar makine TÜRÜNE göre süzülür: aynı ürün
     A1'de başka, PS1'de başka sürede ve gramajda çıkıyor. O türde yeterli kayıt
     yoksa tüm geçmişe düşülür. */
  const mkTur={}; (makineler||[]).forEach(m=>{ if(m&&m.id) mkTur[m.id]=makTur(m); });
  const T=String(tur||"").trim();
  const turSuz=arr=>{ if(!T||!Object.keys(mkTur).length) return arr;
    const s=(arr||[]).filter(p=>mkTur[p.makineId]===T);
    return s.length>=PLAN_ORNEK_AZ?s:arr; };
  // medyandan aşırı sapanı ele — tek bir hatalı kayıt ortalamayı bozmasın (stok hesabıyla aynı kural)
  const medEle=(arr,key)=>{ if(arr.length<3) return arr;

  const cok=m=>Object.keys(m).sort((a,b)=>m[b]-m[a])[0]||"";

  (urunler||[]).forEach(u=>{

      const prc=((u.parcalar||[]).length?u.parcalar:bb.parcaAdlar).slice();
      const rows=[]; let eksik=false; const kay=[]; const tSet={};
      prc.forEach(pt=>{

        const c2=pb?baskiBlokCoz(pb,tur):null;
        if(!c2||!(c2.sureDk>0)){ eksik=true; rows.push({ad:pt,ger:gerekenP(u,pt),eksik:true,ornek:0}); return; }
        const cap2=Math.max(1,num(c2.tablaAdet)); kay.push(c2.kaynak);
        rows.push({ad:pt,ger:gerekenP(u,pt),dkParca:c2.sureDk/cap2,gramParca:c2.gram/cap2,
          plakaAdet:cap2,filamentId:(c2.filament[0]||{}).filamentId||"",
          filList:(()=>{let sr=0;return c2.filament.map(f=>({filamentId:f.filamentId,gramParca:num(f.gram)/cap2,
            degisken:!!f.degisken,rol:f.degisken?filRolAd(f,sr++):""}));})(),ornek:0}); });
      const ok2=!eksik&&rows.length>0;
      out[u.id]={ok:ok2,parcali:true,tarif:true,ayri:true,ornek:0,
        parcalar:rows,eksikParca:rows.filter(r=>r.eksik).map(r=>r.ad),
        tarifKaynak:kay[0]||"",turSay:Object.keys(tSet).length,
        dk:ok2?rows.reduce((s2,r)=>s2+num(r.dkParca)*num(r.ger),0):0,
        gram:ok2?rows.reduce((s2,r)=>s2+num(r.gramParca)*num(r.ger),0):0};
      return;
    }
    const cz=baskiCoz(bb,tur);
    if(cz&&(cz.sureDk>0||cz.gram>0)){
      const cap=Math.max(1,num(cz.tablaAdet));
      out[u.id]={ok:cz.sureDk>0,parcali:false,tarif:true,ornek:0,eksikParca:[],
        dk:cz.sureDk/cap,gram:cz.gram/cap,tarifKaynak:cz.kaynak,turSay:bb.turler.length,
        parcalar:[{ad:u.ad||"ürün",ger:1,dkParca:cz.sureDk/cap,gramParca:cz.gram/cap,
          plakaAdet:cap,filamentId:(cz.filament[0]||{}).filamentId||"",
          filList:(()=>{let sr=0;return cz.filament.map(f=>({filamentId:f.filamentId,gramParca:num(f.gram)/cap,
            degisken:!!f.degisken,rol:f.degisken?filRolAd(f,sr++):""}));})(),ornek:0}]};

          const pieces=num(kk[part]); if(TP<=0||pieces<=0) return;
          conts.push({dk:num(p.sureDk)*pieces/TP,gram:num(p.gram)*pieces/TP,pieces,fil:p.filamentId||anaFil}); });
        const use=medEle(conts,x=>x.dk/Math.max(1,x.pieces));
        const wp=use.reduce((s2,x)=>s2+x.pieces,0);
        if(wp<=0){ eksik=true; rows.push({ad:part,ger:gerekenP(u,part),eksik:true,ornek:0}); continue; }
        const fp={}; use.forEach(x=>{ if(x.fil) fp[x.fil]=(fp[x.fil]||0)+x.pieces; });
        rows.push({ad:part,ger:gerekenP(u,part),
          dkParca:use.reduce((s2,x)=>s2+x.dk,0)/wp,
          gramParca:use.reduce((s2,x)=>s2+x.gram,0)/wp,
          plakaAdet:Math.max(1,Math.round(wp/use.length)),
          filamentId:cok(fp)||anaFil,ornek:use.length});
      }
      const ok=!eksik&&rows.length>0;
      out[u.id]={ok,parcali:true,parcalar:rows,ornek:prints.length,
        dk:ok?rows.reduce((s2,r)=>s2+num(r.dkParca)*num(r.ger),0):0,
        gram:ok?rows.reduce((s2,r)=>s2+num(r.gramParca)*num(r.ger),0):0,
        eksikParca:rows.filter(r=>r.eksik).map(r=>r.ad)};
    } else {
      const use=medEle(prints,p=>num(p.sureDk)/Math.max(1,num(p.adet)));
      const ad=use.reduce((s2,p)=>s2+num(p.adet),0);
      if(ad<=0){ out[u.id]={ok:false,parcali:false,parcalar:[],dk:0,gram:0,ornek:0,eksikParca:[]}; return; }
      const dk=use.reduce((s2,p)=>s2+num(p.sureDk),0)/ad;
      out[u.id]={ok:dk>0,parcali:false,ornek:use.length,eksikParca:[],
        parcalar:[{ad:u.ad||"ürün",ger:1,dkParca:dk,gramParca:use.reduce((s2,p)=>s2+num(p.gram),0)/ad,
          plakaAdet:Math.max(1,Math.round(ad/use.length)),filamentId:anaFil,ornek:use.length}],
        dk,gram:use.reduce((s2,p)=>s2+num(p.gram),0)/ad};
    }
  });

}
/* Tabla tabla iş listesi: tam tabla plakaDk sürer, artan parça oranla.
   Bekleme (tabla değişimi/soğuma) her tablanın ardına eklenir. */
function planIsleri(secim,BM,bekleme){
  const isler=[]; const bk=Math.max(0,num(bekleme));
  (secim||[]).forEach((it,ix)=>{ const u=it.u||{}; const b=BM[u.id]; const n=Math.max(0,Math.round(num(it.adet)));
    if(!b||!b.ok||n<=0) return;
    /* aynı ürünün renk çeşitleri ayrı satır gelir — anahtarları çakışmasın */
    const renk=it.renk||null, vk=it.vk!=null?String(it.vk):String(ix);
    const renkAd=it.renkAd||"";
    b.parcalar.forEach((r,ri)=>{ const parca=n*Math.max(1,num(r.ger)); const cap=Math.max(1,num(r.plakaAdet));
      const tam=Math.floor(parca/cap), kalan=parca-tam*cap; let sira=0;
      /* filament kırılımı liste: tarifli üründe 4 çeşide kadar, geçmişten
         türetilende tek çeşit. Özet bu listeden toplanır. */
      const ekle2=(ad2,bDk,gr)=>{
        /* değişken yuvaya planlamada seçilen renk konur; sabit yuva olduğu gibi kalır */
        const filPay=(r.filList&&r.filList.length)
          ? r.filList.map(f=>{ const id=(f.degisken&&renk&&renk[f.rol])?renk[f.rol]:f.filamentId;
              return {filamentId:id||"",gram:num(f.gramParca)*ad2,
                degisken:!!f.degisken,rol:f.rol||""}; })
          : [{filamentId:r.filamentId||"",gram:gr}];
        /* anahtar tür türe aynı — aynı iş farklı makinede farklı süre/gram alır */
        isler.push({key:(u.id||u.ad||"?")+"@"+vk+"#"+ri+"#"+(sira++),urunId:u.id||"",
          urun:u.ad||"?",parca:r.ad,adet:ad2,baski:bDk,dk:bDk+bk,gram:gr,renkAd,
          filamentId:r.filamentId||"",filPay}); };
      for(let i=0;i<tam;i++) ekle2(cap,num(r.dkParca)*cap,num(r.gramParca)*cap);
      if(kalan>0) ekle2(kalan,num(r.dkParca)*kalan,num(r.gramParca)*kalan); }); });
  return isler;
}
/* ————— HEDEFE GÖRE DAĞITIM —————
   Aynı iş A1'de başka, PS1'de başka sürede ve başka gramajda çıkıyor. Bu yüzden
   makine türü elle seçilmez: her iş, seçilen hedefe göre kendi makinesini bulur. */
const PLAN_HEDEF=[{k:"hiz",ad:"🚀 En hızlı",ip:"en kısa sürede biter"},
  {k:"filament",ad:"🧵 En az filament",ip:"en az gramajla basar"},
  {k:"denge",ad:"⚖️ Dengeli",ip:"süre ve filament birlikte"}];
/* Her iş için tür tür süre/gram — tek iş listesi, çok değerli */
function planIsleriCok(secim,BMT,turler,bekleme){
  const per={}; const sira=[];
  (turler||[]).forEach(t=>{ if(!BMT[t]) return;
    planIsleri(secim,BMT[t],bekleme).forEach(j=>{
      let o=per[j.key];
      if(!o){ o=per[j.key]={key:j.key,urunId:j.urunId,urun:j.urun,parca:j.parca,adet:j.adet,
        renkAd:j.renkAd||"",tur:{}}; sira.push(o); }
      o.tur[t]={baski:j.baski,dk:j.dk,gram:j.gram,filPay:j.filPay}; }); });
  return sira.filter(j=>Object.keys(j.tur).length);
}
/* Hedefe göre tür sırası — makine sayısı kısıtlıysa önce işe yarayan tür çalışır */
function planTurSira(TURLER,BMT,secim,hedef){
  const P={};
  (TURLER||[]).forEach(t=>{ const BM=BMT[t.tur]||{}; let dk=0,gr=0,n=0;
    (secim||[]).forEach(x=>{ const b=BM[(x.u||{}).id]; const ad=Math.max(0,num(x.adet)||num(x.oran));
      if(!b||!b.ok||ad<=0) return; dk+=b.dk*ad; gr+=b.gram*ad; n+=ad; });
    P[t.tur]=n?{dk:dk/n,gram:gr/n}:null; });
  const var_=Object.keys(P).filter(t=>P[t]);
  const enDk=var_.length?Math.min.apply(null,var_.map(t=>P[t].dk)):0;
  const enGr=var_.length?Math.min.apply(null,var_.map(t=>P[t].gram)):0;
  const oran=(v,e)=>(e>0?v/e:1);
  const sk=t=>{ const p=P[t]; if(!p) return 1e9;
    const d=oran(p.dk,enDk), g=oran(p.gram,enGr);
    if(hedef==="filament") return g*100+d;
    if(hedef==="denge") return d+g;
    return d*100+g; };
  const say=t=>((TURLER||[]).find(x=>x.tur===t)||{}).say||0;
  return (TURLER||[]).map(t=>t.tur).sort((a,b)=>sk(a)-sk(b)||say(b)-say(a));
}
/* Çalışacak makine parkı: hedefin sevdiği türden başlayarak doldurulur.
   makineler verilirse yuvalar GERÇEK makinelere bağlanır (takvime aktarım için). */
function planMakineler(TURLER,adet,siraTur,makineler){
  const S=(siraTur&&siraTur.length)?siraTur:(TURLER||[]).map(t=>t.tur);
  const havuz=[];
  const turMak={};
  (makineler||[]).forEach(m=>{ const t=makTur(m); (turMak[t]=turMak[t]||[]).push(m); });
  S.forEach(t=>{ const gercek=turMak[t]||[];
    const n=((TURLER||[]).find(x=>x.tur===t)||{}).say||0;
    for(let i=0;i<n;i++){ const m=gercek[i];
      havuz.push({tur:t,id:(m&&m.id)||"",ad:(m&&m.ad)||""}); } });
  if(!havuz.length) havuz.push({tur:"",id:"",ad:""});
  const N=Math.max(1,Math.min(havuz.length,Math.round(num(adet))||havuz.length));
  return havuz.slice(0,N).map((x,i)=>({no:i+1,tur:x.tur,id:x.id,ad:x.ad}));
}
/* ————— TAKVİME AKTARIM —————
   Planı gerçek baskı kayıtlarına çevirir: her makinenin kuyruğu seçilen andan
   itibaren arka arkaya dizilir; bekleme ve makara değişimi araya girer.
   Makinede iş varsa onun arkasından başlar — üst üste binmez. */
function planTakvim(ozet,baslangicMs,bekleme,degisimDk,plan){
  if(!ozet||!ozet.isler||!ozet.isler.length) return [];
  const bas0=num(baslangicMs)||Date.now();
  const bk=Math.max(0,num(bekleme)), dg=Math.max(0,num(degisimDk));
  const M=ozet.makList||[];
  /* makinenin mevcut kuyruğu ne zaman biter */
  const doluya=id=>{ let en=bas0;
    (plan||[]).forEach(pp=>{ if(pp.makineId!==id) return;
      const b2=new Date(pp.gercekBaslangic||pp.baslangic).getTime();
      if(!b2) return; const e2=b2+num(pp.sureDk)*60000; if(e2>en) en=e2; });
    return en; };
  const saat={}; const out=[];
  ozet.isler.slice().sort((a,b2)=>(a.mak-b2.mak)||(a.sira-b2.sira)).forEach(j=>{
    const m=M[j.mak]||{};
    if(saat[j.mak]==null) saat[j.mak]=m.id?doluya(m.id):bas0;
    /* makara değişimi bu tabladan ÖNCE yapılır */
    if(num(j.degisti)>0) saat[j.mak]+=num(j.degisti)*dg*60000;
    const bs=saat[j.mak];
    out.push({...j,makineId:m.id||"",makineAd:m.ad||"",baslangic:new Date(bs).toISOString(),
      bitis:new Date(bs+num(j.baski)*60000).toISOString()});
    saat[j.mak]=bs+num(j.baski)*60000+bk*60000; });
  return out;
}
/* aktarım kaydı: takvime yazılacak baskı kaydı */
const planKayit=(x,parti,urunler)=>{
  const u=(urunler||[]).find(y=>y.id===x.urunId)||null;
  const parcali=!!(u&&(u.parcalar||[]).length&&x.parca&&u.parcalar.indexOf(x.parca)>=0);
  return {makineId:x.makineId,ad:x.urun,urunId:x.urunId||"",
    parcaAd:parcali?x.parca:"",parcaAdlar:parcali?[x.parca]:[],
    adet:Math.max(1,Math.round(num(x.adet))),
    baslangic:x.baslangic,sureDk:Math.round(num(x.baski)),planSureDk:Math.round(num(x.baski)),
    gram:Math.round(num(x.gram)*10)/10,
    filamentId:((x.filPay||[])[0]||{}).filamentId||"",
    filList:(x.filPay||[]).filter(f=>f&&f.filamentId&&num(f.gram)>0)
      .map(f=>({filamentId:f.filamentId,gram:Math.round(num(f.gram)*10)/10})),
    ams:true,not:x.renkAd?("🎨 "+x.renkAd):"",basladi:false,parti}; };
/* ————— FİLAMENT DEĞİŞİMİ —————
   Bir tabladan diğerine geçerken makinedeki makara değişiyorsa vakit kaybı olur.
   Bu yüzden aynı filamentleri kullanan işler arka arkaya dizilir. */
const PLAN_DEGISIM_DK=10;                                  // makara başına ortalama değişim
/* ————— MAKARA (RULO) PLANI —————
   Bir planı uygulamak için kaç rulo gerektiği, toplam gramı ruloya bölmekle bulunmaz:
   aynı filament aynı anda birkaç makinede döndüğü için HER MAKİNEYE ayrı bir rulo takılır.
   Bu yüzden ihtiyaç makine makine hesaplanır, sonra toplanır. */
const RULO_GRAM=1000;                                      // varsayılan makara ağırlığı (gram)
const flRuloGram=fl=>{ const g=num(fl&&fl.ruloGram); return g>0?g:RULO_GRAM; };
function makaraPlani(isler,filamentler){
  const flById={}; (filamentler||[]).forEach(f=>{ if(f&&f.id) flById[f.id]=f; });
  const ruloOf=id=>{ const f=flById[id]; return f?flRuloGram(f):RULO_GRAM; };
  const AYR="::";
  const zin={}, mkAd={};
  (isler||[]).forEach(x=>{ if(!x) return;
    const mid=String(x.makineId||("#"+x.mak));
    if(x.makineAd&&!mkAd[mid]) mkAd[mid]=x.makineAd;
    (x.filPay||x.filList||[]).forEach(f=>{ if(!f||!f.filamentId||!(num(f.gram)>0)) return;
      const k=mid+AYR+f.filamentId;
      (zin[k]=zin[k]||[]).push({gram:num(f.gram),t:x.baslangic||null,is:x.urun||x.ad||""}); }); });
  const makine={}, filament={}, olay=[];
  Object.keys(zin).forEach(k=>{ const i=k.indexOf(AYR); const mid=k.slice(0,i), fid=k.slice(i+AYR.length);
    const R=ruloOf(fid); const L=zin[k];
    if(L[0]&&L[0].t) L.sort((a,b)=>new Date(a.t)-new Date(b.t));
    const gram=L.reduce((s2,x)=>s2+x.gram,0);
    const rulo=Math.max(1,Math.ceil(gram/R));
    const m=makine[mid]=makine[mid]||{makineId:mid,ad:mkAd[mid]||"",kalem:[],gram:0,rulo:0};
    m.kalem.push({filamentId:fid,gram,rulo}); m.gram+=gram; m.rulo+=rulo;
    const f=filament[fid]=filament[fid]||{filamentId:fid,gram:0,rulo:0,makineSay:0,ruloGram:R};
    f.gram+=gram; f.rulo+=rulo; f.makineSay++;
    /* bu makinedeki makara ne zaman bitecek — kümülatif tüketim ruloyu aşınca yenisi takılır */
    let kalan=R, no=1;
    L.forEach(x=>{ if(x.gram>kalan){ no++; olay.push({makineId:mid,ad:mkAd[mid]||"",filamentId:fid,no,t:x.t,is:x.is}); kalan=R; }
      kalan-=x.gram; }); });
  const filList=Object.values(filament).sort((a,b)=>b.gram-a.gram);
  filList.forEach(f=>{ f.naifRulo=Math.max(1,Math.ceil(f.gram/f.ruloGram)); });
  const makList=Object.values(makine).sort((a,b)=>b.gram-a.gram);
  makList.forEach(m=>m.kalem.sort((a,b)=>b.gram-a.gram));
  olay.sort((a,b)=>(a.t&&b.t)?(new Date(a.t)-new Date(b.t)):0);
  return {filList,makList,olay,
    ruloTop:filList.reduce((s2,f)=>s2+f.rulo,0),
    naifTop:filList.reduce((s2,f)=>s2+f.naifRulo,0),
    gramTop:filList.reduce((s2,f)=>s2+f.gram,0)};
}
/* planlama özetindeki işleri makara planının beklediği biçime çevirir */
const makaraOzetten=(ozet,filamentler)=>{ if(!ozet) return null;
  const ML=ozet.makList||[];
  return makaraPlani((ozet.isler||[]).map(x=>{ const m=ML[x.mak]||{};
    return {makineId:m.id||("#"+x.mak),makineAd:m.ad||m.tur||("Makine "+(num(x.mak)+1)),
      filPay:x.filPay,urun:x.urun}; }),filamentler); };
const filSet=v=>{ const s={};
  ((v&&v.filPay)||[]).forEach(f=>{ if(f.filamentId) s[f.filamentId]=1; }); return s; };
const filAnahtar=v=>Object.keys(filSet(v)).sort().join("|");
/* eskiden yeniye kaç makara değişir — yeni kümede olup eskide olmayanlar */
const filDegisim=(yeni,eski)=>{ if(!eski) return 0;
  return Object.keys(yeni).filter(x=>!eski[x]).length; };
/* Bir makinenin kuyruğunu en az makara değişimiyle sırala: en çok işi olan
   filament kümesinden başla, her adımda en çok ortak makarası olana geç. */
function planKuyrukSirala(kuyruk){
  const grup={}, sira=[];
  (kuyruk||[]).forEach(x=>{ const k=filAnahtar(x.v);
    if(!grup[k]){ grup[k]={set:filSet(x.v),isler:[]}; sira.push(k); }
    grup[k].isler.push(x); });
  if(sira.length<2) return (kuyruk||[]).slice();
  const kalan=sira.slice();
  kalan.sort((a,b)=>grup[b].isler.length-grup[a].isler.length);
  const yol=[kalan.shift()];
  while(kalan.length){
    const son=grup[yol[yol.length-1]].set;
    let en=0, enP=-1;
    kalan.forEach((k,i)=>{ const s2=grup[k].set;
      const ortak=Object.keys(s2).filter(x=>son[x]).length;
      const p=ortak*1000-filDegisim(s2,son)*10+grup[k].isler.length;
      if(p>enP){ enP=p; en=i; } });
    yol.push(kalan.splice(en,1)[0]);

  return yol.reduce((a,k)=>a.concat(grup[k].isler),[]);
}
/* İş → makine. Hedef "filament" ise iş en az gramajlı türe çivilenir; "hız"da
   işi en erken bitiren makineye, "denge"de süre ve gram birlikte tartılır.
   Her durumda makarası tutan makine yeğlenir (değişim süresi maliyete girer). */
function planAta(isler,makList,hedef,degisimDk){
  const M=(makList&&makList.length)?makList:[{no:1,tur:""}];
  const dg=Math.max(0,degisimDk==null?PLAN_DEGISIM_DK:num(degisimDk));
  const yuk=M.map(()=>0); const kuyruk=M.map(()=>[]); const sonSet=M.map(()=>null);
  const enDkIs=j=>Math.min.apply(null,Object.keys(j.tur).map(t=>j.tur[t].dk));
  (isler||[]).slice().sort((a,b)=>enDkIs(b)-enDkIs(a)).forEach(j=>{
    const uygun=M.map((m,i)=>({i,tur:m.tur,v:j.tur[m.tur]})).filter(x=>x.v&&x.v.dk>0);

/* ————— 🎁 KAMPANYA — komuta hedef koyar, pazarlamacı ilerler, ödülü komuta elle verir —————
   Hedef satış kayıtlarından sayılır: ya adet ya ciro; istenirse tek ürüne daraltılır.
   Ödül ürünü pazarlamacıya bedelsiz geçer — veriliş 0 yazılır, satarsa tamamı hakedişi olur. */
function kampanyaIlerleme(kmp,har,uid){
  if(!kmp||!uid) return 0;
  const b0=kmp.bas?(new Date(kmp.bas+"T00:00:00").getTime()||0):0;
  const b1=kmp.bit?(new Date(kmp.bit+"T23:59:59").getTime()||Infinity):Infinity;
  let t=0;
  (har||[]).forEach(x=>{
    if(!x||x.tip!=="satis") return;
    if((x.kullaniciId||"")!==uid) return;
    const ts=new Date(x.tarih).getTime()||0; if(ts<b0||ts>b1) return;
    if(kmp.hedefUrunId&&(x.urunId||"")!==kmp.hedefUrunId) return;
    t+=(kmp.hedefTip==="ciro")?num(x.adet)*num(x.satisFiyat):num(x.adet); });
  return t;
}
const kampanyaKapsar=(kmp,uid)=>!!kmp&&kmp.aktif!==false&&(!((kmp.kime||[]).length)||(kmp.kime||[]).indexOf(uid)>=0);
/* 🏬 Mekan kapsamlı kampanya: hedef her kale için ayrı sayılır ve TEKRARLANIR —
   200 alan kale 100'lük hedefi iki kez hak eder. Ödül kaleye verilir. */
const kmpKaleKey=x=>x.musteriId?("m:"+x.musteriId):("y:"+((x.yer||"?").toLocaleLowerCase("tr")));
function kampanyaMekanlar(kmp,har){
  if(!kmp) return [];
  const b0=kmp.bas?(new Date(kmp.bas+"T00:00:00").getTime()||0):0;
  const b1=kmp.bit?(new Date(kmp.bit+"T23:59:59").getTime()||Infinity):Infinity;
  const kime=kmp.kime||[];
  const M={};
  (har||[]).forEach(x=>{
    if(!x||x.tip!=="satis"||x.gerilla) return;                 // seyyar satışın mekanı yok
    if(kime.length&&kime.indexOf(x.kullaniciId||"")<0) return;
    const ts=new Date(x.tarih).getTime()||0; if(ts<b0||ts>b1) return;
    if(kmp.hedefUrunId&&(x.urunId||"")!==kmp.hedefUrunId) return;
    const key=kmpKaleKey(x); if(key==="y:?") return;
    const o=M[key]||(M[key]={key,ad:x.yer||"",musteriId:x.musteriId||"",
      kullaniciId:x.kullaniciId||"",kullaniciAd:x.kullaniciAd||"",ilerleme:0,son:0});
    o.ilerleme+=(kmp.hedefTip==="ciro")?num(x.adet)*num(x.satisFiyat):num(x.adet);
    if(ts>o.son){ o.son=ts; o.ad=x.yer||o.ad; o.kullaniciId=x.kullaniciId||o.kullaniciId;
      o.kullaniciAd=x.kullaniciAd||o.kullaniciAd; } });
  const hedef=Math.max(1,num(kmp.hedefMiktar));
  return Object.values(M).map(o=>{
    const hak=Math.floor(o.ilerleme/hedef);
    const verilen=num((((kmp.verilen||{})[o.key])||{}).kez);
    return {...o,hak,verilen,bekleyen:Math.max(0,hak-verilen),
      kalan:Math.max(0,hedef*(hak+1)-o.ilerleme)}; })
    .sort((a,b)=>b.bekleyen-a.bekleyen||b.ilerleme-a.ilerleme);
}
const kampanyaMekanMi=kmp=>!kmp||kmp.kapsam!=="pazarlamaci";   // varsayılan: mekan kapsamı
const kampanyaVerildi=(kmp,uid)=>!!(((kmp&&kmp.verilen)||{})[uid]);
const kampanyaSuresi=kmp=>{ if(!kmp) return true;
  const now=Date.now();
  if(kmp.bas&&(new Date(kmp.bas+"T00:00:00").getTime()||0)>now) return false;
  if(kmp.bit&&(new Date(kmp.bit+"T23:59:59").getTime()||0)<now) return false;
  return true; };
/* 🎁 kampanya yönetimi — liste, tanımlama, kişi kişi ilerleme, ödül verme */
function KampanyaSheet({kampanyalar,kullanicilar,hareketler,urunler,bekle,onKaydet,onSil,onOdulVer,onClose}){
  const [duzen,setDuzen]=useState(null);   // null | {} (yeni) | kayıt
  const pazarlamacilar=(kullanicilar||[]).filter(u=>u&&u.id&&(u.ad||"").trim()&&!u.arsiv
    &&u.rol!=="admin"&&u.rol!=="montaj"&&!u.demo&&!u.minimal);
  const liste=(kampanyalar||[]).slice().sort((a,b)=>new Date(b.tarih||0)-new Date(a.tarih||0));
  const urunAd=id=>((urunler||[]).find(u=>u.id===id)||{}).ad||"";

  if(duzen) return h(KampanyaDuzenSheet,{k:duzen,pazarlamacilar,urunler,bekle,
    onKaydet:async p2=>{ if(p2===null){ setDuzen(null); return; } await onKaydet(p2); setDuzen(null); },
    onSil:duzen.id?(()=>{ onSil(duzen); setDuzen(null); }):null});

  const satir=k=>{
    const hedefEt=(k.hedefTip==="ciro"?tl(k.hedefMiktar):(num(k.hedefMiktar)+" adet"))
      +(k.hedefUrunId?(" · "+urunAd(k.hedefUrunId)):" satış");
    const mekanMi=kampanyaMekanMi(k);
    const mekanlar=mekanMi?kampanyaMekanlar(k,hareketler):[];
    const kisiler=mekanMi?[]:pazarlamacilar.filter(u=>kampanyaKapsar(k,u.id));
    const sureli=kampanyaSuresi(k);
    return h("div",{key:k.id,className:"card",style:{padding:"14px 16px",marginBottom:10,
        opacity:(k.aktif===false)?.55:1}},
      h("div",{style:{display:"flex",alignItems:"flex-start",gap:10,marginBottom:10}},
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{style:{fontSize:15,fontWeight:800,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},k.ad||"Kampanya"),
          h("div",{style:{fontSize:12,color:"var(--mut)",marginTop:3,fontWeight:600}},
            (mekanMi?"Her mekan ":"")+hedefEt+"  →  "+num(k.odulAdet)+" × "+(urunAd(k.odulUrunId)||"ödül")),
          h("div",{style:{fontSize:11,color:"var(--cyan)",marginTop:2,fontWeight:800}},

            (k.bas||"")+" – "+(k.bit||"süresiz")+(sureli?"":" · süresi geçti")):null),
        h("button",{onClick:()=>setDuzen(k),style:{flexShrink:0,padding:"7px 11px",borderRadius:10,
          background:"var(--surf2)",border:"1px solid var(--line)",fontSize:12,fontWeight:800}},"Düzenle")),
      mekanMi

            const oran=Math.max(0,Math.min(100,Math.round((m.ilerleme%Math.max(1,num(k.hedefMiktar)))/Math.max(1,num(k.hedefMiktar))*100)));
            const tam=m.bekleyen>0;
            return h("div",{key:m.key,style:{padding:"9px 11px",borderRadius:12,background:"var(--surf2)",

              h("div",{style:{display:"flex",alignItems:"center",gap:9,marginBottom:6}},
                h("span",{style:{fontSize:13,fontWeight:800,flex:1,minWidth:0,overflow:"hidden",
                  textOverflow:"ellipsis",whiteSpace:"nowrap"}},m.ad||"—"),
                h("span",{style:{fontSize:12,fontWeight:800,color:tam?"var(--gold)":"var(--mut)"}},
                  (k.hedefTip==="ciro"?tl(m.ilerleme):num(m.ilerleme)))),
              h("div",{style:{height:6,borderRadius:6,background:"var(--line)",overflow:"hidden",marginBottom:6}},
                h("div",{style:{height:"100%",width:(tam?100:oran)+"%",borderRadius:6,
                  background:tam?"var(--gold)":"var(--cyan)"}})),
              h("div",{style:{fontSize:11,color:"var(--mut)",fontWeight:700,marginBottom:tam?7:0}},
                (m.kullaniciAd?(m.kullaniciAd+" · "):"")
                +(m.verilen>0?(m.verilen+" kez verildi · "):"")
                +(tam?(m.bekleyen+" kez hak etti"):("sonraki ödüle "+(k.hedefTip==="ciro"?tl(m.kalan):num(m.kalan)+" adet")))),
              tam?h("button",{onClick:()=>onOdulVer(k,m),disabled:bekle,

          :h("div",{style:{fontSize:12,color:"var(--mut)",padding:"6px 0"}},"Henüz hiçbir mekan bu kampanyada satış görmedi."))
        : kisiler.length?h("div",{style:{display:"grid",gap:7}},kisiler.map(u=>{
        const ilr=kampanyaIlerleme(k,hareketler,u.id);
        const hedef=Math.max(1,num(k.hedefMiktar));

          h("div",{style:{height:6,borderRadius:6,background:"var(--line)",overflow:"hidden",marginBottom:verildi||doldu?7:0}},

                bekle?"⏳":("🎁 Ödülü ver · "+num(k.odulAdet)+" × "+(urunAd(k.odulUrunId)||"ürün"))):null)); }))
        :h("div",{style:{fontSize:12,color:"var(--mut)",padding:"6px 0"}},"Bu kampanyanın kapsadığı pazarlamacı yok.")); };

// ➕ İŞ EKLE — eski panelin IsModal kayıt şemasıyla birebir uyumlu yazar
function IsEkleSheet({makineler,urunler,plan,filamentler,onKaydet,bekle,kayit,pre}){
  const duzen=!!(kayit&&kayit.id);
  const makList=(makineler||[]).filter(mk=>(mk.ad||"").trim());
  const [makineId,setMakineId]=useState(duzen?(kayit.makineId||""):((pre&&pre.makineId)||(makList[0]&&makList[0].id)||""));
  const urunListe=(urunler||[]).filter(u=>(u.ad||"").trim()).slice().sort((a,b)=>(a.ad||"").localeCompare(b.ad||"","tr"));
  const [urunId,setUrunId]=useState(duzen?(kayit.urunId||""):"");
  const [serbest,setSerbest]=useState(duzen?!kayit.urunId:false);

  const [filamentId,setFilamentId]=useState(duzen?(kayit.filamentId||""):"");
  const [ams,setAms]=useState(duzen?(kayit.ams!==false):true);

  const filSec=(filamentler||[]).find(f=>f.id===filamentId)||null;
  const maliyet=num(sure)/60*12+num(gram)/1000*(filSec?num(filSec.kgFiyat):0);   // 12 ₺/saat makine
  // önceki baskılar (tekrar için) — ad+adet+süreye göre tekilleştir
  // gerçekten BASILMIŞ işler önce ve gerçek başlangıç saatine göre — ileri tarihli plan "önceki baskı" değildir
  const baskiSira=(a,b)=>((b.basladi?1:0)-(a.basladi?1:0))||(new Date(b.gercekBaslangic||b.baslangic)-new Date(a.gercekBaslangic||a.baslangic));
  const oncekiler=(()=>{ const seen=new Set(), out=[];
    (plan||[]).slice().sort(baskiSira).forEach(p=>{ if(!p.ad) return;
      const k=(p.ad||"")+"|"+num(p.adet)+"|"+num(p.sureDk); if(seen.has(k)) return; seen.add(k); if(out.length<10) out.push(p); }); return out; })();
  const toLoc=ms=>{const d2=new Date(ms); d2.setMinutes(d2.getMinutes()-d2.getTimezoneOffset()); return d2.toISOString().slice(0,16);};
  // varsayılan başlangıç: seçili makinenin kuyruk sonu (efektif) — 5 dk'ya yuvarlanır

    (plan||[]).forEach(p2=>{ if(p2.makineId!==mid) return; const e=eff[p2.id]; if(!e||e.geride) return;
      const bit=e.s+num(p2.sureDk)*60000; if(bit>son) son=bit; });
    return Math.ceil(son/300000)*300000; };
  const [bas,setBas]=useState(()=>duzen?toLoc(new Date(kayit.baslangic).getTime()):toLoc((pre&&pre.baslangic)?new Date(pre.baslangic).getTime():kuyrukSonu((pre&&pre.makineId)||(makList[0]&&makList[0].id)||"")));
  const makSec=id=>{ setMakineId(id); setBas(toLoc(kuyrukSonu(id)));

    const c2=baskiCoz(seciliUrun?baskiOku(seciliUrun):null,makTur(mk2));
    /* tarif uygulanmışsa süre VE filament o türün değerlerine tazelenir */
    if(c2&&(tarifFil||[]).length){
      const kat=Math.max(1,Math.round(num(adet)/Math.max(1,num(c2.tablaAdet))));
      if(c2.sureDk>0) setSure(String(Math.round(c2.sureDk*kat)));
      if(c2.gram>0) setGram(String(Math.round(c2.gram*kat*10)/10));

      if(L.length){ setTarifFil(L); setFilamentId(L[0].filamentId); } } };
  // ⏱ süre ↔ bitiş saati: hangisini girersen diğeri kendiliğinden hesaplanır
  const bitDeger=()=>{ const sMs=bas?new Date(bas).getTime():NaN; const d=num(sure);

// 💸 GİDER KALEMLERİ — kira, elektrik, maaş, montaj işçiliği… Tikita hesabında net kârdan düşülür
const GIDER_TUR=["Pazarlamacı hakedişi","Montaj işçiliği","Elektrik","Kargo","Bakım","Vergi","Tanıtım","Diğer"];
// stok alımı = para çıkar ama gider değildir; bedeli ürün maliyetinde zaten var → kâra düşmez
const STOK_TUR=["Filament alımı","Sarf malzemesi alımı","Yedek parça alımı"];
const stokAlimMi=g=>!!(g&&(g.stok||STOK_TUR.indexOf(g.tur)>=0));
const SABIT_TUR=["Kira","İnternet","Maaş","Abonelik","Sigorta","Vergi","Diğer"];
const YATIRIM_TUR=["Makine taksidi","Kredi taksidi","Yatırım"];
// aylık sabit giderleri seçili döneme yay — tam ay = tam tutar, kısa dönem = gün oranı
function sabitHesap(list,b0,b1){
  const L=(list||[]).filter(x=>num(x.tutar)>0&&x.baslangic);
  const bos={toplam:0,tur:{},aylik:0,sayi:0,gun:0,yatirim:0};
  if(!L.length) return bos;
  const simdi=Date.now();
  const s0=b0>0?b0:Math.min.apply(null,L.map(x=>new Date(x.baslangic+"-01T00:00:00").getTime()));
  const s1=isFinite(b1)?b1:simdi;   // seçilen aralık aynen esas alınır; "Tümü" bugüne kadar
  const ayKey=(y,m)=>y+"-"+String(m+1).padStart(2,"0");
  const buAy=ayKey(new Date().getFullYear(),new Date().getMonth());
  const aktifler=L.filter(x=>x.baslangic<=buAy&&(!x.bitis||x.bitis>=buAy));
  const aylik=aktifler.filter(x=>!x.stok).reduce((s2,x)=>s2+num(x.tutar),0);
  if(!(s1>s0)) return {...bos,aylik};
  let toplam=0,gun=0,yatirim=0; const tur={}; const gorulen={};
  let d=new Date(s0); d=new Date(d.getFullYear(),d.getMonth(),1);
  while(d.getTime()<s1){
    const y=d.getFullYear(), m=d.getMonth();
    const ayBas=new Date(y,m,1).getTime(), aySon=new Date(y,m+1,1).getTime();
    const gunSayi=(aySon-ayBas)/864e5;
    const g2=Math.max(0,(Math.min(aySon,s1)-Math.max(ayBas,s0))/864e5);
    const key=ayKey(y,m);
    gun+=g2;
    L.forEach(x=>{ if(x.baslangic>key) return; if(x.bitis&&x.bitis<key) return;
      const t=num(x.tutar)*g2/gunSayi; gorulen[x.id||(x.tur||"Diğer")]=1;
      if(x.stok){ yatirim+=t; return; }   // yatırım/taksit → nakit çıkışı, kâra düşmez
      toplam+=t; const k=x.tur||"Diğer"; tur[k]=(tur[k]||0)+t; });
    d=new Date(y,m+1,1);
  }
  return {toplam,tur,aylik,yatirim,sayi:Object.keys(gorulen).length,gun:Math.round(gun*10)/10};
}

    h("button",{onClick:()=>{ sw.current=false; setDx(0); onSil(); },style:{position:"absolute",left:0,top:0,bottom:0,width:80,background:"#e0483c",color:"#fff",fontSize:13.5,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}},"Sil"),

/* 🗂 SERİ GRUPLAMA — ürünleri seri adına göre kümeler, her küme için toplamları çıkarır.
   Bir ürün birden fazla seride olabilir; o zaman her serinin kutusunda görünür ve
   her serinin toplamına ayrı ayrı katılır (kutu toplamları bu yüzden çakışabilir).
   Hiçbir seride olmayanlar en sonda "Serisiz" başlığı altında toplanır. */
function seriGrupla(list){
  const g={}, sirasiz=[];
  (list||[]).forEach(u=>{ const S=seriListe(u);
    if(!S.length){ sirasiz.push(u); return; }
    S.forEach(s=>{ (g[s]=g[s]||[]).push(u); }); });
  const ozet=arr=>{ const o={urun:arr.length,adet:0,veris:0,etiket:0,maliyet:0,depo:0,canta:0,kons:0,montaj:0,basim:0,satildi:0,azSay:0};
    arr.forEach(u=>{ const dp=Math.max(0,num(u.stokta)), ct=Math.max(0,num(u.canta)),
        kn=Math.max(0,num(u.konsStok),num(u.sahada)), mt=Math.max(0,num(u.montajda));
      const top=dp+ct+kn+mt;
      o.depo+=dp; o.canta+=ct; o.kons+=kn; o.montaj+=mt; o.adet+=top;
      o.basim+=Math.max(0,num(u.basimda)); o.satildi+=num(u.satildi);
      o.veris+=top*num(u.alis); o.etiket+=top*num(u.fiyat); o.maliyet+=top*num(u.maliyet);
      if(num(u.stokta)<=3) o.azSay++; });
    return o; };
  const L=Object.keys(g).sort((a,b)=>a.localeCompare(b,"tr")).map(s=>({seri:s,ad:s,list:g[s],o:ozet(g[s])}));
  if(sirasiz.length) L.push({seri:"",ad:"Serisiz",list:sirasiz,o:ozet(sirasiz)});
  return L;
}
/* 🗂 SERİ DÜZENİ — ürünler ana stok listesinde aynen durur; burada seri kutularına
   sürükle-bırak ile dağıtılır. Karta basılı tut → kart havalanır → kutuya bırak.
   Bir ürün birden fazla seride olabilir: kutuya bırakmak EKLER, çıkarmaz.
   Bir seriden çıkarmak için kutudaki etiketin ✕'ine dokun; bütün serilerden
   çıkarmak için "Serisiz" kutusuna bırak. */
function SeriYonetSheet({stok,onAta,onClose,bekle}){
  const [ekSeri,setEkSeri]=useState([]);        // henüz ürünü olmayan yeni kutular
  const [yeniAd,setYeniAd]=useState("");
  const [sur,setSur]=useState(null);            // sürüklenen: {u,x,y}
  const [hedef,setHedef]=useState(null);        // üzerinde durulan kutunun anahtarı
  const kutuRef=useRef({}); const alan=useRef([]); const basla=useRef(null); const zaman=useRef(null);
  const kaydirEl=useRef(null); const parmak=useRef({x:0,y:0}); const rafId=useRef(0);
  const [kenar,setKenar]=useState(0);   // -1 yukarı kayıyor · +1 aşağı · 0 dur
  const G=seriGrupla(stok);
  const bosOzet={urun:0,adet:0,veris:0,etiket:0,maliyet:0,depo:0,canta:0,kons:0,montaj:0,basim:0,satildi:0,azSay:0};
  const kutular=G.filter(g=>g.seri)
    .concat(ekSeri.filter(sr=>!G.some(g=>g.seri===sr)).map(sr=>({seri:sr,ad:sr,list:[],o:bosOzet})))
    .sort((a,b)=>a.ad.localeCompare(b.ad,"tr"))
    .concat(G.filter(g=>!g.seri));
  const anh=g=>g.seri||"_";
  const uye=(u,sr)=>seriListe(u).some(x=>x.toLocaleLowerCase("tr")===String(sr||"").toLocaleLowerCase("tr"));
  const olc=()=>{ alan.current=kutular.map(g=>{ const el=kutuRef.current[anh(g)];
      const r=(el&&el.getBoundingClientRect)?el.getBoundingClientRect():null;
      return r?{k:anh(g),r}:null; }).filter(Boolean); };
  const noktada=(x,y)=>{ const a=alan.current.find(z=>x>=z.r.left&&x<=z.r.right&&y>=z.r.top&&y<=z.r.bottom); return a?a.k:null; };
  /* 📜 SÜRÜKLERKEN KENDİ KENDİNE KAYDIRMA — pencerenin kaydırılabilir gövdesini bul.
     Etiketi tutup ekranın üst/alt şeridine götürünce liste o yöne akar, böylece
     görünmeyen bir seri kutusuna da ulaşılır. */
  const kaydirBul=()=>{ let el=kutuRef.current[anh(kutular[0]||{})];
    while(el&&el!==document.body){
      const st=(window.getComputedStyle?window.getComputedStyle(el):null);
      const kay=st&&/(auto|scroll)/.test(st.overflowY);
      if(kay&&el.scrollHeight>el.clientHeight+4){ kaydirEl.current=el; return el; }
      el=el.parentElement; }
    kaydirEl.current=null; return null; };
  const ESIK=88, HIZ=15;   // kenardan kaç px'te başlar · kare başına en çok kaç px
  const kaydirAdim=()=>{
    rafId.current=0;
    const el=kaydirEl.current; if(!el){ setKenar(0); return; }
    const r=el.getBoundingClientRect(); const y=parmak.current.y;
    const ust=y-r.top, alt=r.bottom-y;
    let d=0;
    if(ust<ESIK&&el.scrollTop>0) d=-Math.ceil(HIZ*Math.min(1,(ESIK-ust)/ESIK));
    else if(alt<ESIK&&el.scrollTop<el.scrollHeight-el.clientHeight-1) d=Math.ceil(HIZ*Math.min(1,(ESIK-alt)/ESIK));
    setKenar(d<0?-1:(d>0?1:0));
    if(d){ el.scrollTop+=d; olc(); setHedef(noktada(parmak.current.x,parmak.current.y)); }
    rafId.current=requestAnimationFrame(kaydirAdim); };
  const kaydirDur=()=>{ if(rafId.current) cancelAnimationFrame(rafId.current);
    rafId.current=0; kaydirEl.current=null; setKenar(0); };
  // 🎯 bırakma: seri kutusu → ekle · Serisiz kutusu → tüm serilerden çıkar
  const birak=(u,k)=>{ const S=seriListe(u);
    if(k==="_") return S.length?[{...u,seriler:[]}]:null;
    if(uye(u,k)) return null;
    return [{...u,seriler:S.concat([k])}]; };
  const cikar=(u,sr)=>{ const y=seriListe(u).filter(x=>x.toLocaleLowerCase("tr")!==String(sr).toLocaleLowerCase("tr"));
    onAta([{...u,seriler:y}]); };
  const tut=(e,u)=>{ const p=e.touches?e.touches[0]:e; if(!p) return;
    basla.current={x:p.clientX,y:p.clientY,u};
    clearTimeout(zaman.current);
    parmak.current={x:p.clientX,y:p.clientY};
    zaman.current=setTimeout(()=>{ olc(); kaydirBul(); setSur({u,x:p.clientX,y:p.clientY});
      if(!rafId.current) rafId.current=requestAnimationFrame(kaydirAdim);
      try{ navigator.vibrate&&navigator.vibrate(14); }catch(_){} },190); };
  useEffect(()=>{
    const hareket=e=>{ const p=e.touches?e.touches[0]:e; if(!p) return;
      if(sur){ if(e.cancelable) e.preventDefault();
        parmak.current={x:p.clientX,y:p.clientY};
        if(!rafId.current&&kaydirEl.current) rafId.current=requestAnimationFrame(kaydirAdim);
        setSur(s=>s?{...s,x:p.clientX,y:p.clientY}:s); setHedef(noktada(p.clientX,p.clientY)); return; }
      const b=basla.current;   // henüz kalkmadıysa ve parmak kaydıysa: bu bir kaydırma, sürükleme değil
      if(b&&(Math.abs(p.clientX-b.x)>9||Math.abs(p.clientY-b.y)>9)){ clearTimeout(zaman.current); basla.current=null; } };
    const kaldir=()=>{ clearTimeout(zaman.current); kaydirDur();
      if(sur){ const k=hedef, u=sur.u; setSur(null); setHedef(null);
        if(k!=null){ const y=birak(u,k); if(y) onAta(y); } }
      basla.current=null; };
    window.addEventListener("touchmove",hareket,{passive:false});
    window.addEventListener("mousemove",hareket);
    window.addEventListener("touchend",kaldir); window.addEventListener("touchcancel",kaldir);
    window.addEventListener("mouseup",kaldir);
    return ()=>{ clearTimeout(zaman.current);
      window.removeEventListener("touchmove",hareket); window.removeEventListener("mousemove",hareket);
      window.removeEventListener("touchend",kaldir); window.removeEventListener("touchcancel",kaldir);
      window.removeEventListener("mouseup",kaldir); };
  },[sur,hedef,stok,ekSeri.length]);
  // ⚠️ rAF iptali AYRI efektte: yukarıdaki efekt sur/hedef her değişince koşuyor,
  //    temizliğine konsaydı ilk parmak hareketinde kaydırma döngüsü ölürdü.
  useEffect(()=>()=>{ if(rafId.current) cancelAnimationFrame(rafId.current); rafId.current=0; kaydirEl.current=null; },[]);
  const seriEkle=()=>{ const t=yeniAd.trim();
    if(!t) return;
    if(kutular.some(g=>g.seri&&g.seri.toLocaleLowerCase("tr")===t.toLocaleLowerCase("tr"))) return alert("Bu seri zaten var.");
    setEkSeri(x=>x.concat([t])); setYeniAd(""); };
  const adDegis=g=>{ const t=(prompt("Seri adı",g.ad)||"").trim();
    if(!t||t===g.ad) return;
    setEkSeri(x=>x.filter(s=>s!==g.ad).concat(g.list.length?[]:[t]));
    if(g.list.length) onAta(g.list.map(u=>({...u,
      seriler:seriListe(u).map(x=>x.toLocaleLowerCase("tr")===g.ad.toLocaleLowerCase("tr")?t:x)})));  };
  const seriKaldir=g=>{ if(!g.list.length){ setEkSeri(x=>x.filter(s=>s!==g.ad)); return; }
    if(!confirm("“"+g.ad+"” serisi kaldırılsın mı?\n"+g.list.length+" ürün bu seriden çıkar, ürünler silinmez.")) return;
    setEkSeri(x=>x.filter(s=>s!==g.ad));
    onAta(g.list.map(u=>({...u,seriler:seriListe(u).filter(x=>x.toLocaleLowerCase("tr")!==g.ad.toLocaleLowerCase("tr"))}))); };
  const dgm=(yazi,fn,renk)=>h("button",{onClick:fn,style:{flexShrink:0,padding:"6px 10px",borderRadius:9,
    background:"var(--surf)",border:"1px solid var(--line)",fontSize:11.5,fontWeight:800,color:renk||"var(--mut)"}},yazi);
  // etiket — sr verilirse o seriden çıkarma ✕'i çıkar; kaynak listede seri sayısı rozeti olur
  const cip=(u,sr)=>{ const kalkti=sur&&sur.u.id===u.id; const n=seriListe(u).length;
    return h("div",{key:(sr||"k")+":"+u.id,
      style:{display:"inline-flex",alignItems:"center",gap:6,padding:"7px 10px",borderRadius:11,
        background:"var(--surf)",border:"1px solid var(--line)",opacity:kalkti?.3:1,
        fontSize:12.5,fontWeight:700,userSelect:"none",WebkitUserSelect:"none",
        WebkitTouchCallout:"none",touchAction:"pan-y"}},
      h("span",{onTouchStart:e=>tut(e,u),onMouseDown:e=>tut(e,u),
        style:{display:"inline-flex",alignItems:"center",gap:6,cursor:"grab"}},
        h("span",{style:{fontSize:12,color:"var(--mut2)",flexShrink:0}},"⠿"),
        h("span",{style:{maxWidth:132,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},u.ad),
        (!sr&&n>0)?h("span",{style:{fontSize:10,fontWeight:800,color:"#d97b12",background:"#d97b1218",
          padding:"1px 6px",borderRadius:7,flexShrink:0}},"🗂"+n):null,
        sr?null:h("span",{style:{fontSize:10.5,color:"var(--mut)",flexShrink:0}},num(u.stokta))),
      sr?h("button",{onClick:()=>cikar(u,sr),style:{flexShrink:0,width:20,height:20,borderRadius:6,
        background:"var(--surf2)",border:"1px solid var(--line)",fontSize:10,color:"var(--red)",
        display:"inline-flex",alignItems:"center",justifyContent:"center"}},"✕"):null); };
  const kutu=g=>{ const k=anh(g), ustunde=!!sur&&hedef===k, seriMi=!!g.seri;
    const zatenVar=ustunde&&seriMi&&uye(sur.u,g.seri);
    return h("div",{key:k,ref:el=>{ kutuRef.current[k]=el; },
      style:{borderRadius:15,padding:"11px 12px",marginBottom:10,transition:"background .15s,border-color .15s",
        background:ustunde?(zatenVar?"var(--surf2)":"#fff7ed"):(seriMi?"var(--surf2)":"transparent"),
        border:"1.5px "+(seriMi?"solid ":"dashed ")+(ustunde&&!zatenVar?"#d97b12":"var(--line)")}},

    const t=new Date(x.tarih).getTime()||0; if(t>(son[id]||0)) son[id]=t; });
  const kul=new Set(), gruplar=[];

  useEffect(()=>{ if(!window.L||!ref.current||mapRef.current) return; const L=window.L;
    const map=L.map(ref.current,{scrollWheelZoom:true,attributionControl:false}).setView([41.02,29.03],12);
    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd"}).addTo(map);
    cizLg.current=L.layerGroup().addTo(map); sonucLg.current=L.layerGroup().addTo(map); odakLg.current=L.layerGroup().addTo(map);
    map.on("click",e=>setKose(k=>[...k,[+e.latlng.lat.toFixed(6),+e.latlng.lng.toFixed(6)]]));
    mapRef.current=map; setTimeout(()=>{ try{map.invalidateSize();}catch(x){} },200);
  },[]);
  // 📍 pazarlamacının paylaştığı anlık konum → haritayı oraya uçur + iğnele
  useEffect(()=>{ const L=window.L, map=mapRef.current, lg=odakLg.current; if(!L||!map||!lg||!odak||odak.lat==null||odak.lng==null) return;

    const ik=L.divIcon({className:"",iconSize:[34,34],iconAnchor:[17,17],html:"<div style='width:34px;height:34px;border-radius:50%;background:#0e8fce33;display:flex;align-items:center;justify-content:center'><div style='width:14px;height:14px;border-radius:50%;background:#0e8fce;border:2px solid #fff;box-shadow:0 0 0 2px #0e8fce55'></div></div>"});
    L.marker(c,{icon:ik,interactive:false}).addTo(lg).bindTooltip("📍 "+((odak.ad||"Pazarlamacı"))+" · anlık konum",{direction:"top",permanent:false});
    try{ map.setView(c,15); }catch(x){} setTimeout(()=>{ try{map.invalidateSize();}catch(x){} },150);
  },[odak]);
  useEffect(()=>{ const L=window.L, lg=cizLg.current; if(!L||!lg) return; lg.clearLayers();
    kose.forEach(p=>L.circleMarker(p,{radius:5,color:"#b45309",fillColor:"#b45309",fillOpacity:1,weight:2}).addTo(lg));
    if(kose.length>=3) L.polygon(kose,{color:"#b45309",weight:2,fillColor:"#f59e0b",fillOpacity:0.14}).addTo(lg);
    else if(kose.length===2) L.polyline(kose,{color:"#b45309",weight:2,dashArray:"5,5"}).addTo(lg);
  },[kose]);
  useEffect(()=>{ const L=window.L, lg=sonucLg.current; if(!L||!lg) return; lg.clearLayers();
    sonuc.forEach(r=>{ const on=!!secili[r.ad];
      const mk=L.circleMarker([+r.lat,+r.lng],{radius:on?8:6,color:on?"#16a34a":"#0369a1",fillColor:on?"#16a34a":"#fff",fillOpacity:on?1:.95,weight:2}).addTo(lg);
      mk.bindTooltip("<b>"+r.ad+"</b>"+(r.puanG!=null?(" · "+r.puanG):""),{direction:"top"});

  },[sonuc,secili]);

      /* Sonuç yoksa NEDEN yok olduğunu söyle — "bulunamadı" tek başına yanıltıyor:

        const ned=[t.gHata?("• Google Places: "+t.gHata):"",t.oHata?("• OpenStreetMap: "+t.oHata):""].filter(Boolean);

  }

  function rotaSirala(list){ if(list.length<2) return list.slice(); const kalan=list.slice(); const m=merkez(); let cur={lat:m.lat,lng:m.lng}; const out=[];

/* 🫰 PAZARLAMACI HAKEDİŞ DÖNEMLERİ — onay ve ödeme */
/* 🗄 HAFTALIK ARŞİV HESABI — bir haftanın her pazarlamacı için dökümü.
   Pazarlamacı ekranındaki kuralla birebir: hakediş satışta doğar (satış − veriliş),
   sembolik (≤1 ₺) satış hakediş doğurmaz, tahsil edilen nakit ayrı gösterilir.
   Gönderilmemiş haftalar da hesaplanır — komuta neyin beklediğini görsün. */
const HAK_ESIK_A=1;
function haftaOzetA(hareketler,ts){
  const b0=haftaBasMs(ts), b1=haftaBitMs(ts);
  const ic=x=>{ const t=new Date(x.tarih).getTime(); return t>=b0&&t<=b1; };
  const K={};
  const al=(uid,ad)=>{ const k=uid||"?";
    return K[k]||(K[k]={kullaniciId:k,kullaniciAd:ad||"?",adet:0,ciro:0,veris:0,hakedis:0,nakit:0,bedava:0,satirlar:{}}); };
  (hareketler||[]).forEach(x=>{ if(!x||!ic(x)) return;
    const o=al(x.kullaniciId,x.kullaniciAd);
    if(x.tip==="satis"){
      const a=Math.max(0,num(x.adet)), f=num(x.satisFiyat), v=num(x.alisFiyat);
      const ger=!!(x.gerilla||x.kaynak==="gerilla");
      const bedava=f<=HAK_ESIK_A;
      o.adet+=a; o.ciro+=a*f; o.veris+=a*v;
      if(!bedava) o.hakedis+=a*(f-v); else o.bedava+=a;
      if(ger) o.nakit+=(x.tahsil!=null?num(x.tahsil):a*f);
      const g0=new Date(x.tarih); g0.setHours(0,0,0,0);
      const kale=ger?"⚡ Seyyar":((x.yer||"").trim()||"—");
      const gk=(g0.getTime()||0)+"|"+kale;
      const r=o.satirlar[gk]||(o.satirlar[gk]={gun:g0.getTime()||0,kale,gerilla:ger,adet:0,ciro:0,hakedis:0});
      r.adet+=a; r.ciro+=a*f; if(!bedava) r.hakedis+=a*(f-v);
    }
    else if(x.tip==="tahsilat") o.nakit+=num(x.tutar);
  });
  return {b0,b1,kod:haftaKod(ts),etiket:haftaEtiket(ts),
    kisiler:Object.keys(K).map(k=>({...K[k],
      satirlar:Object.keys(K[k].satirlar).map(g=>K[k].satirlar[g]).sort((a,b)=>b.gun-a.gun||b.ciro-a.ciro)}))
      .filter(x=>x.adet>0||x.nakit>0.5)
      .sort((a,b)=>b.hakedis-a.hakedis)};
}
function haftaListesiA(hareketler,simdi){
  const L=[]; let t=haftaBasMs(simdi||Date.now());
  while(t>=HAKEDIS_BAS_MS&&L.length<60){ L.push(t); t-=7*864e5; }
  return L; }

  // —— ÜRETİM aşama/montaj komutları — index.html ile birebir alan yazımı (atomik increment) ——
  async function uretimMontaj(s,n,hedef){ const u=s.raw; n=Math.floor(num(n)); if(n<1) return;
    try{ const parcalar=u.parcalar||[];
      if(parcalar.length){ if(s.montajda<n) return say("Montajda "+s.montajda+" takım hazır");
        const elle=Math.max(0,num(u.montajElle)), elleDus=Math.min(elle,n), kalan=n-elleDus;
        const tk={...(u.parcaTuket||{})}; if(kalan>0) parcalar.forEach(p=>tk[p]=num(tk[p])+kalan*gerekenP(u,p));
        const ek=hedef==="stokta"?{stokta:increment(n)}:{zayiat:increment(n)};
        const patch={id:u.id,parcaTuket:tk,...ek}; if(elleDus) patch.montajElle=increment(-elleDus);
        await save("stok_urun",patch);
      } else { if(s.montajda<n) return say("Montajda "+s.montajda+" hazır");
        const ek=hedef==="stokta"?{montajBitti:increment(n),stokta:increment(n)}:{zayiat:increment(n)};
        await save("stok_urun",{id:u.id,...ek}); }
      if(hedef==="stokta") await stokLogla(u,+n,"uretim");
      say(hedef==="stokta"?("📥 "+n+" adet stoğa eklendi"):("⚠ "+n+" zayiat")); }
    catch(e){ console.error(e); say("İşlem başarısız"); } }
  async function uretimStoktan(s,n,hedef){ const u=s.raw; n=Math.floor(num(n)); if(n<1) return; if(num(u.stokta)<n) return say("Stokta "+num(u.stokta)+" var");
    try{ const ek=hedef==="satildi"?{satildi:increment(n)}:{konsinye:increment(n)};
      await save("stok_urun",{id:u.id,stokta:increment(-n),...ek}); await stokLogla(u,-n,hedef==="satildi"?"satis":"konsinye");
      say(hedef==="satildi"?("💰 "+n+" satıldı"):("🏬 "+n+" konsinyeye ayrıldı")); }
    catch(e){ console.error(e); say("İşlem başarısız"); } }
  async function uretimKonstan(s,n,hedef){ const u=s.raw; n=Math.floor(num(n)); if(n<1) return; if(num(u.konsStok)<n) return say("Konsinyede "+num(u.konsStok)+" var");
    try{ const ek=hedef==="stokta"?{stokta:increment(n)}:{satildi:increment(n)};

  async function uretimSatIade(s,n){ const u=s.raw; n=Math.floor(num(n)); if(n<1) return; if(num(u.satildi)<n) return say("Satılan "+num(u.satildi)+" var");
    try{ await save("stok_urun",{id:u.id,satildi:increment(-n),stokta:increment(n)}); await stokLogla(u,+n,"iade"); say("↩ "+n+" stoğa iade"); }
    catch(e){ console.error(e); say("İşlem başarısız"); } }
  async function uretimMontajAyarla(s,hedef){ const u=s.raw; const t=Math.max(0,Math.round(num(hedef))); const delta=t-s.montajda; if(!delta) return;
    try{ const parcalar=u.parcalar||[];
      if(delta>0){ await save("stok_urun",{id:u.id,montajElle:Math.max(0,num(u.montajElle))+delta}); }
      else if(parcalar.length){ const elle=Math.max(0,num(u.montajElle)); const elleDus=Math.min(elle,-delta); const kalan=(-delta)-elleDus;
        const tk={...(u.parcaTuket||{})}; if(kalan>0) parcalar.forEach(p=>tk[p]=num(tk[p])+kalan*gerekenP(u,p));
        await save("stok_urun",{id:u.id,parcaTuket:tk,montajElle:elle-elleDus}); }
      else { const elle=num(u.montajElle); const elleDus=Math.min(Math.max(0,elle),-delta); const kalan=(-delta)-elleDus;
        await save("stok_urun",{id:u.id,montajElle:elle-elleDus,montajBitti:num(u.montajBitti)+kalan}); }
      say("Montaj güncellendi"); }
    catch(e){ console.error(e); say("İşlem başarısız"); } }

  // 🔁 montaj teslimini geri al — stok, zayiat, parça tüketimi, stok hareketi ve kalan görev birlikte döner
  async function montajGeriAl(g,opt){ if(!g||!g.id||isBekle) return;
    const e0=g.etki||{}; const sil=!!(opt&&opt.sil);
    const ozet=num(g.teslimAdet)+" adet stoktan"+(num(g.kusurAdet)>0?(", "+num(g.kusurAdet)+" adet zayiattan"):"")+" düşülecek"+(g.odendi?", ödeme işareti kalkacak":"");
    if(!confirm(sil?("Bu görev silinsin mi?\n"+ozet+" ve kayıt tamamen kaldırılacak."):("Bu teslim geri alınsın mı?\n"+ozet+"; görev yeniden montajda görünecek."))) return;
    setIsBekle(true);
    try{
      const u=(urunler||[]).find(x=>x.id===g.urunId);
      if(u){ const patch={id:u.id};
        if(num(e0.stokta)>0) patch.stokta=increment(-num(e0.stokta));
        if(num(e0.zayiat)>0) patch.zayiat=increment(-num(e0.zayiat));
        if(num(e0.montajBitti)>0) patch.montajBitti=increment(-num(e0.montajBitti));
        if(num(e0.montajElle)<0) patch.montajElle=increment(-num(e0.montajElle));
        const pt=e0.parcaTuket||{};
        if(Object.keys(pt).length){ const tk={...(u.parcaTuket||{})};
          Object.keys(pt).forEach(k=>{ tk[k]=Math.max(0,num(tk[k])-num(pt[k])); }); patch.parcaTuket=tk; }
        if(Object.keys(patch).length>1) await save("stok_urun",patch); }
      if(e0.hareketId){ try{ await remove("stok_hareket",e0.hareketId); }catch(e){} }
      if(e0.zayiatHareketId){ try{ await remove("stok_hareket",e0.zayiatHareketId); }catch(e){} }
      // görev tamamen siliniyorsa "montaja verildi" hareketi de kalkmalı, yoksa geçmişte öksüz kalır
      if(sil&&g.alimHareketId){ try{ await remove("stok_hareket",g.alimHareketId); }catch(e){} }
      if(g.giderId){ try{ await remove("gider",g.giderId); }catch(e){} }   // ödeme gideri de geri alınır

  async function kampanyaOdulVer(k,hedef){ if(!k||!hedef||isBekle) return;

    if(!confirm("🎁 "+kime+" için "+ad2+" × "+(urun.ad||"")+" ödülü verilsin mi?\n\n"
      +"Atölye stoğu: "+num(urun.stokta)+" → "+kalan+(kalan<0?"  ⚠ eksiye düşüyor":"")

          maliyetBirim:num(urun.maliyetGuncel),yer:hedef.ad||"",musteriId:hedef.musteriId||"",
          tarih:new Date().toISOString()});
        await save("kampanya",{id:k.id,verilen:{[hedef.key]:{kez:num(hedef.verilen)+1,
          tarih:new Date().toISOString(),ad:hedef.ad||""}}});
      } else {
        await save("stok_urun",{id:urun.id,stokta:increment(-ad2),odulStokK:{[hedef.id]:increment(ad2)}});
        await save("pazarlama_hareket",{kullaniciId:hedef.id,kullaniciAd:hedef.ad||"",tip:"al",kaynak:"kampanya",

      onGeri:async(g)=>{ if(!g||!g.id||isBekle) return; await montajGeriAl(g); }}),

    modal&&modal.tip==="kampanya"&&h(KampanyaSheet,{kampanyalar,kullanicilar,hareketler,urunler,
      bekle:isBekle,onKaydet:kampanyaKaydet,onSil:kampanyaSil,onOdulVer:kampanyaOdulVer,onClose:()=>setModal(null)}),
    modal&&modal.tip==="anlasma"&&h(AnlasmaSheet,{list:anlasmalar,bekle:isBekle,onKaldir:anlasmaKaldir,onClose:()=>setModal(null)}),
    modal&&modal.tip==="yinelenen"&&h(YinelenenSheet,{gruplar:yinelenenler,bekle:isBekle,onBirlestir:kaleBirlestir,onClose:()=>setModal(null)}),
    modal&&modal.tip==="sarfYonet"&&h(SarfYonetimSheet,{sarflar,stok:d.stok,giderler,bekle:isBekle,onClose:()=>setModal(null),

        try{ await save("sarf",{id:a.sarfId,stokta:increment(a.adet),birimFiyat:a.yeniBirim});
          await save("gider",{tur:"Sarf malzemesi alımı",tutar:a.tutar,tarih:a.tarih,stok:true,oto:true,ref:a.sarfId,

          say("Alım işlendi · stok arttı"); }
        catch(e){ console.error(e); say("Kaydedilemedi"); } finally{ setIsBekle(false); } },
      onKaydet:async(x)=>{ if(isBekle) return; setIsBekle(true);
        try{ await save("sarf",{...(x.id?{id:x.id}:{}),ad:x.ad,birim:x.birim,stokta:num(x.stokta),birimFiyat:num(x.birimFiyat)}); say(x.id?"Güncellendi":"Malzeme eklendi"); }

/* 🛡 HATA KALKANI — bir ekran çizilirken hata verirse React bütün ağacı söküyor
   ve geriye bomboş sayfa kalıyordu. Kalkan hatayı yakalar, sebebini ve sürümü
   yazar; "Ekranı sıfırla" son açık sekmeyi unutup baştan açar. */
class HataKalkani extends React.Component{
  constructor(p){ super(p); this.state={hata:null}; }
  static getDerivedStateFromError(e){ return {hata:e}; }
  componentDidCatch(e,bilgi){ console.error("EKRAN HATASI",e,bilgi); }
  render(){
    if(!this.state.hata) return this.props.children;
    const e=this.state.hata;
    const yz={fontFamily:"-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif"};
    return h("div",{style:{...yz,padding:"26px 20px",maxWidth:520,margin:"0 auto",color:"var(--txt,#1b1e25)"}},
      h("div",{style:{fontSize:40,marginBottom:10}},"🛠"),
      h("div",{style:{fontSize:19,fontWeight:800,marginBottom:8}},"Bu ekran çizilemedi"),
      h("div",{style:{fontSize:13.5,lineHeight:1.6,color:"var(--mut,#5b616e)",marginBottom:16}},
        "Uygulama açık, sorun tek bir ekranda. Aşağıdaki satırı komutaya ilet — nerede takıldığı oradan anlaşılır."),
      h("pre",{style:{fontSize:11,background:"var(--surf2,#f4f5f7)",border:"1px solid var(--line,#e3e5e9)",
        borderRadius:10,padding:11,whiteSpace:"pre-wrap",wordBreak:"break-word",color:"#9a3412",marginBottom:16}},
        String((e&&e.message)||e)+"\n"+String((e&&e.stack)||"").split("\n").slice(1,4).join("\n")),
      h("button",{onClick:()=>{ try{ sessionStorage.clear(); }catch(_){} location.reload(); },
        style:{width:"100%",padding:14,border:0,borderRadius:14,background:"#1b1e25",color:"#fff",fontSize:15,fontWeight:800}},
        "Ekranı sıfırla ve yenile"),
      h("div",{style:{fontSize:11,color:"var(--mut2,#9aa0ac)",textAlign:"center",marginTop:12,fontWeight:700}},"sürüm "+(typeof SURUM!=="undefined"?SURUM:"—")));
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(h(HataKalkani,null,h(App)));
