async function planKaydir(makineId,plan,edited){

  arr.push({id:edited.id,s:edited.s,dk:edited.dk});
  arr.sort((a,b)=>a.s-b.s);
  let prevEnd=null;
  for(const j of arr){ let s2=j.s;
    if(prevEnd!=null&&s2<prevEnd) s2=prevEnd;

const ZINCIR_RE=/(^|[^a-zçğıöşü])(bim|migros|a\s?-?101|şok|sok\s?market|carrefour(sa)?|file\b|macro\s?center|metro\s?(market|gross)|tespo|hakmar|onur\s?market|happy\s?center|ekomini|beğendik|kipa|tansaş|real\b|seç\s?market|dia\b|snowy|mopaş|pehlivanoğlu|çağrı\s?market|birmar|marketpaşa|ekomax|hopi)([^a-zçğıöşü]|$)/i;

async function kesifGoogle(merkezler, katlar, metre, key){
  const includedTypes=Array.from(new Set(katlar.flatMap(c=>c.gt||[])));
  const gor=new Set(), out=[];
  for(const m of merkezler){
    const body={ includedTypes, maxResultCount:20, rankPreference:"DISTANCE",
      locationRestriction:{ circle:{ center:{latitude:+m.lat,longitude:+m.lng}, radius:Math.min(50000,metre) } } };
    const r=await fetch("https://places.googleapis.com/v1/places:searchNearby",{method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":key,
        "X-Goog-FieldMask":"places.id,places.displayName,places.location,places.types,places.rating,places.userRatingCount,places.nationalPhoneNumber"},
      body:JSON.stringify(body)});
    if(!r.ok){ let e=""; try{ e=(await r.json()).error.message; }catch(x){} throw new Error("Google "+r.status+(e?(" — "+e):"")); }
    const j=await r.json();
    (j.places||[]).forEach(p=>{ const ad=p.displayName&&p.displayName.text; if(!ad||!p.location) return;
      if(gor.has(p.id)) return; gor.add(p.id);
      const tel=(p.nationalPhoneNumber||"").replace(/[^0-9+]/g,"").replace(/^\+?90/,"0");
      out.push({ad, lat:p.location.latitude, lng:p.location.longitude, kat:kesifKatFromGTypes(p.types),
        tel, puanG:(p.rating!=null?p.rating:null), yorum:(p.userRatingCount!=null?num(p.userRatingCount):0)}); });
  }
  return out;
}

async function kesifOverpass(merkezler, katlar, metre){
  const govde=katlar.map(c=>merkezler.map(m=>"nwr"+c.q+"(around:"+metre+","+(+m.lat)+","+(+m.lng)+");").join("")).join("");
  const q="[out:json][timeout:25];("+govde+");out center 300;";
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"data="+encodeURIComponent(q)});
  if(!r.ok) throw new Error("Overpass "+r.status);
  const j=await r.json(); const gor=new Set(), out=[];
  const telNorm=t=>{ let s=(t||"").replace(/[^0-9+]/g,""); if(!s) return ""; s=s.replace(/^\+?90/,"0"); if(s[0]!=="0"&&s.length===10) s="0"+s; return s; };
  (j.elements||[]).forEach(el=>{ const t=el.tags||{}; const ad=t.name; if(!ad) return;
    const la=el.lat!=null?el.lat:(el.center&&el.center.lat), lo=el.lon!=null?el.lon:(el.center&&el.center.lon);
    if(la==null||lo==null) return;
    const key=el.type+"/"+el.id; if(gor.has(key)) return; gor.add(key);
    const tel=telNorm(t.phone||t["contact:phone"]||t["contact:mobile"]||t.mobile||"");
    out.push({ad, lat:la, lng:lo, kat:kesifKatBul(t), tel}); });
  return out;
}
function haversineKm(aLat,aLng,bLat,bLng){ const R=6371, dLa=(bLat-aLat)*Math.PI/180, dLo=(bLng-aLng)*Math.PI/180,
  la1=aLat*Math.PI/180, la2=bLat*Math.PI/180;
  const s=Math.sin(dLa/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s))); }
function pointInPoly(pt,poly){ const x=pt[1],y=pt[0]; let ic=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][1], yi=poly[i][0], xj=poly[j][1], yj=poly[j][0];
    if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) ic=!ic; }
  return ic; }

// planların EFEKTİF başlangıcı — eski panel ile ORTAK kural (birebir):
// geciken başlamamış iş "şimdi"ye kayar; üzerinden başka iş başlatılmışsa (geride) sayılmaz
function planEffBas(plan,now){
  const m={}, byMak={};
  (plan||[]).forEach(p=>{ (byMak[p.makineId||"?"]=byMak[p.makineId||"?"]||[]).push(p); });
  Object.values(byMak).forEach(arr=>{
    arr.sort((a,b)=>new Date(a.baslangic)-new Date(b.baslangic));
    let sonBas=-Infinity;
    arr.forEach(p=>{ if(p.basladi){ const gs=new Date(p.gercekBaslangic||p.baslangic).getTime(); if(gs>sonBas) sonBas=gs; } });
    let cursor=-Infinity;
    arr.forEach(p=>{ const ps=new Date(p.baslangic).getTime(), dur=num(p.sureDk)*60000;
      const geride=!p.basladi && ps<sonBas;
      let s;
      if(p.basladi){ s=new Date(p.gercekBaslangic||p.baslangic).getTime(); }
      else if(geride) s=ps;
      else { s=Math.max(ps,cursor); if(ps<now) s=Math.max(now,cursor); }
      if(!geride) cursor=Math.max(cursor,s+dur);
      if(p.id) m[p.id]={s,geride};
    });
  });
  return m;
}

function makineTimeline(makineId,plan,baslaMs,bitMs,now){

      const gecerli=det.filter(d=>d.tutar>0); const hesap=medEle(gecerli,d=>d.birim); const dinc=new Set(hesap);
      det.forEach(d=>{ if(d.tutar<=0){ d.hesaba=false; d.neden="eksik bilgi"; } else if(!dinc.has(d)){ d.hesaba=false; d.neden="absürt · atlandı"; } else { d.hesaba=true; d.neden=""; } });
      const tt=hesap.reduce((s,d)=>s+d.tutar,0), ta=hesap.reduce((s,d)=>s+d.adet,0);
      autoMaliyet=ta>0?tt/ta:0; autoKaynak=ta>0?"oto":"yok"; maliyetDetay={tur:"urun",rows:det};
    }

    const elle=num(u.maliyet)>0;
    const baskiMaliyet=elle?num(u.maliyet):autoMaliyet;

    const maliyet=baskiMaliyet+sarfMaliyet+iscMaliyet;
    const maliyetKaynak=elle?"elle":autoKaynak;
    const parcaBilgi=parts.map(p=>({p,avail:parcaAvailF(u,p),ger:gerekenP(u,p),takim:parcaTakimF(u,p),basildi:num((bldParca[u.id]||{})[p])}));

    let buHafta=null;
    if(parts.length){ const pp={}; parts.forEach(p=>pp[p]=0); bhB.forEach(p=>{ const kk=plParcaKatki(p,u); for(const pt in kk) pp[pt]=num(pp[pt])+kk[pt]; });

}

// ➕ İŞ EKLE — eski panelin IsModal kayıt şemasıyla birebir uyumlu yazar
function IsEkleSheet({makineler,urunler,plan,filamentler,onKaydet,bekle,kayit,pre}){
  const duzen=!!(kayit&&kayit.id);
  const makList=(makineler||[]).filter(mk=>(mk.ad||"").trim());
  const [makineId,setMakineId]=useState(duzen?(kayit.makineId||""):((pre&&pre.makineId)||(makList[0]&&makList[0].id)||""));
  const urunListe=(urunler||[]).filter(u=>(u.ad||"").trim()).slice().sort((a,b)=>(a.ad||"").localeCompare(b.ad||"","tr"));
  const [urunId,setUrunId]=useState(duzen?(kayit.urunId||""):"");
  const [serbest,setSerbest]=useState(duzen?!kayit.urunId:false);
  const [ad,setAd]=useState(duzen?(kayit.ad||""):"");
  const [parcaSec,setParcaSec]=useState(duzen?((kayit.parcaAdlar||[]).slice()):[]);   // boş ya da tümü = takım
  const [parcaSayi,setParcaSayi]=useState(duzen?{...(kayit.parcaSayi||{})}:{});   // aynı tablada parça başına adet
  const [adet,setAdet]=useState(duzen?(num(kayit.adet)||1):1);
  const [sure,setSure]=useState(duzen?String(num(kayit.sureDk)||""):"");
  const [gram,setGram]=useState(duzen?(kayit.gram?String(kayit.gram):""):"");
  const [filamentId,setFilamentId]=useState(duzen?(kayit.filamentId||""):"");
  const [ams,setAms]=useState(duzen?(kayit.ams!==false):true);
  const [nott,setNott]=useState(duzen?(kayit.not||""):"");
  const filSec=(filamentler||[]).find(f=>f.id===filamentId)||null;
  const maliyet=num(sure)/60*12+num(gram)/1000*(filSec?num(filSec.kgFiyat):0);   // 12 ₺/saat makine
  // önceki baskılar (tekrar için) — ad+adet+süreye göre tekilleştir
  // gerçekten BASILMIŞ işler önce ve gerçek başlangıç saatine göre — ileri tarihli plan "önceki baskı" değildir
  const baskiSira=(a,b)=>((b.basladi?1:0)-(a.basladi?1:0))||(new Date(b.gercekBaslangic||b.baslangic)-new Date(a.gercekBaslangic||a.baslangic));
  const oncekiler=(()=>{ const seen=new Set(), out=[];
    (plan||[]).slice().sort(baskiSira).forEach(p=>{ if(!p.ad) return;
      const k=(p.ad||"")+"|"+num(p.adet)+"|"+num(p.sureDk); if(seen.has(k)) return; seen.add(k); if(out.length<10) out.push(p); }); return out; })();
  const toLoc=ms=>{const d2=new Date(ms); d2.setMinutes(d2.getMinutes()-d2.getTimezoneOffset()); return d2.toISOString().slice(0,16);};
  // varsayılan başlangıç: seçili makinenin kuyruk sonu (efektif) — 5 dk'ya yuvarlanır
  const kuyrukSonu=mid=>{ const now=Date.now(); const eff=planEffBas(plan,now); let son=now;
    (plan||[]).forEach(p2=>{ if(p2.makineId!==mid) return; const e=eff[p2.id]; if(!e||e.geride) return;
      const bit=e.s+num(p2.sureDk)*60000; if(bit>son) son=bit; });
    return Math.ceil(son/300000)*300000; };
  const [bas,setBas]=useState(()=>duzen?toLoc(new Date(kayit.baslangic).getTime()):toLoc((pre&&pre.baslangic)?new Date(pre.baslangic).getTime():kuyrukSonu((pre&&pre.makineId)||(makList[0]&&makList[0].id)||"")));
  const makSec=id=>{ setMakineId(id); setBas(toLoc(kuyrukSonu(id))); };
  // ⏱ süre ↔ bitiş saati: hangisini girersen diğeri kendiliğinden hesaplanır
  const bitDeger=()=>{ const sMs=bas?new Date(bas).getTime():NaN; const d=num(sure);
    return (isNaN(sMs)||d<=0)?"":toLoc(sMs+d*60000); };
  const bitDegisti=v=>{ if(!v||!bas) return; const sMs=new Date(bas).getTime(), eMs=new Date(v).getTime();
    if(isNaN(sMs)||isNaN(eMs)) return; const dk=Math.round((eMs-sMs)/60000); if(dk>0) setSure(String(dk)); };
  const tekrarla=p=>{ const u=urunListe.find(x=>x.id===p.urunId); if(u){ setSerbest(false); setUrunId(u.id); } else { setSerbest(true); setAd(p.ad||""); setUrunId(""); }
    setParcaSec((p.parcaAdlar||[]).slice()); setParcaSayi({...(p.parcaSayi||{})}); setAdet(num(p.adet)||1); setSure(String(num(p.sureDk)||"")); setGram(p.gram?String(p.gram):""); setFilamentId(p.filamentId||""); setAms(p.ams!==false); setNott(p.not||""); };

  const psVar=kapsanan.some(pt=>num(parcaSayi[pt])>0);   // parça başına adet girilmiş mi

  const cakismaIs=(()=>{ if(!bas||!(num(sure)>0)||!makineId) return null; const s=new Date(bas).getTime(), e=s+num(sure)*60000;
    return (plan||[]).find(p=>{ if(duzen&&p.id===kayit.id) return false; if(p.makineId!==makineId||!p.basladi) return false;

    // parça başına adet girildiyse haritayı yaz; genel adet = kaç takıma yettiği

    if(psVar){ psOut={}; kapsanan.forEach(pt=>{ psOut[pt]=Math.max(0,Math.round(psDeger(pt))); }); adetOut=takimEs; }

    const gercekN=basladiN?((duzen&&kayit.gercekBaslangic)||new Date(bas).toISOString()):null;

    onKaydet({ ...(duzen?{id:kayit.id,_eski:{makineId:kayit.makineId,baslangic:kayit.baslangic,sureDk:num(kayit.sureDk)}}:{}),

// sağa kaydır → 🗑 Sil çıkar
function SwipeSil({onSil,children}){
  const [dx,setDx]=useState(0); const [drag,setDrag]=useState(false); const st=useRef(0); const sw=useRef(false);
  const TS=e=>{ st.current=e.touches[0].clientX-dx; setDrag(true); };
  const TM=e=>{ let d=e.touches[0].clientX-st.current; setDx(Math.max(0,Math.min(88,d))); };
  const TE=()=>{ setDrag(false); if(Math.abs(dx)>8) sw.current=true; setDx(dx>44?80:0); };
  return h("div",{style:{position:"relative",overflow:"hidden",borderRadius:16}},
    h("button",{onClick:()=>{ sw.current=false; setDx(0); onSil(); },style:{position:"absolute",left:0,top:0,bottom:0,width:80,background:"#e0483c",color:"#fff",fontSize:13.5,fontWeight:800,display:"flex",alignItems:"center",justifyContent:"center"}},"Sil"),
    h("div",{onTouchStart:TS,onTouchMove:TM,onTouchEnd:TE,onClickCapture:e=>{ if(sw.current){ e.preventDefault(); e.stopPropagation(); sw.current=false; } },
      style:{position:"relative",transform:"translateX("+dx+"px)",transition:drag?"none":"transform .22s"}},children));
}
function Us({d,ac,hareketler,go,talepler,onTalep,onMesaj,onTalepSil}){
  const P="20px 16px 0";

  const [acikP,setAcikP]=useState(null);   // sahada — hangi pazarlamacının adımları açık
  const et=t=>IK({satis:"satis",tahsilat:"tahsilat",konsinye:"konsinye",hediye:"hediye",iade:"iade",stant:"stant",diplomasi:"diplomasi"}[t]||"mesaj","var(--mut)",15);
  const izle=["satis","tahsilat","konsinye","iade","stant","diplomasi","hediye"];
  // her pazarlamacının SON hareketi (nerede/ne yaptı) + son adımları — memo (her render'da tüm hareketleri taramasın)
  const {sonHar,harByK}=useMemo(()=>{ const sonHar={}, harByK={};
    har.forEach(x=>{ const id=x.kullaniciId; if(!id||!izle.includes(x.tip)) return;

      (harByK[id]||(harByK[id]=[])).push(x); });

  async function uretimMontaj(s,n,hedef){ const u=s.raw; n=Math.floor(num(n)); if(n<1) return;
    try{ const parcalar=u.parcalar||[];
      if(parcalar.length){ if(s.montajda<n) return say("Montajda "+s.montajda+" takım hazır");
        const elle=Math.max(0,num(u.montajElle)), elleDus=Math.min(elle,n), kalan=n-elleDus;
        const tk={...(u.parcaTuket||{})}; if(kalan>0) parcalar.forEach(p=>tk[p]=num(tk[p])+kalan*gerekenP(u,p));
        const ek=hedef==="stokta"?{stokta:increment(n)}:{zayiat:increment(n)};
        const patch={id:u.id,parcaTuket:tk,...ek}; if(elleDus) patch.montajElle=increment(-elleDus);
        await save("stok_urun",patch);
      } else { if(s.montajda<n) return say("Montajda "+s.montajda+" hazır");
        const ek=hedef==="stokta"?{montajBitti:increment(n),stokta:increment(n)}:{zayiat:increment(n)};
        await save("stok_urun",{id:u.id,...ek}); }
      if(hedef==="stokta") await stokLogla(u,+n,"uretim");
      say(hedef==="stokta"?("📥 "+n+" adet stoğa eklendi"):("⚠ "+n+" zayiat")); }
    catch(e){ console.error(e); say("İşlem başarısız"); } }

      const byK={}; changes.forEach(c=>{ (byK[c.kullaniciId||""]||(byK[c.kullaniciId||""]=[])).push(c); });
      for(const kid of Object.keys(byK)){ if(!kid) continue; const arr=byK[kid]; const kad=(kullanicilar||[]).find(u=>u.id===kid);
        const satirlar=arr.map(c=>"• "+c.adet+"× "+c.urunAd+(c.yer?(" ("+c.yer+")"):"")+" · "+fmtS(c.tarih)+"\n   veriliş "+tl(c.eskiAlis)+" → "+tl(c.yeniAlis)+" · hakediş "+tl(c.adet*(c.satisFiyat-c.yeniAlis))).join("\n");
        await save("talep",{kaynak:"komuta",kullaniciId:kid,kullaniciAd:kad?kad.ad:"",simge:kad?(kad.simge||"👑"):"👑",tip:"hakediş",konumIste:false,durum:"acik",tarih:new Date().toISOString(),
          mesaj:"Hakediş güncellendi ("+arr.length+" satış):\n"+satirlar}); }
      say("💾 "+changes.length+" fiyat güncellendi · pazarlamacılara bildirildi");
    }catch(e){ console.error(e); say("Kaydedilemedi — tekrar dene"); } }
  async function isBaslat(x){ if(!confirm("Başlat\n"+(x.p.ad||"iş")+"\n"+x.mkAd)) return;
    try{ await save("plan",{id:x.p.id,basladi:true,gercekBaslangic:new Date().toISOString()}); setModal(null); say("▶Başladı · "+(x.p.ad||"iş")); }
    catch(e){ console.error(e); say("Başlatılamadı"); } }
  async function tablaTopla(p){ if(!p||!p.id) return; if(!confirm("🧹 "+(p.ad||"baskı")+" tablası toplandı olarak işaretlensin mi?")) return;
    try{ await save("plan",{id:p.id,tablaAlindi:true}); say("Tabla toplandı · "+(p.ad||"iş")); }
    catch(e){ console.error(e); say("İşlenemedi"); } }
  const [silinen,setSilinen]=useState(null); const silT=useRef(null);
  async function isSil(x){
    const msj=(x.p.basladi&&x.durum==="basiyor")
      ?("⚠ \""+(x.p.ad||"iş")+"\" ŞU AN BASILIYOR.\nİptal edilip plandan silinsin mi?")
      :("🗑 "+(x.p.ad||"iş")+" plandan silinsin mi?");
    if(!confirm(msj)) return;
    try{ const yedek={...x.p}; await remove("plan",x.p.id); setModal(null);
      setSilinen({p:yedek}); clearTimeout(silT.current); silT.current=setTimeout(()=>setSilinen(null),8000);   // 8 sn geri alınabilir
    }catch(e){ console.error(e); say("Silinemedi"); } }
  async function silGeriAl(){ if(!silinen) return;
    try{ await save("plan",{...silinen.p}); clearTimeout(silT.current); setSilinen(null); say("Geri alındı · "+(silinen.p.ad||"iş")); }
    catch(e){ console.error(e); say("Geri alınamadı"); } }
  // (geri tuşu yönetimi yukarıda BACK_STACK ile — açık Sheet'ler otomatik kapanır)
  // 🔐 giriş kapısı — giriş yoksa PIN ekranına, yönetici değilse pazarlamacı sayfasına yönlen
  // ⚠️ liste BOŞ gelirse (bağlantı hatası / zaman aşımı) kullanıcıyı ATMA — yalnız gerçekten yüklendiyse karar ver
  useEffect(()=>{ if(!BEN_ID){ location.replace("index.html?giris=1"); return; }
    if(kullanicilar&&kullanicilar.length){ const me=kullanicilar.find(u=>u.id===BEN_ID);
      if(!me){ location.replace("index.html?giris=1"); return; }
      if(me.rol!=="admin") location.replace("deneme.html"); } },[kullanicilar]);
  const benKul=kullanicilar?kullanicilar.find(u=>u.id===BEN_ID):undefined;
  const yetkili=!!(BEN_ID&&benKul&&benKul.rol==="admin");
  const engelle=h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}},
    h("div",{style:{width:44,height:44,borderRadius:"50%",border:"3px solid var(--line)",borderTopColor:"var(--cyan)",animation:"spin .8s linear infinite"}}),
    h("div",{style:{color:"var(--mut)",fontSize:14,fontWeight:600}},"Giriş gerekli — yönlendiriliyor…"));
  if(!BEN_ID) return engelle;                                  // giriş yok
  if(kullanicilar&&kullanicilar.length&&!yetkili) return engelle;   // kullanıcı bulunamadı ya da yönetici değil
  if(kullanicilar&&!kullanicilar.length) return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14,padding:24,textAlign:"center"}},
    h("div",{style:{fontSize:15,fontWeight:800}},"Bağlantı kurulamadı"),
    h("div",{style:{color:"var(--mut)",fontSize:13,fontWeight:600,maxWidth:300}},"Sunucudan veri alınamadı. İnternetini kontrol edip tekrar dene."),
    h("button",{onClick:()=>location.reload(),style:{padding:"12px 22px",borderRadius:14,background:"var(--cyan)",color:"#fff",fontSize:14,fontWeight:800}},"Tekrar dene"),
    h("button",{onClick:()=>location.href="index.html?giris=1",style:{padding:"8px 14px",fontSize:12.5,fontWeight:800,color:"var(--mut)"}},"Hesap değiştir"));
  if(yuk) return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16}},
    h("div",{style:{width:44,height:44,borderRadius:"50%",border:"3px solid var(--line)",borderTopColor:"var(--cyan)",animation:"spin .8s linear infinite"}}),
    h("div",{style:{color:"var(--mut)",fontSize:14,fontWeight:600}},"Komuta merkezi hazırlanıyor…"));
  let ekran;
  if(view==="us") ekran=h(Us,{d,ac:setModal,hareketler,go,talepler,onTalep:(t)=>setModal({tip:"talep",t}),onMesaj:()=>setModal({tip:"mesaj"}),onTalepSil:talepSil});
  else if(view==="uretim") ekran=h(Uretim,{d,plan,makineler,ac:setModal,onTabla:tablaTopla,fotoMap});
  else if(view==="stok") ekran=h(Stok,{d,ac:setModal,fotoMap});
  else if(view==="ekip") ekran=h(Ekip,{d,ac:setModal,kullanicilar,hareketler,talepler});
  else ekran=h(RaporA,{d,ac:setModal,hareketler,ekip:d.ekip,musteriler,kullanicilar,gkey,hedefler,onGorevKaydet:gorevKaydet,onGorevSil:gorevSil,odak:hedefOdak,onHakedisKaydet:hakedisKaydet,onAlacakKapat:alacakKapat,onAlacakSil:alacakSil,talepler,onTablaEmri:tablaOdemeEmri,onTablaIptal:tablaOdemeIptal});
  return h("div",null,
    h(KomutaBar,{gorunum,yan:yanMenu,onGorunum:gorunumTog,onAyar:()=>setModal({tip:"komutaAyar"}),onTema:()=>setModal({tip:"tema"}),onCikis:cikisYap}),
    h("div",{className:"tk-barbosluk"}),
    veriHata?h("div",{style:{margin:"8px 12px 0",padding:"9px 13px",borderRadius:12,background:"#fff7ed",border:"1px solid #fdba74",fontSize:12,fontWeight:700,color:"#9a3412"}},
      "Sunucu veri kotası dolu — kayıtlı önbellek gösteriliyor. Yarın otomatik düzelir."):null,
    ekran,
    h(Nav,{aktif:view,go,deneyIk,onDeney:()=>setDeneyIk(v=>!v),pc:yanMenu}),
    silinen?h("div",{className:"fade",style:{position:"fixed",left:"50%",bottom:108,transform:"translateX(-50%)",zIndex:61,
      background:"#1b1e25",color:"#fff",padding:"11px 14px",borderRadius:14,fontSize:13,fontWeight:600,
      boxShadow:"0 12px 40px rgba(0,0,0,.28)",display:"flex",alignItems:"center",gap:12,maxWidth:"90%"}},
      h("span",{style:{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},"🗑 \""+(silinen.p.ad||"iş")+"\" silindi"),
      h("button",{onClick:silGeriAl,style:{flexShrink:0,padding:"7px 12px",borderRadius:10,background:"var(--cyan)",color:"#fff",fontSize:12.5,fontWeight:800}},"Geri al")):null,
    h(Toast,{msg:toastMsg}),
    modal&&modal.tip==="is"&&h(IsSheet,{x:modal.x,foto:(fotoMap[(modal.x.p||{}).urunId]||{}).data,onClose:()=>setModal(null),onBaslat:()=>isBaslat(modal.x),onSil:()=>isSil(modal.x),
      onDuzen:()=>setModal({tip:"isEkle",kayit:modal.x.p})}),
    modal&&modal.tip==="isEkle"&&h(IsEkleSheet,{makineler,urunler,plan,filamentler,bekle:isBekle,onKaydet:isKaydet,kayit:modal.kayit||null,pre:modal.pre||null}),
    modal&&modal.tip==="makineYonet"&&h(MakineYonetimSheet,{makineler,onClose:()=>setModal(null),onAc:setModal}),
    modal&&modal.tip==="makineDuzen"&&h(MakineDuzenSheet,{mk:modal.mk,bekle:isBekle,onKaydet:makineKaydet,onSil:makineSil}),
    modal&&modal.tip==="filamentYonet"&&h(FilamentYonetimSheet,{filamentler,onClose:()=>setModal(null),onAc:setModal}),
    modal&&modal.tip==="filamentDuzen"&&h(FilamentDuzenSheet,{fl:modal.fl,bekle:isBekle,onKaydet:filamentKaydet,onSil:filamentSil}),
    modal&&modal.tip==="ayar"&&h(AyarSheet,{ayar,bekle:isBekle,onKaydet:ayarKaydet}),
    modal&&modal.tip==="talep"&&h(TalepCevapSheet,{talep:modal.t,bekle:isBekle,onKaydet:talepCevap,onRota:talepRota,onSil:talepSil}),
    modal&&modal.tip==="mesaj"&&h(KomutaMesajSheet,{ekip:d.ekip,bekle:isBekle,onKaydet:talepYaz}),
    modal&&modal.tip==="sarfYonet"&&h(SarfYonetimSheet,{sarflar,stok:d.stok,bekle:isBekle,onClose:()=>setModal(null),
      onKaydet:async(x)=>{ if(isBekle) return; setIsBekle(true);
        try{ await save("sarf",{...(x.id?{id:x.id}:{}),ad:x.ad,birim:x.birim,stokta:num(x.stokta),birimFiyat:num(x.birimFiyat)}); say(x.id?"Güncellendi":"Malzeme eklendi"); }
        catch(e){ console.error(e); say("Kaydedilemedi"); } finally{ setIsBekle(false); } },
      onSil:async(id)=>{ if(isBekle) return; setIsBekle(true);
        try{ await remove("sarf",id); say("Silindi"); }catch(e){ console.error(e); say("Silinemedi"); } finally{ setIsBekle(false); } }}),
    modal&&modal.tip==="urunDuzen"&&h(UrunDuzenSheet,{u:modal.u,bekle:isBekle,onKaydet:urunKaydet,kullanicilar,sarflar}),
    modal&&modal.tip==="kullanici"&&h(KullaniciSheet,{u:modal.u,bekle:isBekle,onKaydet:kullaniciKaydet}),
    modal&&modal.tip==="ekip"&&(()=>{ const cu=(kullanicilar||[]).find(x=>x.id===modal.e.u.id)||modal.e.u;   // canlı kayıt (şifre kaydedince tazelensin)
      const kt=(talepler||[]).filter(x=>(x.kullaniciId||"")===cu.id).sort((a,b)=>new Date(b.tarih)-new Date(a.tarih));
      return h(EkipSheet,{e:{...modal.e,u:cu},bekle:isBekle,onClose:()=>setModal(null),onDuzen:()=>setModal({tip:"kullanici",u:cu}),
        onSil:kullaniciSil,onArsiv:kullaniciArsivle,onArsivGeri:kullaniciArsivGeri,onSifre:sifreSet,onView:sifreGor,
        kisiTalep:kt,onTalep:t=>setModal({tip:"talep",t})}); })(),
    modal&&modal.tip==="stok"&&(()=>{ const s=(d.stok.find(x=>x.id===modal.u.id)||modal.u);
      return h(StokSheet,{u:s,kullanicilar,hareketler,makineler,foto:(fotoMap[s.id]||{}).data,onFoto:f=>urunFotoEkle(s.id,f),onFotoSil:()=>urunFotoSil(s.id),onClose:()=>setModal(null),onDuzen:()=>setModal({tip:"urunDuzen",u:s}),
        onGecmis:(uu)=>setModal({tip:"stokGec",u:uu}),onKomut:stage=>setModal({tip:"stokKomut",cfg:uretimAksiyonlariCfg(s,stage),uid:s.id}),onParca:(p,v)=>uretimParcaAyarla(s,p,v),onMaliyet:(uu)=>setModal({tip:"maliyetGec",u:uu,uid:s.id})}); })(),
    modal&&modal.tip==="maliyetGec"&&h(MaliyetGecmisSheet,{u:modal.u,onClose:()=>setModal(null)}),
    modal&&modal.tip==="stokKomut"&&h(StokKomutSheet,{cfg:modal.cfg,onClose:()=>setModal(null)}),
    modal&&modal.tip==="stokGec"&&h(StokGecmisSheet,{u:modal.u,stokHareket,onClose:()=>setModal(null)}),
    modal&&modal.tip==="komutaAyar"&&h(KomutaAyarSheet,{ad:((kullanicilar||[]).find(u=>u.id===BEN_ID)||{}).ad,gorunum,onGorunum:gorunumTog,onSifre:sifremiDegistir,onClose:()=>setModal(null)}),
    modal&&modal.tip==="yazismalar"&&h(YazismalarSheet,{talepler,kullanicilar,onAc:t=>setModal({tip:"talep",t}),onClose:()=>setModal(null)}),
    modal&&modal.tip==="uyariStok"&&h(StokUyariSheet,{d,onClose:()=>setModal(null),onGit:()=>{ setModal(null); go("stok"); }}),
    modal&&modal.tip==="uyariAlacak"&&h(AlacakUyariSheet,{d,onClose:()=>setModal(null),onGit:()=>{ setModal(null); go("rapor"); }}),
    modal&&modal.tip==="hudOzet"&&h(HudOzetSheet,{tip:modal.oz,d,onClose:()=>setModal(null),onGit:()=>{ setModal(null); go(modal.oz==="ciro"?"rapor":"uretim"); }}),
    modal&&modal.tip==="tema"&&h(TemaSheet,{tema,onSec:k=>{ setTema(k); say((TEMALAR[k]||{}).ik+" "+(TEMALAR[k]||{}).ad+" teması"); },onClose:()=>setModal(null)}),
    h("div",{style:{height:18}}));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
