name: Bambu makara çekimi

# Bambu bulut hesabından AMS yuvalarını okur, Tikita makine kayıtlarına yazar.
# Gerekli secret: BAMBU_TOKEN  (arac/bambu/giris.mjs çıktısı)
# Şimdilik yalnız ELLE tetiklenir. Düzenli çalışsın istersen aşağıdaki
# schedule satırlarının başındaki # işaretlerini kaldır.
on:
  workflow_dispatch:
    inputs:
      kuru:
        description: "Kuru çalışma (yalnız göster, yazma)"
        type: boolean
        default: true
  # schedule:
  #   - cron: "*/30 5-18 * * *"   # 08:00-21:00 arası yarım saatte bir (TR)

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Secret yoksa atla
        id: kontrol
        env:
          BAMBU_TOKEN: ${{ secrets.BAMBU_TOKEN }}
        run: |
          if [ -z "$BAMBU_TOKEN" ]; then
            echo "BAMBU_TOKEN tanımlı değil — atlanıyor."
            echo "var=0" >> "$GITHUB_OUTPUT"
          else
            echo "var=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Bağımlılıklar
        if: steps.kontrol.outputs.var == '1'
        working-directory: arac/bambu
        run: npm install --no-audit --no-fund

      - name: Çek
        if: steps.kontrol.outputs.var == '1'
        working-directory: arac/bambu
        env:
          BAMBU_TOKEN: ${{ secrets.BAMBU_TOKEN }}
        run: node cek.mjs ${{ (github.event_name == 'workflow_dispatch' && inputs.kuru) && '--kuru' || '' }}
