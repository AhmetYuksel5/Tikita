name: Bambu

# Bambu bağlantısı GitHub konusundan yönetilir — bilgisayar gerekmez.
# Telefondan başlığında "bambu" geçen bir konu aç, yorum yaz, cevabı yorum al.
# Gerekli gizli anahtarlar: BAMBU_EPOSTA, BAMBU_SIFRE
# Yalnız depo sahibinin yorumlarına yanıt verir.
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

concurrency:
  group: bambu-bot
  cancel-in-progress: false

jobs:
  bot:
    if: >-
      github.event.sender.login == github.repository_owner &&
      !github.event.issue.pull_request &&
      (contains(github.event.issue.title, 'ambu') || contains(github.event.issue.title, 'AMBU'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: arac/bambu
        run: npm install --no-audit --no-fund
      - working-directory: arac/bambu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BAMBU_EPOSTA: ${{ secrets.BAMBU_EPOSTA }}
          BAMBU_SIFRE: ${{ secrets.BAMBU_SIFRE }}
        run: node bot.mjs
